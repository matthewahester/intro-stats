<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img">
  <title>Reading the slope as rise over run</title>
  <desc>The fitted line with two step triangles drawn under it, one of a single hour and one of four hours, each labelled with the drop in beats per minute.</desc>
  <rect x="0" y="0" width="760" height="500" fill="#ffffff"/>
  <line x1="88" y1="394" x2="658" y2="394" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="88" y1="104" x2="88" y2="394" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="88" y1="394" x2="658" y2="394" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="88" y1="347.226" x2="658" y2="347.226" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="88" y1="300.452" x2="658" y2="300.452" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="88" y1="253.677" x2="658" y2="253.677" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="88" y1="206.903" x2="658" y2="206.903" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="88" y1="160.129" x2="658" y2="160.129" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="88" y1="113.355" x2="658" y2="113.355" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="123.185" y1="394" x2="123.185" y2="398" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="123.185" y="411" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0</text>
  <line x1="193.556" y1="394" x2="193.556" y2="398" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="193.556" y="411" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">1</text>
  <line x1="263.926" y1="394" x2="263.926" y2="398" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="263.926" y="411" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">2</text>
  <line x1="334.296" y1="394" x2="334.296" y2="398" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="334.296" y="411" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">3</text>
  <line x1="404.667" y1="394" x2="404.667" y2="398" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="404.667" y="411" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">4</text>
  <line x1="475.037" y1="394" x2="475.037" y2="398" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="475.037" y="411" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">5</text>
  <line x1="545.407" y1="394" x2="545.407" y2="398" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="545.407" y="411" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">6</text>
  <line x1="615.778" y1="394" x2="615.778" y2="398" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="615.778" y="411" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">7</text>
  <line x1="84" y1="394" x2="88" y2="394" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="80" y="397.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">55</text>
  <line x1="84" y1="347.226" x2="88" y2="347.226" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="80" y="351.026" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">60</text>
  <line x1="84" y1="300.452" x2="88" y2="300.452" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="80" y="304.252" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">65</text>
  <line x1="84" y1="253.677" x2="88" y2="253.677" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="80" y="257.477" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">70</text>
  <line x1="84" y1="206.903" x2="88" y2="206.903" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="80" y="210.703" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">75</text>
  <line x1="84" y1="160.129" x2="88" y2="160.129" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="80" y="163.929" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">80</text>
  <line x1="84" y1="113.355" x2="88" y2="113.355" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="80" y="117.155" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">85</text>
  <text x="373" y="432" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">Hours of aerobic exercise per week</text>
  <text x="373" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">The slope is the same step everywhere on the line</text>
  <text x="88" y="62" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">Resting heart rate (beats per minute)</text>
  <circle cx="123.185" cy="132.065" r="3.6" fill="#c9d1d9"/>
  <circle cx="193.556" cy="206.903" r="3.6" fill="#c9d1d9"/>
  <circle cx="263.926" cy="253.677" r="3.6" fill="#c9d1d9"/>
  <circle cx="334.296" cy="225.613" r="3.6" fill="#c9d1d9"/>
  <circle cx="404.667" cy="281.742" r="3.6" fill="#c9d1d9"/>
  <circle cx="475.037" cy="263.032" r="3.6" fill="#c9d1d9"/>
  <circle cx="545.407" cy="347.226" r="3.6" fill="#c9d1d9"/>
  <circle cx="615.778" cy="356.581" r="3.6" fill="#c9d1d9"/>
  <polyline points="95.037,148.903 650.963,370.613" fill="none" stroke="#c2622d" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="263.926" y1="216.258" x2="334.296" y2="216.258" stroke="#3f7a52" stroke-width="2" stroke-linecap="round"/>
  <line x1="334.296" y1="216.258" x2="334.296" y2="244.323" stroke="#3f7a52" stroke-width="2" stroke-linecap="round"/>
  <circle cx="263.926" cy="216.258" r="4" fill="#3f7a52"/>
  <circle cx="334.296" cy="244.323" r="4" fill="#3f7a52"/>
  <text x="299.111" y="208.258" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3f7a52" text-anchor="middle">one more hour</text>
  <text x="342.296" y="234.29" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3f7a52" text-anchor="start">3 fewer beats</text>
  <line x1="334.296" y1="244.323" x2="615.778" y2="244.323" stroke="#6b5b95" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/>
  <line x1="615.778" y1="244.323" x2="615.778" y2="356.581" stroke="#6b5b95" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/>
  <text x="475.037" y="236.323" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b5b95" text-anchor="middle">four more hours</text>
  <text x="605.778" y="304.452" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b5b95" text-anchor="end">12 fewer beats</text>
  <rect x="356" y="120" width="300" height="74" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.1"/>
  <text x="370" y="142" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">Twelve beats over four hours is three</text>
  <text x="370" y="157" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">beats per hour. The slope does not</text>
  <text x="370" y="172" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">depend on where the step starts.</text>
  <text x="88" y="458" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Say the slope with its units: comparing two patients an hour apart in weekly exercise,</text>
  <text x="88" y="476" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">the busier exerciser has a resting heart rate about three beats per minute lower.</text>
</svg>
