  <text x="240" y="339" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">70</text>
  <line x1="280" y1="320" x2="280" y2="325" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="280" y="339" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">80</text>
  <line x1="75" y1="320" x2="80" y2="320" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="72" y="324" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">16</text>
