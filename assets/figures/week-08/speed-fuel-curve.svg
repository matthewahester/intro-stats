  <text x="595.45" y="339" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">80</text>
  <text x="507.5" y="360" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19">Speed (miles per hour)</text>
  <text x="354" y="195" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19" transform="rotate(-90 354 195)">Residual (mpg)</text>
  <line x1="395" y1="295" x2="400" y2="295" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="392" y="299" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">−4</text>
  <line x1="395" y1="245" x2="400" y2="245" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="392" y="249" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">−2</text>
  <line x1="395" y1="195" x2="400" y2="195" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="392" y="199" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">0</text>
  <line x1="395" y1="145" x2="400" y2="145" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="392" y="149" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">+2</text>
  <line x1="395" y1="95" x2="400" y2="95" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="392" y="99" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">+4</text>
  <line x1="400" y1="195" x2="615" y2="195" stroke="#1c1b19" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="419.55" cy="290" r="5" fill="#8a4a2b" stroke="none" stroke-width="1"/>
  <circle cx="439.09" cy="220" r="5" fill="#8a4a2b" stroke="none" stroke-width="1"/>
  <circle cx="458.64" cy="177.5" r="5" fill="#8a4a2b" stroke="none" stroke-width="1"/>
  <circle cx="478.18" cy="155" r="5" fill="#8a4a2b" stroke="none" stroke-width="1"/>
  <circle cx="497.73" cy="132.5" r="5" fill="#8a4a2b" stroke="none" stroke-width="1"/>
  <circle cx="517.27" cy="140" r="5" fill="#8a4a2b" stroke="none" stroke-width="1"/>
  <circle cx="536.82" cy="145" r="5" fill="#8a4a2b" stroke="none" stroke-width="1"/>
  <circle cx="556.36" cy="185" r="5" fill="#8a4a2b" stroke="none" stroke-width="1"/>
  <circle cx="575.91" cy="220" r="5" fill="#8a4a2b" stroke="none" stroke-width="1"/>
  <circle cx="595.45" cy="290" r="5" fill="#8a4a2b" stroke="none" stroke-width="1"/>
  <text x="507" y="30" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19" font-weight="bold">Residual plot: an arch</text>
  <text x="507" y="50" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#3a3935">below 0, then above, then below</text>
  <text x="320" y="388" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">Hypothetical test drives. A fairly high R² does not mean a line has the right shape.</text>
</svg>
