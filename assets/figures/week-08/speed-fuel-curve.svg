  <text x="72" y="174" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">28</text>
  <line x1="75" y1="120" x2="80" y2="120" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="72" y="124" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">32</text>
