<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="title desc">
  <title id="title">A straight line fitted to curved values, and the residual plot that exposes the curve</title>
  <desc id="desc">Left: fuel efficiency of one hypothetical car at speeds from 35 to 80 mph, with a straight line, R-squared 0.79. Right: the residuals are negative at both ends and positive in the middle, forming an arch.</desc>
