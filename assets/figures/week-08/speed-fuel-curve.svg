  <line x1="80" y1="320" x2="300" y2="320" stroke="#1c1b19" stroke-width="1.5"/>
  <line x1="80" y1="320" x2="80" y2="70" stroke="#1c1b19" stroke-width="1.5"/>
  <line x1="80" y1="320" x2="80" y2="325" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="80" y="339" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">30</text>
  <line x1="120" y1="320" x2="120" y2="325" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="120" y="339" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">40</text>
