  <text x="190" y="360" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19">Speed (miles per hour)</text>
  <text x="34" y="195" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19" transform="rotate(-90 34 195)">Fuel efficiency (mpg)</text>
  <line x1="100" y1="77.5" x2="280" y2="246.25" stroke="#1c1b19" stroke-width="2.5"/>
  <circle cx="100" cy="125" r="5" fill="#35566b" stroke="none" stroke-width="1"/>
  <circle cx="120" cy="108.75" r="5" fill="#35566b" stroke="none" stroke-width="1"/>
