<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Predicting with the mean alone versus the least-squares line: the line leaves a much smaller sum of squared residuals</title>
