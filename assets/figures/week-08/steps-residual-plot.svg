  <text x="282.8" y="254.92" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19">Adult D: −3.10 bpm (below the line)</text>
  <text x="320" y="392" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">Dashed line: residual = 0. No curve and no fan shape: a straight line looks reasonable here.</text>
