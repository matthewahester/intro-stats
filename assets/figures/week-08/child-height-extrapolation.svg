  <circle cx="162.81" cy="259.2" r="4.5" fill="#35566b" stroke="none" stroke-width="1"/>
  <circle cx="179.38" cy="250.8" r="4.5" fill="#35566b" stroke="none" stroke-width="1"/>
  <circle cx="195.94" cy="243.6" r="4.5" fill="#35566b" stroke="none" stroke-width="1"/>
