  <circle cx="245.62" cy="223.2" r="4.5" fill="#35566b" stroke="none" stroke-width="1"/>
  <circle cx="576.88" cy="67.44" r="7" fill="#8a4a2b" stroke="none" stroke-width="1"/>
  <text x="564.88" y="55.44" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="end" fill="#8a4a2b" font-weight="bold">Line's prediction at age 30: about 269 cm</text>
