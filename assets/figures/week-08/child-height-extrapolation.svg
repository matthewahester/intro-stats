<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Extrapolation: a growth line for children aged 2 to 10, carried out to age 30</title>
  <desc id="desc">Heights of 9 hypothetical children aged 2 to 10 lie close to the line predicted height = 76.2 + 6.42 × age, R-squared 0.995. At age 30 the line predicts about 269 cm, far above the 150 to 190 cm of most adults.</desc>
  <rect x="0" y="0" width="640" height="400" fill="#ffffff" stroke="none" stroke-width="1.5"/>
  <rect x="113.12" y="30" width="132.5" height="300" fill="#c9d8e1" stroke="none" stroke-width="1.5"/>
  <text x="179.38" y="48" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#35566b" font-weight="bold">Ages in the data</text>
  <text x="179.38" y="64" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#35566b" font-weight="bold">2 to 10</text>
  <rect x="80" y="162" width="530" height="48" fill="#d3e0c8" stroke="none" stroke-width="1.5"/>
  <text x="601.72" y="202" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#4d6b3c" font-weight="bold">Most adults: about 150 to 190 cm</text>
