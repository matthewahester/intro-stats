  <text x="162.81" y="349" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">5</text>
  <line x1="245.62" y1="330" x2="245.62" y2="335" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="245.62" y="349" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">10</text>
  <line x1="328.44" y1="330" x2="328.44" y2="335" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="328.44" y="349" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">15</text>
  <line x1="411.25" y1="330" x2="411.25" y2="335" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="411.25" y="349" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">20</text>
  <line x1="494.06" y1="330" x2="494.06" y2="335" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="494.06" y="349" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">25</text>
  <line x1="576.88" y1="330" x2="576.88" y2="335" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="576.88" y="349" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">30</text>
