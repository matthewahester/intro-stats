  <circle cx="572.9" cy="300" r="5.5" fill="#35566b" stroke="none" stroke-width="1"/>
  <text x="563.9" y="307" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">J</text>
