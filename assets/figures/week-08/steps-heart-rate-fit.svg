  <text x="372.9" y="95" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="start" fill="#8a4a2b" font-weight="bold">Adult F: observed 80 bpm</text>
  <text x="372.9" y="113" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19">Predicted: 84.0 − 1.50(6.3) = 74.55</text>
  <text x="372.9" y="131" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19">Residual: 80 − 74.55 = +5.45 bpm</text>
  <line x1="98.55" y1="236" x2="124.55" y2="236" stroke="#1c1b19" stroke-width="2.5"/>
  <text x="132.55" y="240" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19">Least-squares line: ŷ = 84.0 − 1.50x</text>
  <circle cx="111.55" cy="256" r="5.5" fill="#35566b" stroke="none" stroke-width="1"/>
