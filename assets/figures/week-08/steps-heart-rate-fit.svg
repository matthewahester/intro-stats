<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Resting heart rate against daily steps for 10 hypothetical adults, with the least-squares line and one residual</title>
