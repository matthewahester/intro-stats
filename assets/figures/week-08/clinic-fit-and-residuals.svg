  <text x="351.889" y="125.321" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">this patient: measured 70, line says 74</text>
  <text x="351.889" y="146.388" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#a33a3a" text-anchor="start">residual is 70 minus 74, or -4 bpm</text>
  <text x="88" y="484" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Each dashed segment is one residual: the vertical gap between a patient and the line.</text>
  <text x="88" y="502" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Least squares picks the line that makes the total of the squared gaps as small as it can be.</text>
