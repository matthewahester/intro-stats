<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" width="820" height="540" role="img">
  <title>A labelled regression output block</title>
  <desc>A block of printed regression output with four numbers boxed in colour and a colour matched note beneath each one naming what it is.</desc>
  <rect x="0" y="0" width="820" height="540" fill="#ffffff"/>
  <text x="410" y="32" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">Where each number sits in a printed regression summary</text>
  <text x="410" y="52" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">Height in centimetres of 24 greenhouse seedlings against days since planting</text>
  <rect x="60" y="72" width="430" height="216" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="78" y="98" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold">Coefficients</text>
  <text x="250" y="126" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1f2933" text-anchor="end" font-weight="bold">Estimate</text>
  <text x="358" y="126" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1f2933" text-anchor="end" font-weight="bold">Std. Error</text>
  <text x="458" y="126" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1f2933" text-anchor="end" font-weight="bold">t value</text>
  <line x1="68" y1="136" x2="478" y2="136" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="78" y="158" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2933" text-anchor="start">(Intercept)</text>
  <text x="250" y="158" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2933" text-anchor="end">2.0886</text>
  <text x="358" y="158" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2933" text-anchor="end">0.8015</text>
  <text x="458" y="158" font-family="Consolas, Menlo, monospace" font-size="13" fill="#5b6672" text-anchor="end">2.6</text>
  <text x="78" y="184" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2933" text-anchor="start">day</text>
  <text x="250" y="184" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2933" text-anchor="end">0.5883</text>
  <text x="358" y="184" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2933" text-anchor="end">0.0333</text>
  <text x="458" y="184" font-family="Consolas, Menlo, monospace" font-size="13" fill="#5b6672" text-anchor="end">17.7</text>
  <line x1="68" y1="200" x2="478" y2="200" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="78" y="226" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6672" text-anchor="start">Residual standard error</text>
  <text x="358" y="226" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1f2933" text-anchor="end">1.393</text>
  <text x="78" y="252" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6672" text-anchor="start">Multiple R-squared</text>
  <text x="358" y="252" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1f2933" text-anchor="end">0.9341</text>
  <text x="78" y="278" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6672" text-anchor="start">Degrees of freedom</text>
  <text x="358" y="278" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1f2933" text-anchor="end">22</text>
  <rect x="196" y="144" width="58" height="20" fill="none" rx="4" stroke="#a33a3a" stroke-width="1.8"/>
  <rect x="196" y="170" width="58" height="20" fill="none" rx="4" stroke="#2f6f9f" stroke-width="1.8"/>
  <rect x="304" y="170" width="58" height="20" fill="none" rx="4" stroke="#6b5b95" stroke-width="1.8"/>
  <rect x="304" y="238" width="58" height="20" fill="none" rx="4" stroke="#3f7a52" stroke-width="1.8"/>
  <rect x="60" y="312" width="12" height="12" fill="#a33a3a"/>
  <text x="84" y="322" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">Intercept 2.0886 centimetres is the height the line implies on day 0. Nothing was</text>
  <text x="84" y="338" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">measured before day 10, and a seed under the soil has no height, so this number is</text>
  <text x="84" y="354" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">arithmetic rather than biology.</text>
  <rect x="60" y="370" width="12" height="12" fill="#2f6f9f"/>
  <text x="84" y="380" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">Slope 0.5883 says that comparing seedlings one day apart in age, the older one is</text>
  <text x="84" y="396" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">about 0.59 centimetres taller on average in this greenhouse.</text>
  <rect x="60" y="412" width="12" height="12" fill="#6b5b95"/>
  <text x="84" y="422" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">Standard error 0.0333 says how far the slope estimate would move if the greenhouse</text>
  <text x="84" y="438" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">were restocked and measured again. Week 11 puts it to work.</text>
  <rect x="60" y="454" width="12" height="12" fill="#3f7a52"/>
  <text x="84" y="464" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">R-squared 0.9341 says the line accounts for about 93 percent of the up-and-down in</text>
  <text x="84" y="480" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">height. It does not say the straight shape is right.</text>
  <text x="60" y="512" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Read the two estimates in the units of the study first, then look at the residual plot before trusting the line.</text>
</svg>
