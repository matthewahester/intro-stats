  <line x1="629.429" y1="326" x2="629.429" y2="330" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="629.429" y="343" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">25</text>
  <line x1="672.286" y1="326" x2="672.286" y2="330" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="672.286" y="343" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">30</text>
  <line x1="715.143" y1="326" x2="715.143" y2="330" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="715.143" y="343" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">35</text>
  <line x1="454" y1="326" x2="458" y2="326" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="450" y="329.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">-4</text>
  <line x1="454" y1="268.5" x2="458" y2="268.5" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="450" y="272.3" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">-2</text>
  <line x1="454" y1="211" x2="458" y2="211" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="450" y="214.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0</text>
  <line x1="454" y1="153.5" x2="458" y2="153.5" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="450" y="157.3" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">2</text>
  <line x1="454" y1="96" x2="458" y2="96" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="450" y="99.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">4</text>
  <text x="608" y="364" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">Days since planting</text>
  <text x="608" y="82" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Seedling residuals (centimetres)</text>
  <line x1="458" y1="211" x2="758" y2="211" stroke="#1f2933" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="6 4"/>
  <circle cx="500.857" cy="273.429" r="3.8" fill="#c9d1d9"/>
  <circle cx="500.857" cy="233.179" r="3.8" fill="#c9d1d9"/>
