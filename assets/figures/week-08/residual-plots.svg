  <text x="458" y="396" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">An arch: low at both ends, high in the middle.</text>
  <text x="458" y="411" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">The large marks are group averages.</text>
  <text x="72" y="444" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">A pattern in the residuals is the line telling you it has the wrong shape, no matter how large R-squared is.</text>
</svg>
