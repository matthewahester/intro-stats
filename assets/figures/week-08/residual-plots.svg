  <text x="543.714" y="343" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">15</text>
  <line x1="586.571" y1="326" x2="586.571" y2="330" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
