<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 470" width="830" height="470" role="img">
  <title>Two residual plots: featureless and arched</title>
  <desc>Two panels of residuals plotted against the explanatory variable. The left panel scatters with no shape; the right panel bends into an arch.</desc>
  <rect x="0" y="0" width="830" height="470" fill="#ffffff"/>
  <text x="415" y="30" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">The residual plot is the diagnostic</text>
  <text x="415" y="50" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">A residual is the measured value minus the value the line predicts</text>
  <rect x="72" y="96" width="300" height="230" fill="none" stroke="#c9d1d9" stroke-width="1.2"/>
  <line x1="90.75" y1="326" x2="90.75" y2="330" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="90.75" y="343" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0</text>
  <line x1="165.75" y1="326" x2="165.75" y2="330" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="165.75" y="343" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">2</text>
  <line x1="240.75" y1="326" x2="240.75" y2="330" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="240.75" y="343" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">4</text>
  <line x1="315.75" y1="326" x2="315.75" y2="330" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="315.75" y="343" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">6</text>
  <line x1="68" y1="326" x2="72" y2="326" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="64" y="329.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">-6</text>
  <line x1="68" y1="268.5" x2="72" y2="268.5" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="64" y="272.3" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">-3</text>
  <line x1="68" y1="211" x2="72" y2="211" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="64" y="214.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0</text>
  <line x1="68" y1="153.5" x2="72" y2="153.5" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="64" y="157.3" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">3</text>
  <line x1="68" y1="96" x2="72" y2="96" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="64" y="99.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">6</text>
  <text x="222" y="364" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">Hours of exercise per week</text>
  <text x="222" y="82" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Clinic residuals (beats per minute)</text>
  <line x1="72" y1="211" x2="372" y2="211" stroke="#1f2933" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="6 4"/>
