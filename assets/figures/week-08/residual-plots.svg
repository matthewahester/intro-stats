  <text x="72" y="411" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">adequate summary here.</text>
  <rect x="458" y="96" width="300" height="230" fill="none" stroke="#c9d1d9" stroke-width="1.2"/>
  <line x1="500.857" y1="326" x2="500.857" y2="330" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
