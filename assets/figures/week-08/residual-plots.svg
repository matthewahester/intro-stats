  <circle cx="128.25" cy="249.333" r="4.4" fill="#2f6f9f"/>
  <circle cx="165.75" cy="287.667" r="4.4" fill="#2f6f9f"/>
  <circle cx="203.25" cy="172.667" r="4.4" fill="#2f6f9f"/>
  <circle cx="240.75" cy="230.167" r="4.4" fill="#2f6f9f"/>
