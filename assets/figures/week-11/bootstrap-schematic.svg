<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img">
  <title>From one sample to a distribution of resample statistics</title>
  <desc>A schematic running left to right: the single survey sample, an arrow for drawing with replacement, three resamples with their proportions, and the piled-up distribution of one thousand of them.</desc>
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <text x="30" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">One sample, one thousand resamples, one distribution</text>
  <text x="30" y="48" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Nothing new is collected. The sample stands in for the population it came from.</text>
  <rect x="30" y="80" width="190" height="108" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="125" y="104" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">The sample you have</text>
  <text x="125" y="126" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">200 students surveyed</text>
  <text x="125" y="146" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">62 said yes</text>
  <text x="125" y="168" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2f6f9f" text-anchor="middle" font-weight="bold">proportion 0.31</text>
  <line x1="226" y1="134" x2="315" y2="134" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="322,134 315,130.85 315,137.15" fill="#5b6672"/>
  <text x="274" y="106" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">draw 200 cards,</text>
  <text x="274" y="121" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">putting each one back</text>
  <rect x="330" y="80" width="210" height="32" fill="#dbe6ef" rx="4" stroke="#c9d1d9" stroke-width="1"/>
  <text x="344" y="101" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">Resample 1</text>
  <text x="444" y="101" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">58 yes</text>
  <text x="524" y="101" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end" font-weight="bold">0.290</text>
  <rect x="330" y="120" width="210" height="32" fill="#dbe6ef" rx="4" stroke="#c9d1d9" stroke-width="1"/>
  <text x="344" y="141" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">Resample 2</text>
  <text x="444" y="141" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">59 yes</text>
  <text x="524" y="141" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end" font-weight="bold">0.295</text>
  <rect x="330" y="160" width="210" height="32" fill="#dbe6ef" rx="4" stroke="#c9d1d9" stroke-width="1"/>
  <text x="344" y="181" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">Resample 3</text>
  <text x="444" y="181" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">65 yes</text>
  <text x="524" y="181" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end" font-weight="bold">0.325</text>
  <text x="435" y="216" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">and so on, up to Resample 1000</text>
  <line x1="548" y1="130" x2="613" y2="130" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="620,130 613,126.85 613,133.15" fill="#5b6672"/>
  <text x="584" y="112" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">pile them up</text>
  <line x1="630" y1="190" x2="840" y2="190" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="630" y1="82" x2="630" y2="190" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round"/>
  <rect x="630.382" y="189.504" width="8.782" height="0.496" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="639.927" y="188.683" width="8.782" height="1.317" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="649.473" y="186.828" width="8.782" height="3.172" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="659.018" y="183.072" width="8.782" height="6.928" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="668.564" y="176.276" width="8.782" height="13.724" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="678.109" y="165.343" width="8.782" height="24.657" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="687.655" y="149.82" width="8.782" height="40.18" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="697.2" y="130.618" width="8.782" height="59.382" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="706.745" y="110.405" width="8.782" height="79.595" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="716.291" y="93.237" width="8.782" height="96.763" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="725.836" y="83.31" width="8.782" height="106.69" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="735.382" y="83.31" width="8.782" height="106.69" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="744.927" y="93.237" width="8.782" height="96.763" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="754.473" y="110.405" width="8.782" height="79.595" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="764.018" y="130.618" width="8.782" height="59.382" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="773.564" y="149.82" width="8.782" height="40.18" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="783.109" y="165.343" width="8.782" height="24.657" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="792.655" y="176.276" width="8.782" height="13.724" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="802.2" y="183.072" width="8.782" height="6.928" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="811.745" y="186.828" width="8.782" height="3.172" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="821.291" y="188.683" width="8.782" height="1.317" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="830.836" y="189.504" width="8.782" height="0.496" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <text x="735" y="208" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">1,000 resample proportions</text>
  <line x1="30" y1="250" x2="850" y2="250" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="30" y="276" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="bold">What drawing with replacement looks like, shown with 8 cards instead of 200</text>
  <text x="30" y="322" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">The sample</text>
  <rect x="160" y="300" width="32" height="32" fill="#eef2f6" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="176" y="321" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">1</text>
  <rect x="200" y="300" width="32" height="32" fill="#eef2f6" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="216" y="321" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">2</text>
  <rect x="240" y="300" width="32" height="32" fill="#eef2f6" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="256" y="321" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">3</text>
  <rect x="280" y="300" width="32" height="32" fill="#eef2f6" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="296" y="321" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">4</text>
  <rect x="320" y="300" width="32" height="32" fill="#eef2f6" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="336" y="321" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">5</text>
  <rect x="360" y="300" width="32" height="32" fill="#eef2f6" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="376" y="321" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">6</text>
  <rect x="400" y="300" width="32" height="32" fill="#eef2f6" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="416" y="321" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">7</text>
  <rect x="440" y="300" width="32" height="32" fill="#eef2f6" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="456" y="321" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">8</text>
  <text x="30" y="376" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">One resample</text>
  <rect x="160" y="354" width="32" height="32" fill="#f3e3d6" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="176" y="375" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">3</text>
  <rect x="200" y="354" width="32" height="32" fill="#f3e3d6" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="216" y="375" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">3</text>
  <rect x="240" y="354" width="32" height="32" fill="#dbe6ef" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="256" y="375" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">7</text>
  <rect x="280" y="354" width="32" height="32" fill="#dbe6ef" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="296" y="375" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">1</text>
  <rect x="320" y="354" width="32" height="32" fill="#f3e3d6" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="336" y="375" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">5</text>
  <rect x="360" y="354" width="32" height="32" fill="#dbe6ef" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="376" y="375" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">8</text>
  <rect x="400" y="354" width="32" height="32" fill="#f3e3d6" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="416" y="375" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">5</text>
  <rect x="440" y="354" width="32" height="32" fill="#dbe6ef" rx="4" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="456" y="375" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">2</text>
  <text x="504" y="366" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="start">Cards 3 and 5 came out twice.</text>
  <text x="504" y="384" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="start">Cards 4 and 6 never came out.</text>
  <text x="30" y="420" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">That is where a resample gets to differ from the sample it came from.</text>
  <text x="30" y="440" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">The size of those differences is what the interval will be built from.</text>
</svg>
