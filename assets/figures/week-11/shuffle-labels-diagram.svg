<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" role="img" aria-labelledby="title desc">
  <title id="title">One shuffle: the same 20 times to fall asleep, with the group labels dealt out again at random</title>
