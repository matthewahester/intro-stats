<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 528" width="920" height="528" role="img">
  <title>Null distribution of the difference in proportions</title>
  <desc>A histogram of one thousand shuffled differences centred on zero, with the observed difference of 0.40 marked and the bars at least that far from zero shaded.</desc>
  <rect x="0" y="0" width="920" height="528" fill="#ffffff"/>
  <text x="30" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">What chance alone produced, one thousand times</text>
  <text x="30" y="48" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Each bar counts shuffles, not students. One shuffle is one imaginary version of the study in which the</text>
  <text x="30" y="63" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">coaching did nothing at all.</text>
  <line x1="78" y1="368" x2="778" y2="368" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="78" y1="118" x2="78" y2="368" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="78" y1="368" x2="778" y2="368" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="78" y1="326.333" x2="778" y2="326.333" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="78" y1="284.667" x2="778" y2="284.667" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="78" y1="243" x2="778" y2="243" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="78" y1="201.333" x2="778" y2="201.333" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="78" y1="159.667" x2="778" y2="159.667" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="153" y1="368" x2="153" y2="372" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="153" y="385" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">-0.6</text>
  <line x1="253" y1="368" x2="253" y2="372" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="253" y="385" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">-0.4</text>
  <line x1="353" y1="368" x2="353" y2="372" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="353" y="385" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">-0.2</text>
  <line x1="453" y1="368" x2="453" y2="372" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="453" y="385" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.0</text>
  <line x1="553" y1="368" x2="553" y2="372" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="553" y="385" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.2</text>
  <line x1="653" y1="368" x2="653" y2="372" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="653" y="385" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.4</text>
  <line x1="753" y1="368" x2="753" y2="372" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="753" y="385" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.6</text>
  <line x1="74" y1="368" x2="78" y2="368" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="70" y="371.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0</text>
  <line x1="74" y1="326.333" x2="78" y2="326.333" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="70" y="330.133" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">50</text>
  <line x1="74" y1="284.667" x2="78" y2="284.667" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="70" y="288.467" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">100</text>
  <line x1="74" y1="243" x2="78" y2="243" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="70" y="246.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">150</text>
  <line x1="74" y1="201.333" x2="78" y2="201.333" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="70" y="205.133" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">200</text>
  <line x1="74" y1="159.667" x2="78" y2="159.667" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="70" y="163.467" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">250</text>
  <text x="428" y="406" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">Difference in proportions produced by one shuffle</text>
  <rect x="131" y="366.333" width="44" height="1.667" fill="#f3e3d6" stroke="#a33a3a" stroke-width="1"/>
  <rect x="181" y="367.167" width="44" height="0.833" fill="#f3e3d6" stroke="#a33a3a" stroke-width="1"/>
  <rect x="231" y="359.667" width="44" height="8.333" fill="#f3e3d6" stroke="#a33a3a" stroke-width="1"/>
  <rect x="281" y="335.5" width="44" height="32.5" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="331" y="264.667" width="44" height="103.333" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="381" y="187.167" width="44" height="180.833" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="431" y="162.167" width="44" height="205.833" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="481" y="187.167" width="44" height="180.833" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="531" y="288" width="44" height="80" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="581" y="338.833" width="44" height="29.167" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="631" y="359.667" width="44" height="8.333" fill="#f3e3d6" stroke="#a33a3a" stroke-width="1"/>
  <rect x="681" y="366.333" width="44" height="1.667" fill="#f3e3d6" stroke="#a33a3a" stroke-width="1"/>
  <line x1="653" y1="118" x2="653" y2="368" stroke="#a33a3a" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 4"/>
  <line x1="253" y1="118" x2="253" y2="368" stroke="#a33a3a" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 5"/>
  <text x="663" y="146" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#a33a3a" text-anchor="start" font-weight="bold">The study found 0.40</text>
  <text x="663" y="164" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#a33a3a" text-anchor="start">12 shuffles reached</text>
  <text x="663" y="180" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#a33a3a" text-anchor="start">0.40 or more</text>
  <text x="243" y="146" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#a33a3a" text-anchor="end">Just as far the other way</text>
  <text x="243" y="164" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#a33a3a" text-anchor="end">13 shuffles reached</text>
  <text x="243" y="180" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#a33a3a" text-anchor="end">-0.40 or less</text>
  <line x1="30" y1="442" x2="890" y2="442" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="30" y="464" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">Most shuffles land near zero: 681 of the 1,000 fell between -0.10 and 0.10.</text>
  <text x="30" y="484" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">Shuffles at least as far from zero as the study: 12 plus 13, which is 25.</text>
  <text x="30" y="504" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">25 out of 1,000 is 0.025. That fraction is the p-value.</text>
</svg>
