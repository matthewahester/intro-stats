  <rect x="337.913" y="250.09" width="28" height="117.91" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="368.348" y="175.463" width="28" height="192.537" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="398.783" y="178.448" width="28" height="189.552" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="429.217" y="168" width="28" height="200" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="459.652" y="197.851" width="28" height="170.149" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="490.087" y="242.627" width="28" height="125.373" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="520.522" y="276.955" width="28" height="91.045" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="550.957" y="281.433" width="28" height="86.567" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="581.391" y="315.761" width="28" height="52.239" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="611.826" y="335.164" width="28" height="32.836" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1"/>
  <rect x="642.261" y="353.075" width="28" height="14.925" fill="#f3e3d6" stroke="#c2622d" stroke-width="1"/>
  <rect x="672.696" y="366.507" width="28" height="1.493" fill="#f3e3d6" stroke="#c2622d" stroke-width="1"/>
  <rect x="703.13" y="360.537" width="28" height="7.463" fill="#f3e3d6" stroke="#c2622d" stroke-width="1"/>
  <line x1="245.391" y1="124" x2="245.391" y2="368" stroke="#3f7a52" stroke-width="2" stroke-linecap="round"/>
  <text x="245.391" y="116" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f7a52" text-anchor="middle" font-weight="bold">0.250</text>
  <line x1="625.826" y1="124" x2="625.826" y2="368" stroke="#3f7a52" stroke-width="2" stroke-linecap="round"/>
  <text x="625.826" y="116" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f7a52" text-anchor="middle" font-weight="bold">0.375</text>
  <line x1="245.391" y1="94" x2="625.826" y2="94" stroke="#3f7a52" stroke-width="1.6" stroke-linecap="round"/>
  <text x="435.609" y="86" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3f7a52" text-anchor="middle" font-weight="bold">middle 950 of the 1,000 resamples</text>
  <line x1="428" y1="132" x2="428" y2="368" stroke="#6b5b95" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/>
  <text x="428" y="116" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b5b95" text-anchor="middle">the survey itself: 0.31</text>
  <text x="163.217" y="206" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="middle">lowest 25</text>
  <text x="163.217" y="222" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="middle">discarded</text>
  <text x="692.783" y="206" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="middle">highest 25</text>
  <text x="692.783" y="222" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="middle">discarded</text>
  <line x1="30" y1="432" x2="810" y2="432" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="30" y="454" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">Plausible values for the whole campus run from about 25 percent to about 37.5 percent.</text>
  <text x="30" y="474" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">The width of that range, not its middle, is what the survey size bought you.</text>
</svg>
