<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 490" width="840" height="490" role="img">
  <title>Bootstrap distribution with the middle 95 percent bracketed</title>
  <desc>A mound-shaped histogram of one thousand resample proportions centred near 0.31, with solid lines at 0.250 and 0.375 marking the middle 95 percent and the outer tails labelled as the 25 discarded on each side.</desc>
  <rect x="0" y="0" width="840" height="490" fill="#ffffff"/>
  <text x="30" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">Where the middle 95 percent of the resamples fell</text>
  <text x="30" y="48" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Sort the 1,000 resample proportions, throw away the lowest 25 and the highest 25, and report the</text>
  <text x="30" y="63" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">range of the 950 that are left.</text>
  <line x1="78" y1="368" x2="778" y2="368" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="78" y1="132" x2="78" y2="368" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="78" y1="368" x2="778" y2="368" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="78" y1="293.373" x2="778" y2="293.373" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="78" y1="218.746" x2="778" y2="218.746" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="93.217" y1="368" x2="93.217" y2="372" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="93.217" y="385" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.20</text>
  <line x1="245.391" y1="368" x2="245.391" y2="372" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="245.391" y="385" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.25</text>
  <line x1="397.565" y1="368" x2="397.565" y2="372" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="397.565" y="385" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.30</text>
  <line x1="549.739" y1="368" x2="549.739" y2="372" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="549.739" y="385" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.35</text>
  <line x1="701.913" y1="368" x2="701.913" y2="372" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="701.913" y="385" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.40</text>
  <line x1="74" y1="368" x2="78" y2="368" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="70" y="371.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0</text>
  <line x1="74" y1="293.373" x2="78" y2="293.373" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="70" y="297.173" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">50</text>
  <line x1="74" y1="218.746" x2="78" y2="218.746" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="70" y="222.546" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">100</text>
  <text x="428" y="406" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">Proportion who said yes in one resample of 200 students</text>
  <rect x="94.435" y="366.507" width="28" height="1.493" fill="#f3e3d6" stroke="#c2622d" stroke-width="1"/>
  <rect x="155.304" y="365.015" width="28" height="2.985" fill="#f3e3d6" stroke="#c2622d" stroke-width="1"/>
  <rect x="185.739" y="354.567" width="28" height="13.433" fill="#f3e3d6" stroke="#c2622d" stroke-width="1"/>
