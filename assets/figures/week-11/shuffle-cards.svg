<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img">
  <title>The observed split beside one shuffled relabelling</title>
  <desc>Forty outcome cards shown twice: once as the study ran, and once after the group labels were shuffled, with the difference in proportions computed for each.</desc>
  <rect x="0" y="0" width="900" height="430" fill="#ffffff"/>
  <text x="30" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">One deck, two ways of dealing it</text>
  <text x="30" y="48" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Each small square is one student. A filled square is a student whose sleep improved. There are 22 filled</text>
  <text x="30" y="63" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">squares and 18 empty ones in both panels.</text>
