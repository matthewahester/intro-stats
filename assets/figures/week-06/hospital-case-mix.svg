<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Case mix of two hypothetical hospitals by patient risk status</title>
  <desc id="desc">Stacked bars. Hospital A: 900 of 1,200 surgery patients are high-risk (75%) and 300 are low-risk (25%). Hospital B: 200 of 1,000 are high-risk (20%) and 800 are low-risk (80%).</desc>
  <rect x="0" y="0" width="640" height="300" fill="#ffffff" stroke="none" stroke-width="1.5"/>
  <text x="20" y="32" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="start" fill="#1c1b19" font-weight="600">Share of each hospital's surgery patients by risk status at admission</text>
  <text x="158" y="92" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="end" fill="#1c1b19" font-weight="600">Hospital A</text>
  <text x="158" y="109" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">1,200 patients</text>
  <rect x="170" y="70" width="330" height="52" fill="#3a3935" stroke="#1c1b19" stroke-width="1"/>
  <rect x="500" y="70" width="110" height="52" fill="#f1f0ec" stroke="#1c1b19" stroke-width="1"/>
  <text x="335" y="92" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="600">High-risk</text>
  <text x="335" y="109" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#ffffff">900 (75%)</text>
  <text x="555" y="92" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19" font-weight="600">Low-risk</text>
  <text x="555" y="109" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">300 (25%)</text>
  <text x="158" y="172" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="end" fill="#1c1b19" font-weight="600">Hospital B</text>
  <text x="158" y="189" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">1,000 patients</text>
  <rect x="170" y="150" width="88" height="52" fill="#3a3935" stroke="#1c1b19" stroke-width="1"/>
  <rect x="258" y="150" width="352" height="52" fill="#f1f0ec" stroke="#1c1b19" stroke-width="1"/>
  <text x="214" y="172" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="600">High-risk</text>
  <text x="214" y="189" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#ffffff">200 (20%)</text>
  <text x="434" y="172" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19" font-weight="600">Low-risk</text>
  <text x="434" y="189" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">800 (80%)</text>
  <line x1="170" y1="222" x2="610" y2="222" stroke="#1c1b19" stroke-width="1.5"/>
  <line x1="170" y1="222" x2="170" y2="227" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="170" y="241" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">0%</text>
  <line x1="280" y1="222" x2="280" y2="227" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="280" y="241" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">25%</text>
  <line x1="390" y1="222" x2="390" y2="227" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="390" y="241" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">50%</text>
  <line x1="500" y1="222" x2="500" y2="227" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="500" y="241" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">75%</text>
  <line x1="610" y1="222" x2="610" y2="227" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="610" y="241" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">100%</text>
  <text x="390" y="264" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19">Percent of the hospital's surgery patients</text>
  <text x="20" y="290" font-family="Inter, system-ui, sans-serif" font-size="11.5" text-anchor="start" fill="#3a3935" font-style="italic">Hypothetical values for illustration.</text>
</svg>
