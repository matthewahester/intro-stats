<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Death rates within 30 days by hospital and risk status, showing Simpson's paradox</title>
  <desc id="desc">Bar chart of 30-day death rates. High-risk: A 8.0%, B 10.0%. Low-risk: A 1.0%, B 2.0%. All patients combined: A 6.25%, B 3.6%. A is lower within each risk group but higher combined.</desc>
  <rect x="0" y="0" width="640" height="400" fill="#ffffff" stroke="none" stroke-width="1.5"/>
  <line x1="80" y1="320" x2="620" y2="320" stroke="#d8d6d0" stroke-width="1"/>
  <text x="72" y="324" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">0%</text>
  <line x1="80" y1="278.33" x2="620" y2="278.33" stroke="#d8d6d0" stroke-width="1"/>
  <text x="72" y="282.33" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">2%</text>
  <line x1="80" y1="236.67" x2="620" y2="236.67" stroke="#d8d6d0" stroke-width="1"/>
  <text x="72" y="240.67" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">4%</text>
  <line x1="80" y1="195" x2="620" y2="195" stroke="#d8d6d0" stroke-width="1"/>
  <text x="72" y="199" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">6%</text>
  <line x1="80" y1="153.33" x2="620" y2="153.33" stroke="#d8d6d0" stroke-width="1"/>
  <text x="72" y="157.33" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">8%</text>
  <line x1="80" y1="111.67" x2="620" y2="111.67" stroke="#d8d6d0" stroke-width="1"/>
  <text x="72" y="115.67" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">10%</text>
  <line x1="80" y1="70" x2="620" y2="70" stroke="#d8d6d0" stroke-width="1"/>
  <text x="72" y="74" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">12%</text>
  <line x1="80" y1="320" x2="620" y2="320" stroke="#1c1b19" stroke-width="1.5"/>
  <line x1="80" y1="320" x2="80" y2="70" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="26" y="195" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19" transform="rotate(-90 26 195)">Deaths within 30 days (% of patients)</text>
  <rect x="116" y="153.33" width="46" height="166.67" fill="#e9cdbd" stroke="#8a4a2b" stroke-width="1.8"/>
  <text x="139" y="146.33" font-family="Inter, system-ui, sans-serif" font-size="12.5" text-anchor="middle" fill="#8a4a2b" font-weight="600">8.0%</text>
  <text x="139" y="337" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#8a4a2b" font-weight="700">A</text>
  <rect x="168" y="111.67" width="46" height="208.33" fill="#c9d8e1" stroke="#35566b" stroke-width="1.8"/>
  <text x="191" y="104.67" font-family="Inter, system-ui, sans-serif" font-size="12.5" text-anchor="middle" fill="#35566b" font-weight="600">10.0%</text>
  <text x="191" y="337" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#35566b" font-weight="700">B</text>
  <text x="165" y="356" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19">High-risk patients</text>
  <rect x="281" y="299.17" width="46" height="20.83" fill="#e9cdbd" stroke="#8a4a2b" stroke-width="1.8"/>
  <text x="304" y="292.17" font-family="Inter, system-ui, sans-serif" font-size="12.5" text-anchor="middle" fill="#8a4a2b" font-weight="600">1.0%</text>
  <text x="304" y="337" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#8a4a2b" font-weight="700">A</text>
  <rect x="333" y="278.33" width="46" height="41.67" fill="#c9d8e1" stroke="#35566b" stroke-width="1.8"/>
  <text x="356" y="271.33" font-family="Inter, system-ui, sans-serif" font-size="12.5" text-anchor="middle" fill="#35566b" font-weight="600">2.0%</text>
  <text x="356" y="337" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#35566b" font-weight="700">B</text>
  <text x="330" y="356" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19">Low-risk patients</text>
  <rect x="476" y="189.79" width="46" height="130.21" fill="#e9cdbd" stroke="#8a4a2b" stroke-width="1.8"/>
  <text x="499" y="182.79" font-family="Inter, system-ui, sans-serif" font-size="12.5" text-anchor="middle" fill="#8a4a2b" font-weight="600">6.25%</text>
  <text x="499" y="337" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#8a4a2b" font-weight="700">A</text>
  <rect x="528" y="245" width="46" height="75" fill="#c9d8e1" stroke="#35566b" stroke-width="1.8"/>
  <text x="551" y="238" font-family="Inter, system-ui, sans-serif" font-size="12.5" text-anchor="middle" fill="#35566b" font-weight="600">3.6%</text>
  <text x="551" y="337" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#35566b" font-weight="700">B</text>
  <text x="525" y="356" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19">All patients combined</text>
  <line x1="428" y1="62" x2="428" y2="364" stroke="#8a8780" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="250" y="44" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19" font-weight="600">Within each risk group: A is lower</text>
  <text x="525" y="44" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19" font-weight="600">Combined: A is higher</text>
  <rect x="470" y="78" width="12" height="12" fill="#e9cdbd" stroke="#8a4a2b" stroke-width="1.8"/>
  <text x="488" y="88" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19">Hospital A</text>
  <rect x="470" y="98" width="12" height="12" fill="#c9d8e1" stroke="#35566b" stroke-width="1.8"/>
  <text x="488" y="108" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19">Hospital B</text>
  <text x="20" y="392" font-family="Inter, system-ui, sans-serif" font-size="11.5" text-anchor="start" fill="#3a3935" font-style="italic">Hypothetical values for illustration. A = Hospital A, B = Hospital B.</text>
</svg>
