<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" role="img">
  <title>Why the pooled healing rates reverse</title>
  <desc>A percentage axis with one lane per clinic. Clinic A sees 70 percent serious wounds and heals 60 and 90 percent, pooling to 69 near the lower rate. Clinic B sees 80 percent minor wounds and heals 55 and 85 percent, pooling to 79 near the higher one.</desc>
  <rect x="0" y="0" width="900" height="410" fill="#ffffff"/>
  <text x="450" y="30" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Why the pooled rates reverse</text>
  <circle cx="556" cy="58" r="5.5" fill="none" stroke="#1f2933" stroke-width="1.6"/>
  <text x="570" y="62" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">rate within one severity group</text>
  <circle cx="756" cy="58" r="6.5" fill="#1f2933"/>
  <text x="770" y="62" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">pooled rate</text>
  <text x="40" y="94" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="start">wound mix</text>
  <rect x="120" y="84" width="12" height="12" fill="#dbe6ef" stroke="#c9d1d9" stroke-width="1"/>
  <text x="137" y="94" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="start">minor</text>
  <rect x="190" y="84" width="12" height="12" fill="#f3e3d6" stroke="#c9d1d9" stroke-width="1"/>
  <text x="207" y="94" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="start">serious</text>
  <line x1="330" y1="280" x2="330" y2="284" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="330" y="297" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">50</text>
  <line x1="385.556" y1="280" x2="385.556" y2="284" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="385.556" y="297" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">55</text>
  <line x1="441.111" y1="280" x2="441.111" y2="284" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="441.111" y="297" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">60</text>
  <line x1="496.667" y1="280" x2="496.667" y2="284" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="496.667" y="297" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">65</text>
  <line x1="552.222" y1="280" x2="552.222" y2="284" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="552.222" y="297" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">70</text>
  <line x1="607.778" y1="280" x2="607.778" y2="284" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="607.778" y="297" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">75</text>
  <line x1="663.333" y1="280" x2="663.333" y2="284" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="663.333" y="297" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">80</text>
  <line x1="718.889" y1="280" x2="718.889" y2="284" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="718.889" y="297" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">85</text>
  <line x1="774.444" y1="280" x2="774.444" y2="284" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="774.444" y="297" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">90</text>
  <line x1="830" y1="280" x2="830" y2="284" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="830" y="297" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">95</text>
  <text x="580" y="318" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">Percent of wounds that healed</text>
  <text x="40" y="155" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2f6f9f" text-anchor="start" font-weight="bold">Clinic A</text>
  <rect x="120" y="137" width="54" height="26" fill="#dbe6ef" stroke="#c9d1d9" stroke-width="1"/>
  <rect x="174" y="137" width="126" height="26" fill="#f3e3d6" stroke="#c9d1d9" stroke-width="1"/>
  <text x="147" y="154" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle">30</text>
  <text x="237" y="154" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle">70</text>
  <line x1="330" y1="150" x2="830" y2="150" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <circle cx="441.111" cy="150" r="6" fill="#ffffff" stroke="#2f6f9f" stroke-width="1.8"/>
  <circle cx="774.444" cy="150" r="6" fill="#ffffff" stroke="#2f6f9f" stroke-width="1.8"/>
  <circle cx="541.111" cy="150" r="7" fill="#2f6f9f"/>
  <text x="441.111" y="174" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">serious 60</text>
  <text x="774.444" y="174" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">minor 90</text>
  <text x="541.111" y="132" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f6f9f" text-anchor="middle" font-weight="bold">pooled 69</text>
  <text x="40" y="230" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c2622d" text-anchor="start" font-weight="bold">Clinic B</text>
  <rect x="120" y="212" width="144" height="26" fill="#dbe6ef" stroke="#c9d1d9" stroke-width="1"/>
  <rect x="264" y="212" width="36" height="26" fill="#f3e3d6" stroke="#c9d1d9" stroke-width="1"/>
  <text x="192" y="229" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle">80</text>
  <text x="282" y="229" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle">20</text>
  <line x1="330" y1="225" x2="830" y2="225" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <circle cx="385.556" cy="225" r="6" fill="#ffffff" stroke="#c2622d" stroke-width="1.8"/>
  <circle cx="718.889" cy="225" r="6" fill="#ffffff" stroke="#c2622d" stroke-width="1.8"/>
  <circle cx="652.222" cy="225" r="7" fill="#c2622d"/>
  <text x="385.556" y="249" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">serious 55</text>
  <text x="718.889" y="249" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">minor 85</text>
  <text x="652.222" y="207" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="middle" font-weight="bold">pooled 79</text>
  <text x="40" y="345" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">The pooled rate is an average of the two rates in its own lane, weighted by the mix on</text>
  <text x="40" y="362" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">the left. Clinic A sees mostly serious wounds, so its pooled rate is dragged down near</text>
  <text x="40" y="379" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">the serious-wound rate. Clinic B sees mostly minor wounds, so its pooled rate sits high.</text>
</svg>
