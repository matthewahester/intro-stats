<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" role="img">
  <title>The walking-group difference before and after adjusting for age</title>
  <desc>A difference axis in mmHg with a dashed line at no difference. Unadjusted, the walking group sits 10 lower, with a bar running from about 13 to about 7 below zero. Adjusted for age band it sits 4 lower, from about 7 to about 1 below zero.</desc>
  <rect x="0" y="0" width="880" height="390" fill="#ffffff"/>
  <text x="440" y="30" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Before and after adjusting for age</text>
  <line x1="170" y1="220" x2="170" y2="224" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="170" y="237" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">-15</text>
  <line x1="278.333" y1="220" x2="278.333" y2="224" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="278.333" y="237" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">-12</text>
  <line x1="386.667" y1="220" x2="386.667" y2="224" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="386.667" y="237" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">-9</text>
  <line x1="495" y1="220" x2="495" y2="224" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="495" y="237" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">-6</text>
  <line x1="603.333" y1="220" x2="603.333" y2="224" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="603.333" y="237" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">-3</text>
  <line x1="711.667" y1="220" x2="711.667" y2="224" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="711.667" y="237" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0</text>
  <line x1="820" y1="220" x2="820" y2="224" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="820" y="237" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">3</text>
  <text x="495" y="258" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">Difference in average blood pressure, mmHg, walking group minus others</text>
  <line x1="711.667" y1="80" x2="711.667" y2="220" stroke="#5b6672" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5 4"/>
  <text x="711.667" y="70" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">no difference</text>
  <text x="160" y="126" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="end" font-weight="bold">Unadjusted</text>
  <line x1="249.444" y1="122" x2="451.667" y2="122" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="249.444" y1="116" x2="249.444" y2="128" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="451.667" y1="116" x2="451.667" y2="128" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="350.556,116.5 356.056,122 350.556,127.5 345.056,122" fill="#2f6f9f"/>
  <text x="350.556" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2f6f9f" text-anchor="middle" font-weight="bold">-10.0</text>
  <text x="249.444" y="142" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="middle">-12.8</text>
  <text x="451.667" y="142" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="middle">-7.2</text>
  <text x="160" y="182" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="end" font-weight="bold">Adjusted for age band</text>
  <line x1="451.667" y1="178" x2="682.778" y2="178" stroke="#3f7a52" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="451.667" y1="172" x2="451.667" y2="184" stroke="#3f7a52" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="682.778" y1="172" x2="682.778" y2="184" stroke="#3f7a52" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="567.222,172.5 572.722,178 567.222,183.5 561.722,178" fill="#3f7a52"/>
  <text x="567.222" y="164" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f7a52" text-anchor="middle" font-weight="bold">-4.0</text>
  <text x="451.667" y="198" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="middle">-7.2</text>
  <text x="682.778" y="198" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="middle">-0.8</text>
  <text x="60" y="288" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">Both estimates point the same way, so age does not reverse this comparison. Age does</text>
  <text x="60" y="305" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">account for most of the gap: adjusting moves the estimate from about ten mmHg lower to</text>
  <text x="60" y="322" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">about four mmHg lower. The bars show the range of values the data leave plausible,</text>
  <text x="60" y="339" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">which Week 11 builds.</text>
</svg>
