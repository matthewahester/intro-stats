<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img">
  <title>A clean two-variable comparison beside a confounded one</title>
  <desc>Left panel: one arrow from which clinic to whether the wound healed. Right panel: wound severity points at both, so part of the clinic gap is a severity gap. Below, the three conditions a third variable must meet to confound the comparison.</desc>
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>
  <text x="450" y="32" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Two pictures of the same comparison</text>
  <rect x="30" y="60" width="400" height="300" fill="#ffffff" rx="8" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="230" y="90" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">A clean comparison</text>
  <text x="50" y="118" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Only one thing separates the two groups of</text>
  <text x="50" y="133" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">patients: which clinic treated them.</text>
  <rect x="60" y="200" width="130" height="52" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="125" y="230.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">Which clinic</text>
  <rect x="270" y="200" width="145" height="52" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="342.5" y="222" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Healed</text>
  <text x="342.5" y="239" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">without a return visit</text>
  <line x1="193" y1="226" x2="259" y2="226" stroke="#1f2933" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="266,226 259,222.85 259,229.15" fill="#1f2933"/>
  <text x="229" y="214" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">compare</text>
  <text x="50" y="292" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">The gap between the two clinics is a gap</text>
  <text x="50" y="307" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">between the clinics.</text>
  <rect x="470" y="60" width="400" height="300" fill="#ffffff" rx="8" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="670" y="90" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">A confounded comparison</text>
  <rect x="595" y="112" width="150" height="44" fill="#f3e3d6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="670" y="138.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">Wound severity</text>
  <rect x="490" y="210" width="130" height="52" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="555" y="240.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">Which clinic</text>
  <rect x="700" y="210" width="155" height="52" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="777.5" y="232" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Healed</text>
  <text x="777.5" y="249" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">without a return visit</text>
  <line x1="625" y1="158" x2="570.511" y2="200.683" stroke="#c2622d" stroke-width="1.7" stroke-linecap="round"/>
  <polygon points="565,205 572.453,203.163 568.568,198.204" fill="#c2622d"/>
  <line x1="715" y1="158" x2="762.763" y2="200.356" stroke="#c2622d" stroke-width="1.7" stroke-linecap="round"/>
  <polygon points="768,205 764.853,197.999 760.673,202.712" fill="#c2622d"/>
  <text x="600" y="186" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#c2622d" text-anchor="end">linked to</text>
  <text x="740" y="186" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#c2622d" text-anchor="start">linked to</text>
  <line x1="623" y1="236" x2="689" y2="236" stroke="#1f2933" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="696,236 689,232.85 689,239.15" fill="#1f2933"/>
  <text x="659" y="224" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">compare</text>
  <text x="490" y="292" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">Part of the clinic gap is really a severity</text>
  <text x="490" y="307" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">gap, because severity differs between the</text>
  <text x="490" y="322" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">clinics and also drives healing.</text>
  <rect x="30" y="385" width="840" height="105" fill="#eef2f6" rx="8" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="50" y="410" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="bold">A third variable confounds a comparison when all three hold:</text>
  <circle cx="58" cy="431" r="3.2" fill="#5b6672"/>
  <text x="72" y="435" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">It differs between the groups being compared.</text>
  <circle cx="58" cy="452" r="3.2" fill="#5b6672"/>
  <text x="72" y="456" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">It is related to the response on its own, not only through the comparison.</text>
  <circle cx="58" cy="473" r="3.2" fill="#5b6672"/>
  <text x="72" y="477" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">It is not a step on the path from the explanatory variable to the response.</text>
</svg>
