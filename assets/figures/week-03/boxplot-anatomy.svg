<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img">
  <title>Every part of a boxplot, labelled</title>
  <desc>A labelled boxplot of fifteen clinic wait times drawn under a strip of the raw dots: smallest value 4, Q1 7, median 11, Q3 19, whisker stopping at 31, upper fence 37, and one flagged point at 65 minutes.</desc>
  <rect x="0" y="0" width="900" height="430" fill="#ffffff"/>
  <text x="450" y="32" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">Every part of a boxplot, labelled</text>
  <text x="450" y="55" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">The same fifteen clinic wait times, in minutes</text>
  <line x1="90" y1="330" x2="90" y2="334" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="90" y="347" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0</text>
  <line x1="195.714" y1="330" x2="195.714" y2="334" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="195.714" y="347" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">10</text>
  <line x1="301.429" y1="330" x2="301.429" y2="334" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="301.429" y="347" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">20</text>
  <line x1="407.143" y1="330" x2="407.143" y2="334" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="407.143" y="347" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">30</text>
  <line x1="512.857" y1="330" x2="512.857" y2="334" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="512.857" y="347" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">40</text>
  <line x1="618.571" y1="330" x2="618.571" y2="334" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="618.571" y="347" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">50</text>
  <line x1="724.286" y1="330" x2="724.286" y2="334" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="724.286" y="347" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">60</text>
  <line x1="830" y1="330" x2="830" y2="334" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="830" y="347" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">70</text>
  <text x="460" y="368" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">wait time (minutes)</text>
  <line x1="90" y1="330" x2="830" y2="330" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round"/>
  <text x="90" y="92" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">each dot is one visit</text>
  <circle cx="132.286" cy="112" r="3.6" fill="#2f6f9f"/>
  <circle cx="142.857" cy="112" r="3.6" fill="#2f6f9f"/>
  <circle cx="153.429" cy="112" r="3.6" fill="#2f6f9f"/>
  <circle cx="164" cy="112" r="3.6" fill="#2f6f9f"/>
  <circle cx="174.571" cy="112" r="3.6" fill="#2f6f9f"/>
  <circle cx="185.143" cy="112" r="3.6" fill="#2f6f9f"/>
  <circle cx="195.714" cy="112" r="3.6" fill="#2f6f9f"/>
  <circle cx="206.286" cy="112" r="3.6" fill="#2f6f9f"/>
  <circle cx="216.857" cy="112" r="3.6" fill="#2f6f9f"/>
  <circle cx="238" cy="112" r="3.6" fill="#2f6f9f"/>
  <circle cx="259.143" cy="112" r="3.6" fill="#2f6f9f"/>
  <circle cx="290.857" cy="112" r="3.6" fill="#2f6f9f"/>
  <circle cx="333.143" cy="112" r="3.6" fill="#2f6f9f"/>
  <circle cx="417.714" cy="112" r="3.6" fill="#2f6f9f"/>
  <circle cx="777.143" cy="112" r="3.6" fill="#2f6f9f"/>
  <line x1="132.286" y1="200" x2="132.286" y2="280" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="164" y1="200" x2="164" y2="252" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="290.857" y1="200" x2="290.857" y2="252" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="417.714" y1="200" x2="417.714" y2="252" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <rect x="164" y="157" width="126.857" height="46" fill="#dbe6ef" stroke="#1f2933" stroke-width="1.4"/>
  <line x1="206.286" y1="157" x2="206.286" y2="203" stroke="#1f2933" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="132.286" y1="180" x2="164" y2="180" stroke="#1f2933" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="290.857" y1="180" x2="417.714" y2="180" stroke="#1f2933" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="132.286" y1="163" x2="132.286" y2="197" stroke="#1f2933" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="417.714" y1="163" x2="417.714" y2="197" stroke="#1f2933" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="777.143" cy="180" r="3.6" fill="none" stroke="#1f2933" stroke-width="1.4"/>
  <line x1="481.143" y1="140" x2="481.143" y2="228" stroke="#a33a3a" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
  <text x="481.143" y="132" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#a33a3a" text-anchor="middle">upper fence 37 min</text>
  <text x="206.286" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">median 11 min</text>
  <text x="777.143" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#a33a3a" text-anchor="middle">flagged point 65 min</text>
  <line x1="777.143" y1="154" x2="777.143" y2="166" stroke="#a33a3a" stroke-width="1.2" stroke-linecap="round"/>
  <polygon points="777.143,172 779.843,166 774.443,166" fill="#a33a3a"/>
  <line x1="164" y1="222" x2="290.857" y2="222" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="164" y1="216" x2="164" y2="228" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="290.857" y1="216" x2="290.857" y2="228" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
  <text x="227.429" y="242" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">IQR 12 min</text>
  <text x="164" y="272" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">Q1 is 7 min</text>
  <text x="290.857" y="272" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">Q3 is 19 min</text>
  <text x="417.714" y="272" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">whisker stops at 31 min</text>
  <text x="132.286" y="300" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">smallest value 4 min</text>
  <text x="90" y="404" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">The box holds the middle half of the visits. A whisker reaches the most extreme value still inside the</text>
  <text x="90" y="420" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">fence; anything past the fence is drawn as its own point.</text>
</svg>
