<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Deviations of eight blood pressure readings from their mean of 120 mm Hg</title>
  <desc id="desc">Eight systolic readings from 110 to 134 mm Hg, each on its own row with a line to the mean of 120. Deviations are −10, −6, −4, −2, 0, +2, +6 and +14; they add to zero, and 134 lies farthest from the mean.</desc>
  <rect x="0" y="0" width="640" height="420" fill="#ffffff" stroke="none" stroke-width="1.5"/>
  <line x1="320" y1="42" x2="320" y2="330" stroke="#8a4a2b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="320" y="34" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#8a4a2b" font-weight="600">Mean = 120 mm Hg</text>
  <text x="20" y="34" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#3a3935">Reading</text>
  <text x="95" y="66" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#1c1b19">110</text>
  <line x1="110" y1="62" x2="600" y2="62" stroke="#d8d6d0" stroke-width="1"/>
  <line x1="180" y1="62" x2="320" y2="62" stroke="#1c1b19" stroke-width="2.5"/>
  <circle cx="180" cy="62" r="6" fill="#35566b" stroke="none" stroke-width="1"/>
  <text x="170" y="66" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#1c1b19" font-weight="600">−10</text>
  <text x="95" y="100" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#1c1b19">114</text>
  <line x1="110" y1="96" x2="600" y2="96" stroke="#d8d6d0" stroke-width="1"/>
  <line x1="236" y1="96" x2="320" y2="96" stroke="#1c1b19" stroke-width="2.5"/>
  <circle cx="236" cy="96" r="6" fill="#35566b" stroke="none" stroke-width="1"/>
  <text x="226" y="100" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#1c1b19" font-weight="600">−6</text>
  <text x="95" y="134" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#1c1b19">116</text>
  <line x1="110" y1="130" x2="600" y2="130" stroke="#d8d6d0" stroke-width="1"/>
  <line x1="264" y1="130" x2="320" y2="130" stroke="#1c1b19" stroke-width="2.5"/>
  <circle cx="264" cy="130" r="6" fill="#35566b" stroke="none" stroke-width="1"/>
  <text x="254" y="134" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#1c1b19" font-weight="600">−4</text>
  <text x="95" y="168" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#1c1b19">118</text>
  <line x1="110" y1="164" x2="600" y2="164" stroke="#d8d6d0" stroke-width="1"/>
  <line x1="292" y1="164" x2="320" y2="164" stroke="#1c1b19" stroke-width="2.5"/>
  <circle cx="292" cy="164" r="6" fill="#35566b" stroke="none" stroke-width="1"/>
  <text x="282" y="168" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#1c1b19" font-weight="600">−2</text>
  <text x="95" y="202" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#1c1b19">120</text>
  <line x1="110" y1="198" x2="600" y2="198" stroke="#d8d6d0" stroke-width="1"/>
  <circle cx="320" cy="198" r="6" fill="#35566b" stroke="none" stroke-width="1"/>
  <text x="330" y="202" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19" font-weight="600">0</text>
  <text x="95" y="236" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#1c1b19">122</text>
  <line x1="110" y1="232" x2="600" y2="232" stroke="#d8d6d0" stroke-width="1"/>
  <line x1="348" y1="232" x2="320" y2="232" stroke="#1c1b19" stroke-width="2.5"/>
  <circle cx="348" cy="232" r="6" fill="#35566b" stroke="none" stroke-width="1"/>
  <text x="358" y="236" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19" font-weight="600">+2</text>
  <text x="95" y="270" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#1c1b19">126</text>
  <line x1="110" y1="266" x2="600" y2="266" stroke="#d8d6d0" stroke-width="1"/>
  <line x1="404" y1="266" x2="320" y2="266" stroke="#1c1b19" stroke-width="2.5"/>
  <circle cx="404" cy="266" r="6" fill="#35566b" stroke="none" stroke-width="1"/>
  <text x="414" y="270" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19" font-weight="600">+6</text>
  <text x="95" y="304" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#1c1b19">134</text>
  <line x1="110" y1="300" x2="600" y2="300" stroke="#d8d6d0" stroke-width="1"/>
  <line x1="516" y1="300" x2="320" y2="300" stroke="#1c1b19" stroke-width="2.5"/>
  <circle cx="516" cy="300" r="6" fill="#35566b" stroke="none" stroke-width="1"/>
  <text x="526" y="304" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19" font-weight="600">+14</text>
  <line x1="110" y1="330" x2="600" y2="330" stroke="#1c1b19" stroke-width="1.5"/>
  <line x1="110" y1="330" x2="110" y2="335" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="110" y="349" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">105</text>
  <line x1="180" y1="330" x2="180" y2="335" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="180" y="349" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">110</text>
  <line x1="250" y1="330" x2="250" y2="335" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="250" y="349" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">115</text>
  <line x1="320" y1="330" x2="320" y2="335" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="320" y="349" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">120</text>
  <line x1="390" y1="330" x2="390" y2="335" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="390" y="349" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">125</text>
  <line x1="460" y1="330" x2="460" y2="335" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="460" y="349" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">130</text>
  <line x1="530" y1="330" x2="530" y2="335" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="530" y="349" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">135</text>
  <line x1="600" y1="330" x2="600" y2="335" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="600" y="349" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">140</text>
  <text x="355" y="370" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19">Systolic blood pressure (mm Hg)</text>
  <text x="320" y="405" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">Deviations add to 0. Squared deviations add to 392, so s² = 392 ÷ 7 = 56 and s ≈ 7.5 mm Hg.</text>
</svg>
