<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="title desc">
  <title id="title">Histogram of the same 40 resting heart rates, in bins five beats wide</title>
  <desc id="desc">Histogram of 40 resting heart rates in bins from 50 to 54 up to 90 to 94 beats per minute, with counts 1, 2, 5, 9, 10, 7, 4, 1 and 1. One peak at 70 to 74; the two sides are roughly mirror images.</desc>
