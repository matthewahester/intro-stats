  <text x="250" y="339" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">65</text>
  <line x1="310" y1="320" x2="310" y2="325" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="310" y="339" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">70</text>
  <line x1="370" y1="320" x2="370" y2="325" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="370" y="339" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">75</text>
  <line x1="430" y1="320" x2="430" y2="325" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="430" y="339" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">80</text>
