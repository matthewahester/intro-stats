  <line x1="70" y1="320" x2="70" y2="325" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="70" y="339" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">50</text>
