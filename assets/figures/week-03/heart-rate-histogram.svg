  <text x="340" y="360" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19">Resting heart rate (beats per minute)</text>
  <text x="24" y="180" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19" transform="rotate(-90 24 180)">Number of adults</text>
