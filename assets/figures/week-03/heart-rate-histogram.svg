  <text x="62" y="184" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">6</text>
  <line x1="65" y1="133.33" x2="70" y2="133.33" stroke="#1c1b19" stroke-width="1.5"/>
