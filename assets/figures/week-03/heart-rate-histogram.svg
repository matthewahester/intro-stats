  <line x1="70" y1="133.33" x2="610" y2="133.33" stroke="#d8d6d0" stroke-width="1"/>
  <line x1="70" y1="86.67" x2="610" y2="86.67" stroke="#d8d6d0" stroke-width="1"/>
  <line x1="70" y1="40" x2="610" y2="40" stroke="#d8d6d0" stroke-width="1"/>
  <rect x="70" y="296.67" width="60" height="23.33" fill="#c9d8e1" stroke="#35566b" stroke-width="1.5"/>
