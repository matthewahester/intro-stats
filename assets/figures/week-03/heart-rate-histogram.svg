  <text x="550" y="339" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">90</text>
  <line x1="610" y1="320" x2="610" y2="325" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="610" y="339" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">95</text>
  <line x1="65" y1="320" x2="70" y2="320" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="62" y="324" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">0</text>
