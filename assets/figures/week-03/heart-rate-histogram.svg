  <rect x="250" y="110" width="60" height="210" fill="#c9d8e1" stroke="#35566b" stroke-width="1.5"/>
  <text x="280" y="104" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">9</text>
  <rect x="310" y="86.67" width="60" height="233.33" fill="#c9d8e1" stroke="#35566b" stroke-width="1.5"/>
  <text x="340" y="80.67" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">10</text>
  <rect x="370" y="156.67" width="60" height="163.33" fill="#c9d8e1" stroke="#35566b" stroke-width="1.5"/>
  <text x="400" y="150.67" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">7</text>
  <rect x="430" y="226.67" width="60" height="93.33" fill="#c9d8e1" stroke="#35566b" stroke-width="1.5"/>
  <text x="460" y="220.67" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">4</text>
  <rect x="490" y="296.67" width="60" height="23.33" fill="#c9d8e1" stroke="#35566b" stroke-width="1.5"/>
  <text x="520" y="290.67" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">1</text>
  <rect x="550" y="296.67" width="60" height="23.33" fill="#c9d8e1" stroke="#35566b" stroke-width="1.5"/>
  <text x="580" y="290.67" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">1</text>
  <text x="610" y="30" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">Each bar covers five whole-number heart rates, such as 70 to 74.</text>
</svg>
