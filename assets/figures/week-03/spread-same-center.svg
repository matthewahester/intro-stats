<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img">
  <title>Same center, very different spread</title>
  <desc>Two dot plots on a shared time axis. Both shuttle routes have a mean and median of 20 minutes, but Route A's dots cluster between 18 and 22 while Route B's spread from 12 to 28 minutes.</desc>
  <rect x="0" y="0" width="880" height="400" fill="#ffffff"/>
  <text x="440" y="32" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">Same center, very different spread</text>
  <text x="440" y="55" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">Seven mornings on each campus shuttle route</text>
  <text x="110" y="84" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2f6f9f" text-anchor="start" font-weight="bold">Route A: mean 20 min, median 20 min, s is 1.3 min, IQR 2 min</text>
  <line x1="110" y1="172" x2="790" y2="172" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="393.333" cy="166.3" r="5" fill="#2f6f9f"/>
  <circle cx="421.667" cy="166.3" r="5" fill="#2f6f9f"/>
  <circle cx="450" cy="166.3" r="5" fill="#2f6f9f"/>
  <circle cx="450" cy="154.9" r="5" fill="#2f6f9f"/>
  <circle cx="450" cy="143.5" r="5" fill="#2f6f9f"/>
  <circle cx="478.333" cy="166.3" r="5" fill="#2f6f9f"/>
  <circle cx="506.667" cy="166.3" r="5" fill="#2f6f9f"/>
  <line x1="450" y1="92" x2="450" y2="172" stroke="#a33a3a" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
  <text x="457" y="104" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#a33a3a" text-anchor="start">mean 20 min</text>
  <text x="110" y="214" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#c2622d" text-anchor="start" font-weight="bold">Route B: mean 20 min, median 20 min, s is 5.6 min, IQR 10 min</text>
  <line x1="166.667" y1="302" x2="166.667" y2="306" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="166.667" y="319" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">10</text>
  <line x1="308.333" y1="302" x2="308.333" y2="306" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="308.333" y="319" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">15</text>
  <line x1="450" y1="302" x2="450" y2="306" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="450" y="319" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">20</text>
  <line x1="591.667" y1="302" x2="591.667" y2="306" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="591.667" y="319" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">25</text>
  <line x1="733.333" y1="302" x2="733.333" y2="306" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="733.333" y="319" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">30</text>
  <text x="450" y="340" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">one-way trip time (minutes)</text>
  <line x1="110" y1="302" x2="790" y2="302" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="223.333" cy="296.3" r="5" fill="#c2622d"/>
  <circle cx="308.333" cy="296.3" r="5" fill="#c2622d"/>
  <circle cx="393.333" cy="296.3" r="5" fill="#c2622d"/>
  <circle cx="450" cy="296.3" r="5" fill="#c2622d"/>
  <circle cx="506.667" cy="296.3" r="5" fill="#c2622d"/>
  <circle cx="591.667" cy="296.3" r="5" fill="#c2622d"/>
  <circle cx="676.667" cy="296.3" r="5" fill="#c2622d"/>
  <line x1="450" y1="222" x2="450" y2="302" stroke="#a33a3a" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
  <text x="110" y="372" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">Both routes average 20 minutes. Only one of them is steady enough to plan a 9 o'clock class around.</text>
</svg>
