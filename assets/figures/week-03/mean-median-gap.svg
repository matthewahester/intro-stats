<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img">
  <title>Where the mean and the median land in a right-skewed sample</title>
  <desc>A right-skewed histogram of fifteen clinic wait times. The median is marked at 11 minutes and the mean at 16 minutes, with the 5 minute gap between them labelled, and one lone bar out at 65 minutes.</desc>
  <rect x="0" y="0" width="880" height="440" fill="#ffffff"/>
  <text x="440" y="32" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Fifteen clinic wait times: where the mean and the median land</text>
  <line x1="120" y1="330" x2="780" y2="330" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="120" y1="80" x2="120" y2="330" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="120" y1="330" x2="120" y2="334" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="120" y="347" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0</text>
  <line x1="214.286" y1="330" x2="214.286" y2="334" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="214.286" y="347" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">10</text>
  <line x1="308.571" y1="330" x2="308.571" y2="334" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="308.571" y="347" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">20</text>
  <line x1="402.857" y1="330" x2="402.857" y2="334" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="402.857" y="347" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">30</text>
  <line x1="497.143" y1="330" x2="497.143" y2="334" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="497.143" y="347" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">40</text>
  <line x1="591.429" y1="330" x2="591.429" y2="334" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="591.429" y="347" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">50</text>
  <line x1="685.714" y1="330" x2="685.714" y2="334" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="685.714" y="347" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">60</text>
  <line x1="780" y1="330" x2="780" y2="334" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="780" y="347" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">70</text>
  <line x1="116" y1="330" x2="120" y2="330" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="112" y="333.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0</text>
  <line x1="116" y1="246.667" x2="120" y2="246.667" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="112" y="250.467" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">2</text>
  <line x1="116" y1="163.333" x2="120" y2="163.333" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="112" y="167.133" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">4</text>
  <line x1="116" y1="80" x2="120" y2="80" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="112" y="83.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">6</text>
  <text x="450" y="368" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">wait time (minutes)</text>
  <text x="112" y="68" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end">number of visits</text>
  <rect x="120" y="288.333" width="47.143" height="41.667" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1.3"/>
  <rect x="167.143" y="121.667" width="47.143" height="208.333" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1.3"/>
  <rect x="214.286" y="163.333" width="47.143" height="166.667" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1.3"/>
  <rect x="261.429" y="246.667" width="47.143" height="83.333" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1.3"/>
  <rect x="308.571" y="288.333" width="47.143" height="41.667" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1.3"/>
  <rect x="355.714" y="330" width="47.143" height="0" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1.3"/>
  <rect x="402.857" y="288.333" width="47.143" height="41.667" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1.3"/>
  <rect x="450" y="330" width="47.143" height="0" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1.3"/>
  <rect x="497.143" y="330" width="47.143" height="0" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1.3"/>
  <rect x="544.286" y="330" width="47.143" height="0" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1.3"/>
  <rect x="591.429" y="330" width="47.143" height="0" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1.3"/>
  <rect x="638.571" y="330" width="47.143" height="0" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1.3"/>
  <rect x="685.714" y="330" width="47.143" height="0" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1.3"/>
  <rect x="732.857" y="288.333" width="47.143" height="41.667" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1.3"/>
  <line x1="223.714" y1="80" x2="223.714" y2="330" stroke="#3f7a52" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 4"/>
  <line x1="270.857" y1="80" x2="270.857" y2="330" stroke="#c2622d" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 4"/>
  <text x="216.714" y="70" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f7a52" text-anchor="end" font-weight="bold">median 11 min</text>
  <text x="277.857" y="70" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#c2622d" text-anchor="start" font-weight="bold">mean 16 min</text>
  <line x1="223.714" y1="112" x2="270.857" y2="112" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="223.714" y1="107" x2="223.714" y2="117" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="270.857" y1="107" x2="270.857" y2="117" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
  <text x="247.286" y="100" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">gap of 5 minutes</text>
  <text x="470" y="196" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">one visit waited 65 minutes,</text>
  <text x="470" y="211" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">alone at the far end of the</text>
  <text x="470" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">tail</text>
  <line x1="660" y1="222" x2="741.238" y2="278.026" stroke="#5b6672" stroke-width="1.3" stroke-linecap="round"/>
  <polygon points="747,282 743.026,275.433 739.449,280.619" fill="#5b6672"/>
  <text x="120" y="406" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Ten of the fifteen visits were shorter than the mean. The mean sits above the median because it</text>
  <text x="120" y="422" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">feels how far the tail reaches.</text>
</svg>
