  <line x1="182.18" y1="340" x2="182.18" y2="72" stroke="#8a4a2b" stroke-width="2.5"/>
  <text x="151.79" y="66" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#1c1b19" font-weight="600">Median = 8.5</text>
  <text x="187.18" y="66" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#8a4a2b" font-weight="600">Mean ≈ 9.8</text>
  <text x="610" y="30" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">Each bar covers two whole-minute times, such as 6 and 7.</text>
