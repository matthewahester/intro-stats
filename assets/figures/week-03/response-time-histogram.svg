<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Response times for 60 hypothetical ambulance calls, with the median and mean marked</title>
  <desc id="desc">Right-skewed histogram of 60 response times from 4 to 31 minutes in 2-minute bins. Most calls took 6 to 11 minutes, with a long right tail. The median is 8.5 minutes and the mean, about 9.8, lies to its right.</desc>
