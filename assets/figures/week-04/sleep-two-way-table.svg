<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" width="640" height="390" role="img" aria-labelledby="title desc">
  <title id="title">A two-way table of screen use before bed and sleep quality for 500 hypothetical adults</title>
  <desc id="desc">Table with screen use in rows and sleep quality in columns. Yes: 75 poor, 120 fair, 105 good, total 300. No: 30, 70, 100, total 200. The notes below show 75 divided by 300 is 0.25 and 30 divided by 200 is 0.15.</desc>
  <rect x="0" y="0" width="640" height="390" fill="#ffffff" stroke="none" stroke-width="1.5"/>
  <text x="365" y="64" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19" font-weight="600">Response variable: sleep quality (columns)</text>
  <rect x="40" y="78" width="190" height="44" fill="#ffffff" stroke="#d8d6d0" stroke-width="1"/>
  <rect x="230" y="78" width="90" height="44" fill="#ffffff" stroke="#d8d6d0" stroke-width="1"/>
  <text x="275" y="105" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19" font-weight="600">Poor</text>
  <rect x="320" y="78" width="90" height="44" fill="#ffffff" stroke="#d8d6d0" stroke-width="1"/>
  <text x="365" y="105" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19" font-weight="600">Fair</text>
  <rect x="410" y="78" width="90" height="44" fill="#ffffff" stroke="#d8d6d0" stroke-width="1"/>
  <text x="455" y="105" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19" font-weight="600">Good</text>
  <rect x="500" y="78" width="100" height="44" fill="#f1efea" stroke="#d8d6d0" stroke-width="1"/>
  <text x="550" y="105" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19" font-weight="600">Total</text>
  <text x="50" y="96" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#3a3935">Explanatory variable:</text>
  <text x="50" y="113" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#3a3935">screen use before bed (rows)</text>
  <rect x="40" y="122" width="190" height="42" fill="#e9cdbd" stroke="#d8d6d0" stroke-width="1"/>
  <text x="50" y="149" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="start" fill="#8a4a2b" font-weight="600">Screen use: yes</text>
  <rect x="230" y="122" width="90" height="42" fill="#e9cdbd" stroke="#d8d6d0" stroke-width="1"/>
  <text x="275" y="149" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#1c1b19">75</text>
  <rect x="320" y="122" width="90" height="42" fill="#e9cdbd" stroke="#d8d6d0" stroke-width="1"/>
  <text x="365" y="149" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#1c1b19">120</text>
  <rect x="410" y="122" width="90" height="42" fill="#e9cdbd" stroke="#d8d6d0" stroke-width="1"/>
  <text x="455" y="149" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#1c1b19">105</text>
  <rect x="500" y="122" width="100" height="42" fill="#f1efea" stroke="#d8d6d0" stroke-width="1"/>
  <text x="550" y="149" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#1c1b19">300</text>
  <rect x="40" y="164" width="190" height="42" fill="#c9d8e1" stroke="#d8d6d0" stroke-width="1"/>
  <text x="50" y="191" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="start" fill="#35566b" font-weight="600">Screen use: no</text>
  <rect x="230" y="164" width="90" height="42" fill="#c9d8e1" stroke="#d8d6d0" stroke-width="1"/>
  <text x="275" y="191" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#1c1b19">30</text>
  <rect x="320" y="164" width="90" height="42" fill="#c9d8e1" stroke="#d8d6d0" stroke-width="1"/>
  <text x="365" y="191" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#1c1b19">70</text>
  <rect x="410" y="164" width="90" height="42" fill="#c9d8e1" stroke="#d8d6d0" stroke-width="1"/>
  <text x="455" y="191" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#1c1b19">100</text>
  <rect x="500" y="164" width="100" height="42" fill="#f1efea" stroke="#d8d6d0" stroke-width="1"/>
  <text x="550" y="191" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#1c1b19">200</text>
  <rect x="40" y="206" width="190" height="42" fill="#f1efea" stroke="#d8d6d0" stroke-width="1"/>
  <text x="50" y="233" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="start" fill="#1c1b19" font-weight="600">Total</text>
  <rect x="230" y="206" width="90" height="42" fill="#f1efea" stroke="#d8d6d0" stroke-width="1"/>
  <text x="275" y="233" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#1c1b19">105</text>
  <rect x="320" y="206" width="90" height="42" fill="#f1efea" stroke="#d8d6d0" stroke-width="1"/>
  <text x="365" y="233" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#1c1b19">190</text>
  <rect x="410" y="206" width="90" height="42" fill="#f1efea" stroke="#d8d6d0" stroke-width="1"/>
  <text x="455" y="233" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#1c1b19">205</text>
  <rect x="500" y="206" width="100" height="42" fill="#f1efea" stroke="#d8d6d0" stroke-width="1"/>
  <text x="550" y="233" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#1c1b19">500</text>
  <rect x="233" y="125" width="84" height="36" fill="none" stroke="#8a4a2b" stroke-width="2.5"/>
  <rect x="503" y="125" width="94" height="36" fill="none" stroke="#8a4a2b" stroke-width="2.5"/>
  <rect x="233" y="167" width="84" height="36" fill="none" stroke="#35566b" stroke-width="2.5"/>
  <rect x="503" y="167" width="94" height="36" fill="none" stroke="#35566b" stroke-width="2.5"/>
  <text x="550" y="266" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">margins: row and</text>
  <text x="550" y="281" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">column totals</text>
  <text x="40" y="296" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="start" fill="#1c1b19">Conditional (row) proportion of poor sleep: divide by the row total.</text>
  <text x="40" y="322" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="start" fill="#8a4a2b" font-weight="600">Screen users: 75 ÷ 300 = 0.25</text>
  <text x="40" y="346" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="start" fill="#35566b" font-weight="600">Non-users: 30 ÷ 200 = 0.15</text>
  <text x="40" y="372" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#3a3935">Each row's proportions add to 1, for example 0.25 + 0.40 + 0.35 = 1.</text>
</svg>
