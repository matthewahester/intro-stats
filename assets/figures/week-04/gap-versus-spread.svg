<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 415" width="780" height="415" role="img">
  <title>The gap between two group means drawn against the spread among individuals</title>
  <desc>Individual heart rates for both groups on one axis. The seven beats-per-minute gap between the group means is bracketed at the top and is about the same length as the marked within-group standard deviation below the axis.</desc>
  <rect x="0" y="0" width="780" height="415" fill="#ffffff"/>
  <text x="390" y="30" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">The gap between averages, next to the spread between people</text>
  <rect x="170" y="88" width="540" height="170" fill="none" stroke="#c9d1d9" stroke-width="1.2"/>
  <line x1="185.882" y1="258" x2="185.882" y2="262" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="185.882" y="275" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">55</text>
  <line x1="265.294" y1="258" x2="265.294" y2="262" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="265.294" y="275" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">60</text>
  <line x1="344.706" y1="258" x2="344.706" y2="262" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="344.706" y="275" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">65</text>
  <line x1="424.118" y1="258" x2="424.118" y2="262" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="424.118" y="275" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">70</text>
  <line x1="503.529" y1="258" x2="503.529" y2="262" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="503.529" y="275" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">75</text>
  <line x1="582.941" y1="258" x2="582.941" y2="262" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="582.941" y="275" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">80</text>
  <line x1="662.353" y1="258" x2="662.353" y2="262" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="662.353" y="275" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">85</text>
  <text x="440" y="296" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">Resting heart rate (beats per minute)</text>
  <rect x="297.059" y="88" width="254.118" height="170" fill="#eef2f6"/>
  <line x1="376.471" y1="72" x2="376.471" y2="258" stroke="#2f6f9f" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <line x1="487.647" y1="72" x2="487.647" y2="258" stroke="#c2622d" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <line x1="376.471" y1="72" x2="487.647" y2="72" stroke="#1f2933" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="376.471" y1="72" x2="376.471" y2="78" stroke="#1f2933" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="487.647" y1="72" x2="487.647" y2="78" stroke="#1f2933" stroke-width="1.3" stroke-linecap="round"/>
  <text x="432.059" y="62" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">gap between the averages: 7 bpm</text>
  <circle cx="297.059" cy="168" r="4" fill="#c2622d"/>
  <circle cx="360.588" cy="168" r="4" fill="#c2622d"/>
  <circle cx="392.353" cy="168" r="4" fill="#c2622d"/>
  <circle cx="424.118" cy="168" r="4" fill="#c2622d"/>
  <circle cx="455.882" cy="168" r="4" fill="#c2622d"/>
  <circle cx="487.647" cy="168" r="4" fill="#c2622d"/>
  <circle cx="519.412" cy="168" r="4" fill="#c2622d"/>
  <circle cx="551.176" cy="168" r="4" fill="#c2622d"/>
  <circle cx="614.706" cy="168" r="4" fill="#c2622d"/>
  <circle cx="614.706" cy="158.6" r="4" fill="#c2622d"/>
  <circle cx="646.471" cy="168" r="4" fill="#c2622d"/>
  <circle cx="233.529" cy="248" r="4" fill="#2f6f9f"/>
  <circle cx="265.294" cy="248" r="4" fill="#2f6f9f"/>
  <circle cx="297.059" cy="248" r="4" fill="#2f6f9f"/>
  <circle cx="328.824" cy="248" r="4" fill="#2f6f9f"/>
  <circle cx="344.706" cy="248" r="4" fill="#2f6f9f"/>
  <circle cx="360.588" cy="248" r="4" fill="#2f6f9f"/>
  <circle cx="392.353" cy="248" r="4" fill="#2f6f9f"/>
  <circle cx="424.118" cy="248" r="4" fill="#2f6f9f"/>
  <circle cx="455.882" cy="248" r="4" fill="#2f6f9f"/>
  <circle cx="487.647" cy="248" r="4" fill="#2f6f9f"/>
  <circle cx="551.176" cy="248" r="4" fill="#2f6f9f"/>
  <text x="162" y="165" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end">No regular exercise</text>
  <text x="162" y="181" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">n = 11</text>
  <text x="162" y="245" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end">Regular exercise</text>
  <text x="162" y="261" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">n = 11</text>
  <text x="376.471" y="206" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f6f9f" text-anchor="middle" font-weight="bold">mean 67</text>
  <text x="487.647" y="226" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="middle" font-weight="bold">mean 74</text>
  <line x1="233.529" y1="330" x2="338.917" y2="330" stroke="#1f2933" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="233.529" y1="324" x2="233.529" y2="336" stroke="#1f2933" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="338.917" y1="324" x2="338.917" y2="336" stroke="#1f2933" stroke-width="1.5" stroke-linecap="round"/>
  <text x="350.917" y="334" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">one within-group standard deviation, about 6.6 bpm</text>
  <text x="60" y="368" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Seventeen of these twenty-two people fall inside the shaded band, where the two groups are not</text>
  <text x="60" y="384" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">distinguishable. The gap between the averages is about as long as the ordinary distance</text>
  <text x="60" y="400" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">between one person and their own group's mean.</text>
</svg>
