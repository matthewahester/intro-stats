<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 415" width="780" height="415" role="img">
  <title>Side-by-side boxplots of resting heart rate for two groups of eleven students</title>
  <desc>Two boxplots on a shared beats-per-minute axis. The no-regular-exercise group sits higher and is more spread out than the regular-exercise group, and the two boxes overlap.</desc>
  <rect x="0" y="0" width="780" height="415" fill="#ffffff"/>
  <text x="390" y="32" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Resting heart rate, two groups of eleven students</text>
  <rect x="185" y="96" width="520" height="190" fill="none" stroke="#c9d1d9" stroke-width="1.2"/>
  <line x1="200.294" y1="286" x2="200.294" y2="290" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="200.294" y="303" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">55</text>
  <line x1="276.765" y1="286" x2="276.765" y2="290" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="276.765" y="303" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">60</text>
  <line x1="353.235" y1="286" x2="353.235" y2="290" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="353.235" y="303" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">65</text>
  <line x1="429.706" y1="286" x2="429.706" y2="290" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="429.706" y="303" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">70</text>
  <line x1="506.176" y1="286" x2="506.176" y2="290" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="506.176" y="303" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">75</text>
  <line x1="582.647" y1="286" x2="582.647" y2="290" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="582.647" y="303" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">80</text>
  <line x1="659.118" y1="286" x2="659.118" y2="290" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="659.118" y="303" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">85</text>
  <text x="445" y="324" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">Resting heart rate (beats per minute)</text>
  <rect x="307.353" y="132" width="152.941" height="36" fill="#dbe6ef" stroke="#2f6f9f" stroke-width="1.4"/>
  <line x1="368.529" y1="132" x2="368.529" y2="168" stroke="#2f6f9f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="246.176" y1="150" x2="307.353" y2="150" stroke="#2f6f9f" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="460.294" y1="150" x2="552.059" y2="150" stroke="#2f6f9f" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="246.176" y1="138" x2="246.176" y2="162" stroke="#2f6f9f" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="552.059" y1="138" x2="552.059" y2="162" stroke="#2f6f9f" stroke-width="1.3" stroke-linecap="round"/>
  <rect x="399.118" y="217" width="214.118" height="36" fill="#f3e3d6" stroke="#c2622d" stroke-width="1.4"/>
  <line x1="490.882" y1="217" x2="490.882" y2="253" stroke="#c2622d" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="307.353" y1="235" x2="399.118" y2="235" stroke="#c2622d" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="613.235" y1="235" x2="643.824" y2="235" stroke="#c2622d" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="307.353" y1="223" x2="307.353" y2="247" stroke="#c2622d" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="643.824" y1="223" x2="643.824" y2="247" stroke="#c2622d" stroke-width="1.3" stroke-linecap="round"/>
  <text x="177" y="145" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end">Regular exercise</text>
  <text x="177" y="161" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">n = 11</text>
  <text x="177" y="230" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end">No regular exercise</text>
  <text x="177" y="246" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">n = 11</text>
  <text x="246.176" y="112" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5b6672" text-anchor="middle" font-style="italic">min</text>
  <text x="246.176" y="126" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f6f9f" text-anchor="middle" font-weight="bold">58</text>
  <text x="307.353" y="112" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5b6672" text-anchor="middle" font-style="italic">Q1</text>
  <text x="307.353" y="126" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f6f9f" text-anchor="middle" font-weight="bold">62</text>
  <text x="368.529" y="112" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5b6672" text-anchor="middle" font-style="italic">median</text>
  <text x="368.529" y="126" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f6f9f" text-anchor="middle" font-weight="bold">66</text>
  <text x="460.294" y="112" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5b6672" text-anchor="middle" font-style="italic">Q3</text>
  <text x="460.294" y="126" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f6f9f" text-anchor="middle" font-weight="bold">72</text>
  <text x="552.059" y="112" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5b6672" text-anchor="middle" font-style="italic">max</text>
  <text x="552.059" y="126" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f6f9f" text-anchor="middle" font-weight="bold">78</text>
  <text x="307.353" y="269" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="middle" font-weight="bold">62</text>
  <text x="399.118" y="269" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="middle" font-weight="bold">68</text>
  <text x="490.882" y="269" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="middle" font-weight="bold">74</text>
  <text x="613.235" y="269" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="middle" font-weight="bold">82</text>
  <text x="643.824" y="269" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="middle" font-weight="bold">84</text>
  <text x="60" y="352" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">The box holds the middle half of a group; the heavy line inside it is that group's median.</text>
  <text x="60" y="370" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Both groups share one axis, so the distance between the two boxes is a distance in beats per minute.</text>
</svg>
