<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Side-by-side box plots of hypothetical ambulance response times in an urban and a rural district</title>
  <desc id="desc">Box plots on one axis from 0 to 30 minutes. Urban, 15 calls: whiskers 4 to 11, box 6 to 9, median 7, one outlier at 18. Rural, 15 calls: whiskers 6 to 27, box 10 to 18, median 13. The boxes do not overlap.</desc>
  <rect x="0" y="0" width="640" height="330" fill="#ffffff" stroke="none" stroke-width="1.5"/>
  <line x1="150" y1="40" x2="150" y2="262" stroke="#d8d6d0" stroke-width="1"/>
  <line x1="226.67" y1="40" x2="226.67" y2="262" stroke="#d8d6d0" stroke-width="1"/>
  <line x1="303.33" y1="40" x2="303.33" y2="262" stroke="#d8d6d0" stroke-width="1"/>
  <line x1="380" y1="40" x2="380" y2="262" stroke="#d8d6d0" stroke-width="1"/>
  <line x1="456.67" y1="40" x2="456.67" y2="262" stroke="#d8d6d0" stroke-width="1"/>
  <line x1="533.33" y1="40" x2="533.33" y2="262" stroke="#d8d6d0" stroke-width="1"/>
  <line x1="610" y1="40" x2="610" y2="262" stroke="#d8d6d0" stroke-width="1"/>
  <text x="138" y="98" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="end" fill="#35566b" font-weight="600">Urban district</text>
  <text x="138" y="115" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">15 calls</text>
  <line x1="211.33" y1="100" x2="242" y2="100" stroke="#35566b" stroke-width="1.5"/>
  <line x1="288" y1="100" x2="318.67" y2="100" stroke="#35566b" stroke-width="1.5"/>
  <line x1="211.33" y1="90" x2="211.33" y2="110" stroke="#35566b" stroke-width="1.5"/>
  <line x1="318.67" y1="90" x2="318.67" y2="110" stroke="#35566b" stroke-width="1.5"/>
  <rect x="242" y="78" width="46" height="44" fill="#c9d8e1" stroke="#35566b" stroke-width="1.5"/>
  <line x1="257.33" y1="78" x2="257.33" y2="122" stroke="#1c1b19" stroke-width="3"/>
  <text x="257.33" y="70" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">median 7</text>
  <text x="265" y="139" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">IQR 3</text>
  <circle cx="426" cy="100" r="5" fill="#ffffff" stroke="#35566b" stroke-width="2"/>
  <text x="436" y="98" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#3a3935">outlier, 18 minutes</text>
  <text x="436" y="113" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#3a3935">(upper fence 13.5)</text>
  <text x="138" y="194" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="end" fill="#8a4a2b" font-weight="600">Rural district</text>
  <text x="138" y="211" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">15 calls</text>
  <line x1="242" y1="196" x2="303.33" y2="196" stroke="#8a4a2b" stroke-width="1.5"/>
  <line x1="426" y1="196" x2="564" y2="196" stroke="#8a4a2b" stroke-width="1.5"/>
  <line x1="242" y1="186" x2="242" y2="206" stroke="#8a4a2b" stroke-width="1.5"/>
  <line x1="564" y1="186" x2="564" y2="206" stroke="#8a4a2b" stroke-width="1.5"/>
  <rect x="303.33" y="174" width="122.67" height="44" fill="#e9cdbd" stroke="#8a4a2b" stroke-width="1.5"/>
  <line x1="349.33" y1="174" x2="349.33" y2="218" stroke="#1c1b19" stroke-width="3"/>
  <text x="349.33" y="166" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">median 13</text>
  <text x="364.67" y="235" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">IQR 8</text>
  <line x1="150" y1="262" x2="610" y2="262" stroke="#1c1b19" stroke-width="1.5"/>
  <line x1="150" y1="262" x2="150" y2="267" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="150" y="281" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">0</text>
  <line x1="226.67" y1="262" x2="226.67" y2="267" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="226.67" y="281" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">5</text>
  <line x1="303.33" y1="262" x2="303.33" y2="267" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="303.33" y="281" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">10</text>
  <line x1="380" y1="262" x2="380" y2="267" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="380" y="281" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">15</text>
  <line x1="456.67" y1="262" x2="456.67" y2="267" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="456.67" y="281" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">20</text>
  <line x1="533.33" y1="262" x2="533.33" y2="267" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="533.33" y="281" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">25</text>
  <line x1="610" y1="262" x2="610" y2="267" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="610" y="281" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">30</text>
  <text x="380" y="302" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19">Response time (minutes)</text>
</svg>
