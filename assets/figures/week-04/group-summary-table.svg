  <text x="167" y="342" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end">Clinic South</text>
  <text x="167" y="358" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">n = 12</text>
