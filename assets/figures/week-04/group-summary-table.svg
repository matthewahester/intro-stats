<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" role="img">
  <title>A group summary table for two clinics, with the boxplots the table describes</title>
  <desc>A table gives both clinics a mean wait of 23.0 minutes, but Clinic South has a much smaller median and a much larger standard deviation. The boxplots below show South compact and low with two long waits far to the right.</desc>
