<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" width="640" height="370" role="img" aria-labelledby="title desc">
  <title id="title">One logistic model on two scales: a straight line in log odds, an S-shaped curve in probability</title>
  <desc id="desc">Illustrative model log odds = −5.0 + 0.09 × age. Left: log odds rise in a straight line, −2.3 at age 30 to 1.3 at 70. Right: probability follows an S curve, 0.09 at 30, 0.38 at 50, 0.79 at 70, crossing 0.5 near age 55.6.</desc>
