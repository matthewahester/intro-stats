  <rect x="90" y="88" width="690" height="332" fill="none" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="24" y="484" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">The curve also bends where the line cannot: an extra hour matters most in the middle and least near the ends.</text>
