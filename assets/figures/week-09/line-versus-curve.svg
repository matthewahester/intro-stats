  <text x="504" y="437" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">8</text>
  <line x1="642" y1="420" x2="642" y2="424" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="642" y="437" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">10</text>
  <line x1="780" y1="420" x2="780" y2="424" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="780" y="437" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">12</text>
  <line x1="86" y1="357.75" x2="90" y2="357.75" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="82" y="361.55" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0</text>
  <line x1="86" y1="305.875" x2="90" y2="305.875" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="82" y="309.675" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0.25</text>
  <line x1="86" y1="254" x2="90" y2="254" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="82" y="257.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0.50</text>
  <line x1="86" y1="202.125" x2="90" y2="202.125" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="82" y="205.925" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0.75</text>
  <line x1="86" y1="150.25" x2="90" y2="150.25" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="82" y="154.05" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">1</text>
  <text x="435" y="458" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">average nightly sleep (hours)</text>
  <rect x="90" y="88" width="690" height="62.25" fill="#f7e4e4"/>
  <rect x="90" y="357.75" width="690" height="62.25" fill="#f7e4e4"/>
