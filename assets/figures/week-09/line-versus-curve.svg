<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500" role="img">
  <title>A logistic curve and a straight line fitted to a yes-or-no outcome</title>
  <desc>The share of students reporting they feel rested rises with nightly sleep along an S-shaped curve that stays between 0 and 1. A straight line fitted to the same points predicts about -0.15 at two hours and about 1.22 at twelve hours, both impossible.</desc>
  <rect x="0" y="0" width="860" height="500" fill="#ffffff"/>
  <text x="24" y="30" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">A straight line cannot model a yes-or-no outcome</text>
  <text x="24" y="52" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Campus sleep survey, 480 students. Dots are the share of students at each sleep hour who report feeling rested.</text>
  <text x="90" y="76" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">share reporting they feel rested</text>
  <line x1="90" y1="420" x2="90" y2="424" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="90" y="437" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">2</text>
  <line x1="228" y1="420" x2="228" y2="424" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="228" y="437" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">4</text>
