<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Parallel fitted lines for hypothetical urban and rural counties: the rural coefficient is the vertical gap</title>
  <desc id="desc">Two parallel lines of predicted life expectancy against median income for hypothetical counties, slope 0.10 years per 1,000 dollars, rural 1.2 years below urban. Diamonds mark group averages: urban 76.6, rural 74.1, a raw gap of 2.5 years.</desc>
