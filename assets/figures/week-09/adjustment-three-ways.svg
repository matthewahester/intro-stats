<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 552" width="900" height="552" role="img">
  <title>Unadjusted and adjusted estimates in three studies</title>
  <desc>Three panels. In each, the unadjusted estimate and the adjusted estimate for the same comparison are drawn on one axis with a zero line. The adjusted estimate shrinks toward zero in the first panel, grows in the second, and changes sign in the third.</desc>
  <rect x="0" y="0" width="900" height="552" fill="#ffffff"/>
