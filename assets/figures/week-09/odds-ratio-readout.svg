<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 486" width="900" height="486" role="img">
  <title>A labelled logistic output block with the odds ratio called out</title>
  <desc>A logistic output table lists an intercept, a reminder-text coefficient of 0.44 with an odds ratio of 1.55, and an age coefficient of 0.26 with an odds ratio of 1.30. The 1.55 is boxed, and a table below shows it moving one patient from 0.23 to 0.32 and another from 0.85 to 0.90.</desc>
  <rect x="0" y="0" width="900" height="486" fill="#ffffff"/>
  <text x="30" y="30" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">Reading an odds ratio from logistic output</text>
  <text x="30" y="52" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Outcome: returned for the follow-up visit within 30 days. 400 patients at a community clinic.</text>
  <rect x="40" y="76" width="660" height="28" fill="#eef2f6"/>
  <text x="49" y="94.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="bold">Term</text>
  <text x="431" y="94.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="end" font-weight="bold">Estimate</text>
  <text x="561" y="94.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="end" font-weight="bold">Std. Error</text>
  <text x="691" y="94.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="end" font-weight="bold">Odds ratio</text>
  <line x1="40" y1="76" x2="700" y2="76" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="49" y="122.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">(Intercept)</text>
  <text x="431" y="122.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="end">-1.35</text>
  <text x="561" y="122.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="end">0.19</text>
  <text x="691" y="122.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="end"></text>
  <line x1="40" y1="104" x2="700" y2="104" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="49" y="150.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">Reminder text (yes)</text>
  <text x="431" y="150.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="end">0.44</text>
  <text x="561" y="150.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="end">0.21</text>
  <text x="691" y="150.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="end">1.55</text>
  <line x1="40" y1="132" x2="700" y2="132" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="49" y="178.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">Age (per 10 years above 40)</text>
  <text x="431" y="178.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="end">0.26</text>
  <text x="561" y="178.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="end">0.09</text>
  <text x="691" y="178.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="end">1.30</text>
  <line x1="40" y1="160" x2="700" y2="160" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="40" y1="188" x2="700" y2="188" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="310" y1="76" x2="310" y2="188" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="440" y1="76" x2="440" y2="188" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="570" y1="76" x2="570" y2="188" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="40" y1="76" x2="40" y2="188" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="700" y1="76" x2="700" y2="188" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <rect x="570" y="132" width="130" height="28" fill="none" stroke="#c2622d" stroke-width="2"/>
  <rect x="40" y="206" width="820" height="66" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1"/>
  <line x1="635" y1="204" x2="635" y2="171" stroke="#c2622d" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="635,164 631.85,171 638.15,171" fill="#c2622d"/>
  <text x="56" y="230" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="bold">What the 1.55 says</text>
  <text x="56" y="251" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">Comparing two patients of the same age, one who got a reminder text and one who did not, the odds of</text>
  <text x="56" y="268" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">returning are about 1.55 times as high for the patient who got the text.</text>
  <rect x="40" y="292" width="820" height="28" fill="#eef2f6"/>
  <text x="49" y="310.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="bold">Two patients, one odds ratio</text>
  <text x="560" y="310.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">chance without a text</text>
  <text x="760" y="310.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">chance with a text</text>
  <line x1="40" y1="292" x2="860" y2="292" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="49" y="338.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">a patient unlikely to return</text>
  <text x="560" y="338.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">0.23</text>
  <text x="760" y="338.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">0.32</text>
  <line x1="40" y1="320" x2="860" y2="320" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="49" y="366.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">a patient very likely to return</text>
  <text x="560" y="366.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">0.85</text>
  <text x="760" y="366.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">0.90</text>
  <line x1="40" y1="348" x2="860" y2="348" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="40" y1="376" x2="860" y2="376" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="460" y1="292" x2="460" y2="376" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="660" y1="292" x2="660" y2="376" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="40" y1="292" x2="40" y2="376" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="860" y1="292" x2="860" y2="376" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <rect x="40" y="394" width="820" height="62" fill="#ffffff" rx="6" stroke="#c9d1d9" stroke-width="1"/>
  <text x="56" y="416" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="bold">Why the two rows move by different amounts</text>
  <text x="56" y="437" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">The odds ratio is the same in both rows. Near the middle of the range it moves the chance a lot; near the top</text>
  <text x="56" y="452" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">it barely can, because a probability cannot pass 1.</text>
</svg>
