<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" width="960" height="452" role="img">
  <title>A two-model regression output with the adjustment set marked</title>
  <desc>A table compares two fitted models of blood pressure. Model 1 uses walking only and gives a walking coefficient of -0.12. Model 2 adds age and gives -0.05. Callouts mark the coefficient that changed and the variable being held fixed.</desc>
  <rect x="0" y="0" width="960" height="452" fill="#ffffff"/>
  <text x="30" y="30" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">Reading a multiple regression output</text>
  <text x="30" y="52" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Outcome: systolic blood pressure in mm Hg. 300 adults at a community clinic.</text>
  <rect x="40" y="76" width="620" height="26" fill="#eef2f6"/>
  <text x="49" y="93.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="bold">Term</text>
  <text x="456" y="93.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="end" font-weight="bold">Model 1</text>
  <text x="651" y="93.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="end" font-weight="bold">Model 2</text>
  <line x1="40" y1="76" x2="660" y2="76" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="49" y="119.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start"></text>
  <text x="456" y="119.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="end">walking only</text>
  <text x="651" y="119.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="end">walking and age</text>
  <line x1="40" y1="102" x2="660" y2="102" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="49" y="145.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">(Intercept)</text>
  <text x="456" y="145.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="end">128.20</text>
  <text x="651" y="145.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="end">99.06</text>
  <line x1="40" y1="128" x2="660" y2="128" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="49" y="171.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">Walking (minutes per day)</text>
  <text x="456" y="171.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="end">-0.12</text>
  <text x="651" y="171.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="end">-0.05</text>
  <line x1="40" y1="154" x2="660" y2="154" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="49" y="197.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">Age (years)</text>
  <text x="456" y="197.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="end">not in this model</text>
  <text x="651" y="197.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="end">0.52</text>
  <line x1="40" y1="180" x2="660" y2="180" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="40" y1="206" x2="660" y2="206" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="290" y1="76" x2="290" y2="206" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="465" y1="76" x2="465" y2="206" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="40" y1="76" x2="40" y2="206" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="660" y1="76" x2="660" y2="206" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <rect x="690" y="146" width="252" height="46" fill="#eef2f6" rx="6" stroke="#c2622d" stroke-width="1.2"/>
  <text x="702" y="165" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">the one number that changed when</text>
  <text x="702" y="179" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">age joined the model</text>
  <line x1="686" y1="169" x2="670.971" y2="167.634" stroke="#c2622d" stroke-width="1.3" stroke-linecap="round"/>
  <polygon points="664,167 670.686,170.771 671.256,164.497" fill="#c2622d"/>
  <rect x="690" y="200" width="252" height="40" fill="#eef2f6" rx="6" stroke="#3f7a52" stroke-width="1.2"/>
  <text x="702" y="216" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">the adjustment set: the variable</text>
  <text x="702" y="230" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">held fixed</text>
  <line x1="686" y1="216" x2="669.063" y2="199.833" stroke="#3f7a52" stroke-width="1.3" stroke-linecap="round"/>
  <polygon points="664,195 666.888,202.112 671.238,197.555" fill="#3f7a52"/>
  <rect x="40" y="252" width="900" height="74" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1"/>
  <text x="56" y="274" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="bold">Model 2, read out loud</text>
  <text x="56" y="296" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">Comparing two adults of the same age whose daily walking differs by ten minutes,</text>
  <text x="56" y="315" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">the one who walks more has predicted blood pressure lower by about 0.5 mm Hg.</text>
  <rect x="40" y="336" width="900" height="74" fill="#ffffff" rx="6" stroke="#c9d1d9" stroke-width="1"/>
  <text x="56" y="358" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="bold">Model 1, read out loud</text>
  <text x="56" y="380" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">Comparing two adults whose daily walking differs by ten minutes, saying nothing about age,</text>
  <text x="56" y="399" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">the one who walks more has predicted blood pressure lower by about 1.2 mm Hg.</text>
  <text x="40" y="434" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">Same data, same comparison, two different questions. Neither number is the wrong one; they answer different things.</text>
</svg>
