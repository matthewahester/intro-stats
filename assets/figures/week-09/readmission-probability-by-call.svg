<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="title desc">
  <title id="title">Predicted readmission probability with and without a follow-up call, by prior admissions (hypothetical study)</title>
