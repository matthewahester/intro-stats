<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="940" height="480" role="img">
  <title>Which kind of variable is it</title>
  <desc>A tree splitting variables into numerical and categorical, then into their two kinds each, with one example from the clinic table on every leaf.</desc>
  <rect x="0" y="0" width="940" height="480" fill="#ffffff"/>
  <text x="470" y="26" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Which kind of variable is it?</text>
  <rect x="375" y="46" width="190" height="44" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="470" y="72.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle">Variable</text>
  <line x1="470" y1="90" x2="470" y2="112" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="250" y1="112" x2="690" y2="112" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="250" y1="112" x2="250" y2="140" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="150" y="140" width="200" height="44" fill="#ffffff" rx="6" stroke="#2f6f9f" stroke-width="1.2"/>
  <text x="250" y="166.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2f6f9f" text-anchor="middle">Numerical</text>
  <line x1="690" y1="112" x2="690" y2="140" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="590" y="140" width="200" height="44" fill="#ffffff" rx="6" stroke="#c2622d" stroke-width="1.2"/>
  <text x="690" y="166.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c2622d" text-anchor="middle">Categorical</text>
  <line x1="250" y1="184" x2="250" y2="212" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="130" y1="212" x2="250" y2="212" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="130" y1="212" x2="130" y2="250" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="40" y="250" width="180" height="44" fill="#ffffff" rx="6" stroke="#2f6f9f" stroke-width="1.2"/>
  <text x="130" y="276.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2f6f9f" text-anchor="middle">Discrete</text>
  <line x1="130" y1="294" x2="130" y2="318" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="40" y="318" width="180" height="100" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="50" y="340" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="start">Number of caffeinated</text>
  <text x="50" y="354" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="start">drinks yesterday. Whole</text>
  <text x="50" y="368" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="start">counts only, never 1.4.</text>
  <text x="50" y="382" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="start">Nothing sits between.</text>
  <line x1="250" y1="184" x2="250" y2="212" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="250" y1="212" x2="350" y2="212" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="350" y1="212" x2="350" y2="250" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="260" y="250" width="180" height="44" fill="#ffffff" rx="6" stroke="#2f6f9f" stroke-width="1.2"/>
  <text x="350" y="276.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2f6f9f" text-anchor="middle">Continuous</text>
  <line x1="350" y1="294" x2="350" y2="318" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="260" y="318" width="180" height="100" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="270" y="340" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="start">Resting heart rate in beats</text>
  <text x="270" y="354" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="start">per minute. Any value in a</text>
  <text x="270" y="368" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="start">range; 71.5 would make</text>
  <text x="270" y="382" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="start">sense.</text>
  <line x1="690" y1="184" x2="690" y2="212" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="590" y1="212" x2="690" y2="212" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="590" y1="212" x2="590" y2="250" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="500" y="250" width="180" height="44" fill="#ffffff" rx="6" stroke="#c2622d" stroke-width="1.2"/>
  <text x="590" y="276.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c2622d" text-anchor="middle">Nominal</text>
  <line x1="590" y1="294" x2="590" y2="318" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="500" y="318" width="180" height="100" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="510" y="340" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="start">Commute: walk, bus, drive.</text>
  <text x="510" y="354" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="start">Named groups, and no order</text>
  <text x="510" y="368" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="start">among them.</text>
  <line x1="690" y1="184" x2="690" y2="212" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="690" y1="212" x2="810" y2="212" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="810" y1="212" x2="810" y2="250" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="720" y="250" width="180" height="44" fill="#ffffff" rx="6" stroke="#c2622d" stroke-width="1.2"/>
  <text x="810" y="276.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c2622d" text-anchor="middle">Ordinal</text>
  <line x1="810" y1="294" x2="810" y2="318" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="720" y="318" width="180" height="100" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="730" y="340" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="start">Sleep quality: poor, fair,</text>
  <text x="730" y="354" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="start">good. Ordered, but the gaps</text>
  <text x="730" y="368" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="start">are not equal or measured.</text>
  <text x="470" y="452" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">The kind of variable decides the picture, the summary, and the comparison you may make.</text>
</svg>
