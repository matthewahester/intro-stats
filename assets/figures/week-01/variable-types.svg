<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Four kinds of variables and how to tell them apart</title>
  <desc id="desc">Tree diagram. A variable is numerical, either discrete (counts such as exercise days) or continuous (measurements such as blood pressure), or categorical, either nominal (blood type) or ordinal (blood pressure category).</desc>
  <rect x="0" y="0" width="720" height="400" fill="#ffffff" stroke="none" stroke-width="1.5"/>
  <rect x="290" y="16" width="140" height="36" fill="#f1efeb" stroke="#1c1b19" stroke-width="1.5" rx="6"/>
  <text x="360" y="36" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19" font-weight="600">Variable</text>
  <rect x="61" y="96" width="240" height="58" fill="#c9d8e1" stroke="#35566b" stroke-width="1.5" rx="6"/>
  <text x="181" y="116" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#35566b" font-weight="600">Numerical</text>
  <text x="181" y="133" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">values are amounts, so differences</text>
  <text x="181" y="150" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">and averages make sense</text>
  <rect x="419" y="96" width="240" height="58" fill="#e9cdbd" stroke="#8a4a2b" stroke-width="1.5" rx="6"/>
  <text x="539" y="116" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#8a4a2b" font-weight="600">Categorical</text>
  <text x="539" y="133" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">values are groups or labels,</text>
  <text x="539" y="150" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">even when written as numbers</text>
  <line x1="360" y1="52" x2="360" y2="72" stroke="#1c1b19" stroke-width="1.5"/>
  <line x1="181" y1="72" x2="539" y2="72" stroke="#1c1b19" stroke-width="1.5"/>
  <line x1="181" y1="72" x2="181" y2="96" stroke="#1c1b19" stroke-width="1.5"/>
  <line x1="539" y1="72" x2="539" y2="96" stroke="#1c1b19" stroke-width="1.5"/>
  <rect x="10" y="204" width="166" height="108" fill="#ffffff" stroke="#35566b" stroke-width="1.5" rx="6"/>
  <text x="93" y="226" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#35566b" font-weight="600">Discrete</text>
  <text x="93" y="243" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">counts: whole numbers</text>
  <text x="93" y="260" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">with gaps between them</text>
  <text x="93" y="283" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">Example:</text>
  <text x="93" y="300" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">exercise days (0 to 7)</text>
  <rect x="186" y="204" width="166" height="108" fill="#ffffff" stroke="#35566b" stroke-width="1.5" rx="6"/>
  <text x="269" y="226" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#35566b" font-weight="600">Continuous</text>
  <text x="269" y="243" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">measurements that can</text>
  <text x="269" y="260" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">fall anywhere in a range</text>
  <text x="269" y="283" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">Example:</text>
  <text x="269" y="300" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">systolic BP (mm Hg)</text>
  <rect x="368" y="204" width="166" height="108" fill="#ffffff" stroke="#8a4a2b" stroke-width="1.5" rx="6"/>
  <text x="451" y="226" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#8a4a2b" font-weight="600">Nominal</text>
  <text x="451" y="243" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">groups with no</text>
  <text x="451" y="260" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">natural order</text>
  <text x="451" y="283" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">Examples: blood type,</text>
  <text x="451" y="300" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">smoker, clinic site</text>
  <rect x="544" y="204" width="166" height="108" fill="#ffffff" stroke="#8a4a2b" stroke-width="1.5" rx="6"/>
  <text x="627" y="226" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#8a4a2b" font-weight="600">Ordinal</text>
  <text x="627" y="243" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">groups with a</text>
  <text x="627" y="260" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">natural order</text>
  <text x="627" y="283" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">Example: BP category</text>
  <text x="627" y="300" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">normal, elevated, high</text>
  <line x1="181" y1="154" x2="181" y2="178" stroke="#35566b" stroke-width="1.5"/>
  <line x1="93" y1="178" x2="269" y2="178" stroke="#35566b" stroke-width="1.5"/>
  <line x1="93" y1="178" x2="93" y2="204" stroke="#35566b" stroke-width="1.5"/>
  <line x1="269" y1="178" x2="269" y2="204" stroke="#35566b" stroke-width="1.5"/>
  <line x1="539" y1="154" x2="539" y2="178" stroke="#8a4a2b" stroke-width="1.5"/>
  <line x1="451" y1="178" x2="627" y2="178" stroke="#8a4a2b" stroke-width="1.5"/>
  <line x1="451" y1="178" x2="451" y2="204" stroke="#8a4a2b" stroke-width="1.5"/>
  <line x1="627" y1="178" x2="627" y2="204" stroke="#8a4a2b" stroke-width="1.5"/>
  <text x="360" y="348" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">Test 1: are the values amounts, so that differences and averages make sense? If yes, it is numerical.</text>
  <text x="360" y="368" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">Test 2: for a categorical variable, do the groups have a natural order? If yes, it is ordinal.</text>
</svg>
