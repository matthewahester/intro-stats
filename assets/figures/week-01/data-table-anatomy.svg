<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img">
  <title>Anatomy of a rectangular data table</title>
  <desc>A ten-row campus clinic table with the row, the column, and one cell labelled.</desc>
  <rect x="0" y="0" width="960" height="500" fill="#ffffff"/>
  <text x="480" y="30" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">A rectangular data table</text>
  <text x="480" y="52" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">Campus clinic, one routine visit per student</text>
  <text x="414" y="88" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">One column is one variable</text>
  <line x1="414" y1="96" x2="414" y2="107" stroke="#1f2933" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="414,114 417.15,107 410.85,107" fill="#1f2933"/>
