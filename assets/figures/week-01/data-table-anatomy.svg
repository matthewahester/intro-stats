  <text x="500" y="424" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">One cell is one value: this student's</text>
  <text x="500" y="439" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">resting heart rate, 96 beats per minute.</text>
  <line x1="492" y1="420" x2="458.134" y2="401.373" stroke="#a33a3a" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="452,398 456.615,404.134 459.652,398.613" fill="#a33a3a"/>
  <text x="190" y="478" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Every case has a value in every column. That rectangle is what makes it a data table.</text>
