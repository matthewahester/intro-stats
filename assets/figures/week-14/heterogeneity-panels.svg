<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img">
  <title>Are the trials estimating the same thing?</title>
  <desc>Left panel, five intervals that all overlap a shaded band from 1 to 4 mm Hg. Right panel, five intervals spread from below zero to 13 with no value inside all of them.</desc>
