  <line x1="353.667" y1="246" x2="353.667" y2="250" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="353.667" y="263" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">12</text>
