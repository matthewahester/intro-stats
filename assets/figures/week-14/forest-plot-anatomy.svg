<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img">
  <title>How to read a forest plot</title>
  <desc>Five trial rows with square estimates sized by weight, horizontal intervals, a dashed line of no effect at zero, and a combined diamond at 2.8 mm Hg.</desc>
  <rect x="0" y="0" width="900" height="500" fill="#ffffff"/>
  <text x="450" y="28" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">How to read a forest plot</text>
  <text x="450" y="50" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">Five trials of a pharmacist-led medication review. Effect is the drop in systolic blood pressure, in mm Hg.</text>
  <line x1="380" y1="288" x2="380" y2="292" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="380" y="305" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">-4</text>
  <line x1="448" y1="288" x2="448" y2="292" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="448" y="305" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0</text>
  <line x1="516" y1="288" x2="516" y2="292" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="516" y="305" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">4</text>
  <line x1="584" y1="288" x2="584" y2="292" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="584" y="305" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">8</text>
  <line x1="652" y1="288" x2="652" y2="292" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="652" y="305" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">12</text>
  <line x1="720" y1="288" x2="720" y2="292" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="720" y="305" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">16</text>
  <text x="550" y="326" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">Drop in blood pressure, mm Hg (program minus usual care)</text>
  <line x1="380" y1="288" x2="720" y2="288" stroke="#c9d1d9" stroke-width="1.2" stroke-linecap="round"/>
  <text x="18" y="76" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="bold">Trial</text>
  <text x="112" y="76" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="end" font-weight="bold">People</text>
  <text x="128" y="76" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="bold">Effect (95% interval)</text>
  <text x="348" y="76" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="end" font-weight="bold">Weight</text>
  <line x1="14" y1="84" x2="352" y2="84" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="448" y1="88" x2="448" y2="288" stroke="#1f2933" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5 4"/>
  <text x="448" y="80" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">no effect</text>
  <text x="18" y="114" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">Trial A</text>
  <text x="112" y="114" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="end">36</text>
  <text x="128" y="114" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">6.0 (-2.0 to 14.0)</text>
  <text x="348" y="114" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="end">2%</text>
  <line x1="414" y1="110" x2="686" y2="110" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="414" y1="105" x2="414" y2="115" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="686" y1="105" x2="686" y2="115" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="547.879" y="107.879" width="4.243" height="4.243" fill="#2f6f9f"/>
  <text x="18" y="146" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">Trial B</text>
  <text x="112" y="146" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="end">144</text>
  <text x="128" y="146" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">1.5 (-2.5 to 5.5)</text>
  <text x="348" y="146" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="end">8%</text>
  <line x1="405.5" y1="142" x2="541.5" y2="142" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="405.5" y1="137" x2="405.5" y2="147" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="541.5" y1="137" x2="541.5" y2="147" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="469.257" y="137.757" width="8.485" height="8.485" fill="#2f6f9f"/>
  <text x="18" y="178" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">Trial C</text>
  <text x="112" y="178" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="end">144</text>
  <text x="128" y="178" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">5.0 (1.0 to 9.0)</text>
  <text x="348" y="178" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="end">8%</text>
  <line x1="465" y1="174" x2="601" y2="174" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="465" y1="169" x2="465" y2="179" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="601" y1="169" x2="601" y2="179" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="528.757" y="169.757" width="8.485" height="8.485" fill="#2f6f9f"/>
  <text x="18" y="210" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">Trial D</text>
  <text x="112" y="210" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="end">576</text>
  <text x="128" y="210" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">3.0 (1.0 to 5.0)</text>
  <text x="348" y="210" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="end">32%</text>
  <line x1="465" y1="206" x2="533" y2="206" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="465" y1="201" x2="465" y2="211" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="533" y1="201" x2="533" y2="211" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="490.515" y="197.515" width="16.971" height="16.971" fill="#2f6f9f"/>
  <text x="18" y="242" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">Trial E</text>
  <text x="112" y="242" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="end">900</text>
  <text x="128" y="242" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">2.4 (0.8 to 4.0)</text>
  <text x="348" y="242" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="end">50%</text>
  <line x1="461.6" y1="238" x2="516" y2="238" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="461.6" y1="233" x2="461.6" y2="243" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="516" y1="233" x2="516" y2="243" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="478.193" y="227.393" width="21.213" height="21.213" fill="#2f6f9f"/>
  <line x1="14" y1="252" x2="720" y2="252" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="18" y="272" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="bold">Combined</text>
  <text x="112" y="272" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="end">1800</text>
  <text x="128" y="272" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="bold">2.8 (1.7 to 3.9)</text>
  <text x="348" y="272" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="end">100%</text>
  <polygon points="476.39,268 495.6,259 514.81,268 495.6,277" fill="#3f7a52"/>
  <rect x="22" y="356" width="205" height="112" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1"/>
  <text x="34" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold">One row, one trial</text>
  <text x="34" y="398" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="start">Each row is a separate trial,</text>
  <text x="34" y="412" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="start">with its own people and its own</text>
  <text x="34" y="426" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="start">result.</text>
  <rect x="239" y="356" width="205" height="112" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1"/>
  <text x="251" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold">Square and line</text>
  <text x="251" y="398" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="start">The square is that trial's</text>
  <text x="251" y="412" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="start">estimate. The line spans its</text>
  <text x="251" y="426" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="start">95% interval. A bigger square</text>
  <text x="251" y="440" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="start">means the trial carries more</text>
  <text x="251" y="454" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="start">weight.</text>
  <rect x="456" y="356" width="205" height="112" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1"/>
  <text x="468" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold">The dashed line</text>
  <text x="468" y="398" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="start">The vertical dashed line is no</text>
  <text x="468" y="412" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="start">effect. An interval that</text>
  <text x="468" y="426" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="start">crosses it is consistent with</text>
  <text x="468" y="440" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="start">no benefit at all.</text>
  <rect x="673" y="356" width="205" height="112" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1"/>
  <text x="685" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold">The diamond</text>
  <text x="685" y="398" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="start">The diamond is the combined</text>
  <text x="685" y="412" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="start">estimate. Its width is the</text>
  <text x="685" y="426" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="start">combined interval, and it is</text>
  <text x="685" y="440" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="start">narrower than any single row.</text>
</svg>
