  <circle cx="407.2" cy="279.23" r="5.5" fill="#ffffff" stroke="#1c1b19" stroke-width="1.5"/>
  <circle cx="185.33" cy="290.77" r="5.5" fill="#35566b" stroke="#35566b" stroke-width="1"/>
  <circle cx="504.27" cy="302.31" r="5.5" fill="#ffffff" stroke="#1c1b19" stroke-width="1.5"/>
  <circle cx="378.6" cy="313.85" r="5.5" fill="#ffffff" stroke="#1c1b19" stroke-width="1.5"/>
  <circle cx="161.07" cy="325.38" r="5.5" fill="#35566b" stroke="#35566b" stroke-width="1"/>
  <circle cx="474.8" cy="336.92" r="5.5" fill="#ffffff" stroke="#1c1b19" stroke-width="1.5"/>
  <circle cx="470" cy="82" r="5.5" fill="#35566b" stroke="#35566b" stroke-width="1"/>
  <text x="482" y="86" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19">Published (9)</text>
  <circle cx="470" cy="104" r="5.5" fill="#ffffff" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="482" y="108" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19">Never published (11)</text>
  <text x="605" y="196" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935" font-weight="bold">Lower right: small</text>
  <text x="605" y="212" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">studies that found</text>
  <text x="605" y="228" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">no benefit stay hidden</text>
  <text x="344" y="422" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">← Favors supplement</text>
  <text x="356" y="422" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#3a3935">Favors placebo →</text>
  <text x="16" y="444" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#3a3935">Grey dashed lines: pooled estimate of all 20 studies ± 1.96 × SE</text>
