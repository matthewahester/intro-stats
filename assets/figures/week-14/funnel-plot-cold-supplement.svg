<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 452" width="640" height="452" role="img" aria-labelledby="title desc">
  <title id="title">Funnel plot of 20 hypothetical studies of a cold supplement</title>
  <desc id="desc">Each dot is a study, estimate against SE, most precise at top. 9 published studies (filled) and 11 never published (hollow), all smaller studies that found no benefit. All 20 pool to −0.01 days; the 9 published pool to −0.34 days.</desc>
