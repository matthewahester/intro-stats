<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img">
  <title>Precision decides the weight</title>
  <desc>Five intervals drawn at the same estimate so only their widths differ, beside bars showing weight shares that rise from 2 percent to 50 percent.</desc>
  <rect x="0" y="0" width="880" height="400" fill="#ffffff"/>
  <text x="440" y="28" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Precision decides the weight</text>
  <text x="440" y="50" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">The five trials redrawn at one common estimate, so the only thing that differs is precision.</text>
  <line x1="250" y1="266" x2="250" y2="270" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="250" y="283" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">-6</text>
  <line x1="305" y1="266" x2="305" y2="270" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="305" y="283" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">-3</text>
  <line x1="360" y1="266" x2="360" y2="270" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="360" y="283" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0</text>
  <line x1="415" y1="266" x2="415" y2="270" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="415" y="283" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">3</text>
  <line x1="470" y1="266" x2="470" y2="270" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="470" y="283" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">6</text>
  <line x1="525" y1="266" x2="525" y2="270" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="525" y="283" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">9</text>
  <line x1="580" y1="266" x2="580" y2="270" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="580" y="283" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">12</text>
  <text x="415" y="304" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">Effect (mm Hg)</text>
  <line x1="250" y1="266" x2="580" y2="266" stroke="#c9d1d9" stroke-width="1.2" stroke-linecap="round"/>
  <text x="18" y="74" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="bold">Trial</text>
  <text x="92" y="74" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="bold">People</text>
  <text x="170" y="74" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="bold">Std. error</text>
  <text x="640" y="74" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="bold">Share of the weight</text>
  <text x="18" y="112" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">Trial A</text>
  <text x="92" y="112" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">36</text>
  <text x="170" y="112" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">4.0</text>
  <line x1="268.333" y1="108" x2="561.667" y2="108" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="268.333" y1="103" x2="268.333" y2="113" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="561.667" y1="103" x2="561.667" y2="113" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="412.879" y="105.879" width="4.243" height="4.243" fill="#2f6f9f"/>
  <rect x="640" y="100" width="7.2" height="16" fill="#c2622d" rx="2"/>
  <text x="653.2" y="112" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">2%</text>
  <text x="18" y="144" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">Trial B</text>
  <text x="92" y="144" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">144</text>
  <text x="170" y="144" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">2.0</text>
  <line x1="341.667" y1="140" x2="488.333" y2="140" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="341.667" y1="135" x2="341.667" y2="145" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="488.333" y1="135" x2="488.333" y2="145" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="410.757" y="135.757" width="8.485" height="8.485" fill="#2f6f9f"/>
  <rect x="640" y="132" width="28.8" height="16" fill="#c2622d" rx="2"/>
  <text x="674.8" y="144" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">8%</text>
  <text x="18" y="176" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">Trial C</text>
  <text x="92" y="176" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">144</text>
  <text x="170" y="176" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">2.0</text>
  <line x1="341.667" y1="172" x2="488.333" y2="172" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="341.667" y1="167" x2="341.667" y2="177" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="488.333" y1="167" x2="488.333" y2="177" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="410.757" y="167.757" width="8.485" height="8.485" fill="#2f6f9f"/>
  <rect x="640" y="164" width="28.8" height="16" fill="#c2622d" rx="2"/>
  <text x="674.8" y="176" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">8%</text>
  <text x="18" y="208" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">Trial D</text>
  <text x="92" y="208" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">576</text>
  <text x="170" y="208" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">1.0</text>
  <line x1="378.333" y1="204" x2="451.667" y2="204" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="378.333" y1="199" x2="378.333" y2="209" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="451.667" y1="199" x2="451.667" y2="209" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="406.515" y="195.515" width="16.971" height="16.971" fill="#2f6f9f"/>
  <rect x="640" y="196" width="115.2" height="16" fill="#c2622d" rx="2"/>
  <text x="761.2" y="208" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">32%</text>
  <text x="18" y="240" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">Trial E</text>
  <text x="92" y="240" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">900</text>
  <text x="170" y="240" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">0.8</text>
  <line x1="385.667" y1="236" x2="444.333" y2="236" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="385.667" y1="231" x2="385.667" y2="241" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="444.333" y1="231" x2="444.333" y2="241" stroke="#2f6f9f" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="404.393" y="225.393" width="21.213" height="21.213" fill="#2f6f9f"/>
  <rect x="640" y="228" width="180" height="16" fill="#c2622d" rx="2"/>
  <text x="826" y="240" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">50%</text>
  <line x1="415" y1="92" x2="415" y2="260" stroke="#5b6672" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="4 4"/>
  <text x="18" y="322" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">The weight of a trial is 1 divided by its squared standard error, rescaled so the five weights add to 100%. Four</text>
  <text x="18" y="339" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">times the people gives half the standard error, which gives four times the weight.</text>
  <text x="18" y="372" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="start">Trial E alone holds half of all the weight. Trial A holds one fiftieth of it.</text>
</svg>
