<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" role="img">
  <title>A funnel plot with a corner missing</title>
  <desc>Twelve published trials plotted against their standard error. All the smaller trials sit to the right of the combined estimate and the bottom left of the funnel is empty.</desc>
  <rect x="0" y="0" width="820" height="470" fill="#ffffff"/>
  <text x="410" y="28" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">A funnel plot with a corner missing</text>
  <text x="410" y="50" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">Twelve published trials of a sleep supplement. Each dot is one trial.</text>
  <text x="95" y="76" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">Standard error of the trial (smaller is more precise)</text>
  <rect x="95" y="106" width="540" height="254" fill="none" stroke="#c9d1d9" stroke-width="1.2"/>
  <line x1="95" y1="360" x2="95" y2="364" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="95" y="377" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">-20</text>
  <line x1="195" y1="360" x2="195" y2="364" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="195" y="377" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">-10</text>
  <line x1="295" y1="360" x2="295" y2="364" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="295" y="377" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0</text>
  <line x1="395" y1="360" x2="395" y2="364" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="395" y="377" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">10</text>
  <line x1="495" y1="360" x2="495" y2="364" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="495" y="377" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">20</text>
  <line x1="595" y1="360" x2="595" y2="364" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="595" y="377" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">30</text>
  <line x1="91" y1="106" x2="95" y2="106" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="87" y="109.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0</text>
  <line x1="91" y1="169.5" x2="95" y2="169.5" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="87" y="173.3" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">3</text>
  <line x1="91" y1="233" x2="95" y2="233" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="87" y="236.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">6</text>
  <line x1="91" y1="296.5" x2="95" y2="296.5" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="87" y="300.3" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">9</text>
  <line x1="91" y1="360" x2="95" y2="360" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="87" y="363.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">12</text>
  <text x="365" y="398" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">Estimated extra sleep (minutes per night)</text>
  <polygon points="365,190.667 285,190.667 125,360 365,360" fill="#f3e3d6"/>
  <line x1="365" y1="106" x2="125" y2="360" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="365" y1="106" x2="605" y2="360" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/>
  <line x1="365" y1="106" x2="365" y2="360" stroke="#3f7a52" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 3"/>
  <line x1="295" y1="106" x2="295" y2="360" stroke="#c9d1d9" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="325" cy="148.333" r="5" fill="#2f6f9f"/>
  <circle cx="345" cy="148.333" r="5" fill="#2f6f9f"/>
  <circle cx="365" cy="148.333" r="5" fill="#2f6f9f"/>
  <circle cx="385" cy="211.833" r="5" fill="#2f6f9f"/>
  <circle cx="405" cy="211.833" r="5" fill="#2f6f9f"/>
  <circle cx="425" cy="211.833" r="5" fill="#2f6f9f"/>
  <circle cx="445" cy="211.833" r="5" fill="#2f6f9f"/>
  <circle cx="445" cy="317.667" r="5" fill="#2f6f9f"/>
  <circle cx="475" cy="317.667" r="5" fill="#2f6f9f"/>
  <circle cx="505" cy="317.667" r="5" fill="#2f6f9f"/>
  <circle cx="535" cy="317.667" r="5" fill="#2f6f9f"/>
  <circle cx="565" cy="317.667" r="5" fill="#2f6f9f"/>
  <text x="372" y="100" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3f7a52" text-anchor="start">combined estimate, 7 minutes</text>
  <text x="288" y="100" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="end">no effect</text>
  <text x="265" y="250" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2933" text-anchor="middle">No small trial reporting</text>
  <text x="265" y="264" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2933" text-anchor="middle">little or no benefit was</text>
  <text x="265" y="278" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2933" text-anchor="middle">published.</text>
  <text x="650" y="140" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="start" font-weight="bold">3 large trials</text>
  <text x="650" y="156" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="start">Standard error 2. Their</text>
  <text x="650" y="170" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="start">own average is 5 minutes.</text>
  <text x="650" y="206" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="start" font-weight="bold">4 mid-sized trials</text>
  <text x="650" y="222" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="start">Standard error 5. Every</text>
  <text x="650" y="236" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="start">one of them lands above 7.</text>
  <text x="650" y="300" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="start" font-weight="bold">5 small trials</text>
  <text x="650" y="316" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="start">Standard error 10. Every</text>
  <text x="650" y="330" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="start">one of them lands far</text>
  <text x="650" y="344" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="start">above 7.</text>
  <text x="95" y="424" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">A symmetric funnel is what chance alone produces: small trials scatter widely on both sides of the</text>
  <text x="95" y="441" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">centre. Here they scatter on one side only, which is what you would see if the discouraging small trials</text>
  <text x="95" y="458" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">were never published.</text>
</svg>
