<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" width="640" height="370" role="img" aria-labelledby="title desc">
  <title id="title">Two effect sizes and their lines of no effect</title>
  <desc id="desc">Top: trial A, difference −5.5 mmHg, 95% CI −9.42 to −1.58, lies below 0 (no effect); trial C, −3.5, CI −7.42 to 0.42, crosses 0. Bottom: on a log axis 0.5 and 2 are equally far from 1; fall-prevention trial 1 has RR 0.60, CI 0.27 to 1.31.</desc>
  <rect x="0" y="0" width="640" height="370" fill="#ffffff" stroke="none" stroke-width="1.5"/>
  <text x="20" y="24" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="start" fill="#1c1b19" font-weight="bold">Difference in means: no effect is 0</text>
  <line x1="110" y1="122" x2="520" y2="122" stroke="#1c1b19" stroke-width="1.5"/>
  <line x1="110" y1="122" x2="110" y2="127" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="110" y="141" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">−10</text>
  <line x1="178.33" y1="122" x2="178.33" y2="127" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="178.33" y="141" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">−8</text>
  <line x1="246.67" y1="122" x2="246.67" y2="127" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="246.67" y="141" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">−6</text>
  <line x1="315" y1="122" x2="315" y2="127" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="315" y="141" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">−4</text>
  <line x1="383.33" y1="122" x2="383.33" y2="127" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="383.33" y="141" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">−2</text>
  <line x1="451.67" y1="122" x2="451.67" y2="127" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="451.67" y="141" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">0</text>
  <line x1="520" y1="122" x2="520" y2="127" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="520" y="141" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">2</text>
  <text x="315" y="162" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19">Difference in mean systolic blood pressure (mmHg)</text>
  <line x1="451.67" y1="40" x2="451.67" y2="122" stroke="#1c1b19" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="457.67" y="44" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#3a3935">No effect (0)</text>
  <text x="20" y="72" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="start" fill="#1c1b19">Trial A</text>
  <line x1="129.82" y1="68" x2="397.68" y2="68" stroke="#35566b" stroke-width="2"/>
  <rect x="258.75" y="63" width="10" height="10" fill="#35566b" stroke="none" stroke-width="1.5"/>
  <text x="628" y="72" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">Excludes 0</text>
  <text x="20" y="102" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="start" fill="#1c1b19">Trial C</text>
  <line x1="198.15" y1="98" x2="466.02" y2="98" stroke="#35566b" stroke-width="2"/>
  <rect x="327.08" y="93" width="10" height="10" fill="#35566b" stroke="none" stroke-width="1.5"/>
  <text x="628" y="102" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">Includes 0</text>
  <text x="20" y="200" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="start" fill="#1c1b19" font-weight="bold">Risk ratio: no effect is 1, on a logarithmic axis</text>
  <line x1="110" y1="305" x2="520" y2="305" stroke="#1c1b19" stroke-width="1.5"/>
  <line x1="110" y1="305" x2="110" y2="310" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="110" y="324" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">0.25</text>
  <line x1="212.5" y1="305" x2="212.5" y2="310" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="212.5" y="324" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">0.5</text>
  <line x1="315" y1="305" x2="315" y2="310" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="315" y="324" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">1</text>
  <line x1="417.5" y1="305" x2="417.5" y2="310" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="417.5" y="324" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">2</text>
  <line x1="520" y1="305" x2="520" y2="310" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="520" y="324" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">4</text>
  <text x="315" y="345" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19">Risk ratio, program vs usual care (log scale)</text>
  <line x1="315" y1="216" x2="315" y2="305" stroke="#1c1b19" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="321" y="262" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#3a3935">No effect (1)</text>
  <line x1="315" y1="232" x2="212.5" y2="232" stroke="#4d6b3c" stroke-width="2"/>
  <line x1="212.5" y1="226" x2="212.5" y2="238" stroke="#4d6b3c" stroke-width="2"/>
  <text x="263.75" y="224" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#4d6b3c">Risk halved (0.5)</text>
  <line x1="315" y1="232" x2="417.5" y2="232" stroke="#4d6b3c" stroke-width="2"/>
  <line x1="417.5" y1="226" x2="417.5" y2="238" stroke="#4d6b3c" stroke-width="2"/>
  <text x="366.25" y="224" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#4d6b3c">Risk doubled (2)</text>
  <text x="628" y="236" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">Same distance</text>
  <text x="20" y="276" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="start" fill="#1c1b19">Fall trial 1</text>
  <line x1="123.5" y1="272" x2="355.37" y2="272" stroke="#35566b" stroke-width="2"/>
  <rect x="234.44" y="267" width="10" height="10" fill="#35566b" stroke="none" stroke-width="1.5"/>
  <text x="628" y="276" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">0.60 (0.27 to 1.31)</text>
</svg>
