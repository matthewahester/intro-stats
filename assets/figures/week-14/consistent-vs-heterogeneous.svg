  <line x1="68" y1="268" x2="302" y2="268" stroke="#1c1b19" stroke-width="1.5"/>
  <line x1="89.27" y1="268" x2="89.27" y2="273" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="89.27" y="286" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">−12</text>
  <line x1="131.82" y1="268" x2="131.82" y2="273" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="131.82" y="286" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">−8</text>
  <line x1="174.36" y1="268" x2="174.36" y2="273" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="174.36" y="286" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">−4</text>
  <line x1="216.91" y1="268" x2="216.91" y2="273" stroke="#1c1b19" stroke-width="1.5"/>
