  <line x1="302" y1="268" x2="302" y2="273" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="302" y="286" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">8</text>
  <text x="185" y="306" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">Difference in means (mmHg)</text>
  <text x="16" y="336" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19">Fixed effect: −3.9 (−5.2 to −2.7)</text>
  <text x="16" y="356" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19">Random effects: −3.9 (−5.2 to −2.7)</text>
  <text x="336" y="24" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="start" fill="#1c1b19" font-weight="bold">Heterogeneous studies</text>
  <text x="336" y="42" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#3a3935">I² = 85%</text>
  <line x1="536.91" y1="52" x2="536.91" y2="262" stroke="#1c1b19" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="336" y="70" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19">Study 1</text>
