  <line x1="415.44" y1="122" x2="498.83" y2="122" stroke="#1c1b19" stroke-width="1.4"/>
  <rect x="453.64" y="118.5" width="7" height="7" fill="#35566b" stroke="none" stroke-width="1.5"/>
  <text x="336" y="154" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19">Study 4</text>
  <line x1="485.3" y1="150" x2="535.33" y2="150" stroke="#1c1b19" stroke-width="1.4"/>
  <rect x="504.48" y="144.17" width="11.67" height="11.67" fill="#35566b" stroke="none" stroke-width="1.5"/>
  <text x="336" y="182" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19">Study 5</text>
  <line x1="506.06" y1="178" x2="610.3" y2="178" stroke="#1c1b19" stroke-width="1.4"/>
  <rect x="555.38" y="175.2" width="5.6" height="5.6" fill="#35566b" stroke="none" stroke-width="1.5"/>
  <text x="336" y="216" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19" font-weight="bold">Fixed</text>
  <polygon points="482.07,212 495.12,204 508.18,212 495.12,220" fill="#e9cdbd" stroke="#8a4a2b" stroke-width="1.5"/>
  <text x="336" y="246" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19" font-weight="bold">Random</text>
  <polygon points="457.13,242 492.82,234 528.5,242 492.82,250" fill="#d3e0c8" stroke="#4d6b3c" stroke-width="1.5"/>
  <line x1="388" y1="268" x2="622" y2="268" stroke="#1c1b19" stroke-width="1.5"/>
  <line x1="409.27" y1="268" x2="409.27" y2="273" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="409.27" y="286" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">−12</text>
  <line x1="451.82" y1="268" x2="451.82" y2="273" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="451.82" y="286" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">−8</text>
  <line x1="494.36" y1="268" x2="494.36" y2="273" stroke="#1c1b19" stroke-width="1.5"/>
