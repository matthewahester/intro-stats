  <line x1="622" y1="268" x2="622" y2="273" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="622" y="286" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">8</text>
  <text x="505" y="306" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">Difference in means (mmHg)</text>
  <text x="336" y="336" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19">Fixed effect: −3.9 (−5.2 to −2.7)</text>
  <text x="336" y="356" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19">Random effects: −4.1 (−7.5 to −0.8)</text>
  <line x1="320" y1="14" x2="320" y2="360" stroke="#d8d6d0" stroke-width="1"/>
  <text x="16" y="388" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#3a3935">Squares are sized by fixed-effect weight. Both panels use the same five standard errors.</text>
</svg>
