  <line x1="433.33" y1="330" x2="433.33" y2="335" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="433.33" y="349" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">40</text>
