  <text x="20" y="26" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="start" fill="#1c1b19" font-weight="600">Tree canopy and afternoon temperature</text>
  <text x="20" y="44" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#3a3935">Five hypothetical neighborhoods; each quadrant is labeled with the sign of z(canopy) × z(temperature)</text>
  <line x1="80" y1="330" x2="610" y2="330" stroke="#1c1b19" stroke-width="1.5"/>
