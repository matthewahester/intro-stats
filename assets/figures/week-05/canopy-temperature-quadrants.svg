<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Tree canopy and afternoon temperature in five hypothetical neighborhoods, split at the means</title>
  <desc id="desc">Scatterplot of neighborhoods A to E with dashed lines at the mean canopy, 30 percent, and mean temperature, 33 °C. A and B sit upper left and E lower right, where products are negative; C and D sit on a mean line and add zero. r = −0.92.</desc>
