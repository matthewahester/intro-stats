  <text x="443.33" y="174.73" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19" font-weight="600">D (40%, 33 °C)</text>
  <circle cx="521.67" cy="280.91" r="6.5" fill="#1c1b19" stroke="#ffffff" stroke-width="1"/>
  <text x="531.67" y="272.91" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19" font-weight="600">E (50%, 29 °C)</text>
  <text x="592.33" y="231.82" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="end" fill="#1c1b19" font-weight="600">r = −0.92</text>
