<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Daily electricity use and outdoor temperature for a hypothetical household</title>
  <desc id="desc">Scatterplot of daily electricity use against average outdoor temperature on 19 days. Use is lowest, about 20 kWh, near 60 °F and rises to about 45 kWh at both 24 °F and 96 °F, a U shape. r = 0.00.</desc>
