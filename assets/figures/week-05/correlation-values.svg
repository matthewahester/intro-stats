  <title>Three scatterplots labelled with their correlations</title>
  <desc>Three clouds of twenty cases each, labelled with correlations of about 0.30, 0.70 and -0.90: the cloud tightens around a straight line as the size of the correlation grows, and the last one slopes downward.</desc>
