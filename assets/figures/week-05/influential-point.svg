  <line x1="780" y1="340" x2="780" y2="344" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="780" y="357" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">240</text>
  <line x1="446" y1="340" x2="450" y2="340" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="442" y="343.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0</text>
  <line x1="446" y1="263.333" x2="450" y2="263.333" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="442" y="267.133" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">30</text>
  <line x1="446" y1="186.667" x2="450" y2="186.667" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="442" y="190.467" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">60</text>
  <line x1="446" y1="110" x2="450" y2="110" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="442" y="113.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">90</text>
  <text x="615" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">screen minutes before bed</text>
  <text x="615" y="78" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">That one student set aside</text>
  <text x="450" y="98" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">minutes to fall asleep</text>
  <circle cx="477.5" cy="276.111" r="4" fill="#2f6f9f"/>
