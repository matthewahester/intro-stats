<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 425" width="840" height="425" role="img">
  <title>One far-out case, kept and then set aside</title>
  <desc>Two scatterplots on the same axes. With the student at 220 screen minutes included the fitted line climbs steeply and the correlation is about 0.96; with that student set aside the line is nearly flat and the correlation falls to about 0.23.</desc>
