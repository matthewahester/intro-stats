  <line x1="390" y1="340" x2="390" y2="344" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="390" y="357" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">240</text>
  <line x1="56" y1="340" x2="60" y2="340" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="52" y="343.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0</text>
  <line x1="56" y1="263.333" x2="60" y2="263.333" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="52" y="267.133" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">30</text>
  <line x1="56" y1="186.667" x2="60" y2="186.667" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
