  <text x="420" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">How much can one case move a correlation</text>
  <text x="420" y="46" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">the same six students in both panels, plus one more on the left</text>
  <rect x="60" y="110" width="330" height="230" fill="none" stroke="#c9d1d9" stroke-width="1.2"/>
  <line x1="60" y1="340" x2="390" y2="340" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
