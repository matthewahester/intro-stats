  <text x="142.5" y="357" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">60</text>
  <line x1="225" y1="340" x2="225" y2="344" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="225" y="357" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">120</text>
  <line x1="307.5" y1="340" x2="307.5" y2="344" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
