  <line x1="56" y1="110" x2="60" y2="110" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="52" y="113.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">90</text>
  <text x="225" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">screen minutes before bed</text>
  <text x="225" y="78" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">All seven students</text>
  <text x="60" y="98" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">minutes to fall asleep</text>
