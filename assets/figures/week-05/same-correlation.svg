  <line x1="446" y1="340" x2="450" y2="340" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="442" y="343.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0</text>
  <line x1="446" y1="229.423" x2="450" y2="229.423" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="442" y="233.223" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">25</text>
  <line x1="446" y1="118.846" x2="450" y2="118.846" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="442" y="122.646" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">50</text>
  <text x="615" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">explanatory variable</text>
  <text x="615" y="78" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">A flat cluster plus one case</text>
  <text x="450" y="98" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">response variable</text>
