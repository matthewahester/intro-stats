<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 425" width="840" height="425" role="img">
  <title>Two different pictures with the same correlation</title>
  <desc>Two scatterplots, both labelled with a correlation of about 0.80. The left panel is an even upward-slanting cloud; the right panel is a flat cluster plus one far-out case that produces the whole correlation by itself.</desc>
  <rect x="0" y="0" width="840" height="425" fill="#ffffff"/>
  <text x="420" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">The same correlation, two different stories</text>
  <text x="420" y="46" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">why the number never travels without its picture</text>
  <rect x="60" y="110" width="330" height="230" fill="none" stroke="#c9d1d9" stroke-width="1.2"/>
  <line x1="60" y1="340" x2="390" y2="340" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="60" y1="229.423" x2="390" y2="229.423" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="60" y1="118.846" x2="390" y2="118.846" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="60" y1="340" x2="60" y2="344" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="60" y="357" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0</text>
  <line x1="146.842" y1="340" x2="146.842" y2="344" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="146.842" y="357" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">10</text>
  <line x1="233.684" y1="340" x2="233.684" y2="344" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="233.684" y="357" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">20</text>
  <line x1="320.526" y1="340" x2="320.526" y2="344" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="320.526" y="357" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">30</text>
  <line x1="56" y1="340" x2="60" y2="340" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="52" y="343.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0</text>
  <line x1="56" y1="229.423" x2="60" y2="229.423" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="52" y="233.223" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">25</text>
  <line x1="56" y1="118.846" x2="60" y2="118.846" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="52" y="122.646" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">50</text>
  <text x="225" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">explanatory variable</text>
  <text x="225" y="78" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">An even upward drift</text>
  <text x="60" y="98" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">response variable</text>
