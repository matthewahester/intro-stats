<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Who responded to a voluntary online poll, compared with the whole town</title>
  <desc id="desc">Two stacked bars. In a hypothetical town of 10,000 adults, 50% support a park tax. Only 5% of supporters and 15% of opponents responded, so of the 1,000 respondents 25% support the tax and 75% oppose it.</desc>
  <rect x="0" y="0" width="640" height="300" fill="#ffffff" stroke="none" stroke-width="1.5"/>
  <text x="20" y="62" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="start" fill="#1c1b19" font-weight="600">Everyone in the town</text>
  <text x="20" y="80" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#3a3935">10,000 adults</text>
  <rect x="250" y="40" width="180" height="54" fill="#8a4a2b" stroke="#1c1b19" stroke-width="1"/>
  <rect x="430" y="40" width="180" height="54" fill="#c9d8e1" stroke="#1c1b19" stroke-width="1"/>
  <text x="340" y="63" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="600">Support 50%</text>
  <text x="340" y="81" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#ffffff">5,000 people</text>
  <text x="520" y="63" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19" font-weight="600">Oppose 50%</text>
  <text x="520" y="81" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">5,000 people</text>
  <text x="20" y="172" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="start" fill="#1c1b19" font-weight="600">People who responded</text>
  <text x="20" y="190" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#3a3935">to the poll: 1,000 adults</text>
  <rect x="250" y="150" width="90" height="54" fill="#8a4a2b" stroke="#1c1b19" stroke-width="1"/>
  <rect x="340" y="150" width="270" height="54" fill="#c9d8e1" stroke="#1c1b19" stroke-width="1"/>
  <text x="295" y="173" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="600">25%</text>
  <text x="295" y="191" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#ffffff">250</text>
  <text x="475" y="173" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19" font-weight="600">Oppose 75%</text>
  <text x="475" y="191" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">750 people</text>
  <text x="20" y="124" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#3a3935" font-style="italic">Who chose to respond</text>
  <text x="332" y="117" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#3a3935">5% of supporters</text>
  <text x="332" y="133" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#3a3935">responded (250)</text>
  <text x="512" y="117" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#3a3935">15% of opponents</text>
  <text x="512" y="133" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#3a3935">responded (750)</text>
  <line x1="322" y1="98" x2="322" y2="138" stroke="#3a3935" stroke-width="1.5"/>
  <polygon points="322,146 318,138 326,138" fill="#3a3935" stroke="none" stroke-width="1"/>
  <line x1="502" y1="98" x2="502" y2="138" stroke="#3a3935" stroke-width="1.5"/>
  <polygon points="502,146 498,138 506,138" fill="#3a3935" stroke="none" stroke-width="1"/>
  <line x1="250" y1="222" x2="610" y2="222" stroke="#1c1b19" stroke-width="1.5"/>
  <line x1="250" y1="222" x2="250" y2="227" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="250" y="241" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">0%</text>
  <line x1="322" y1="222" x2="322" y2="227" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="322" y="241" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">20%</text>
  <line x1="394" y1="222" x2="394" y2="227" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="394" y="241" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">40%</text>
  <line x1="466" y1="222" x2="466" y2="227" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="466" y="241" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">60%</text>
  <line x1="538" y1="222" x2="538" y2="227" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="538" y="241" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">80%</text>
  <line x1="610" y1="222" x2="610" y2="227" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="610" y="241" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">100%</text>
  <text x="430" y="264" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19">Percent of the group</text>
</svg>
