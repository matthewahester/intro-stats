<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 372" width="860" height="372" role="img">
  <title>Baseline balance after random assignment</title>
  <desc>Four background characteristics measured before the program started. The coaching and control percentages sit almost on top of each other in every row.</desc>
  <rect x="0" y="0" width="860" height="372" fill="#ffffff"/>
  <text x="430" y="30" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">What the coin did before anything else happened</text>
  <line x1="350" y1="252" x2="350" y2="256" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="350" y="269" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0</text>
  <line x1="398.571" y1="252" x2="398.571" y2="256" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="398.571" y="269" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">10</text>
  <line x1="447.143" y1="252" x2="447.143" y2="256" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="447.143" y="269" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">20</text>
  <line x1="495.714" y1="252" x2="495.714" y2="256" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="495.714" y="269" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">30</text>
  <line x1="544.286" y1="252" x2="544.286" y2="256" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="544.286" y="269" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">40</text>
  <line x1="592.857" y1="252" x2="592.857" y2="256" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="592.857" y="269" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">50</text>
  <line x1="641.429" y1="252" x2="641.429" y2="256" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="641.429" y="269" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">60</text>
  <line x1="690" y1="252" x2="690" y2="256" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="690" y="269" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">70</text>
  <text x="520" y="290" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">Percent of the group</text>
  <line x1="350" y1="76" x2="350" y2="252" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="398.571" y1="76" x2="398.571" y2="252" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="447.143" y1="76" x2="447.143" y2="252" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="495.714" y1="76" x2="495.714" y2="252" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="544.286" y1="76" x2="544.286" y2="252" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="592.857" y1="76" x2="592.857" y2="252" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="641.429" y1="76" x2="641.429" y2="252" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="690" y1="76" x2="690" y2="252" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <text x="745" y="66" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2f6f9f" text-anchor="middle" font-weight="bold">Coaching</text>
  <text x="818" y="66" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="middle" font-weight="bold">Control</text>
  <rect x="350" y="76" width="340" height="44" fill="#eef2f6" fill-opacity="0.55"/>
  <text x="340" y="102.2" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end">Works 20 or more hours a week</text>
  <line x1="520" y1="98" x2="529.714" y2="98" stroke="#5b6672" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="529.714" cy="98" r="6" fill="#2f6f9f"/>
  <circle cx="520" cy="98" r="6" fill="#c2622d"/>
  <text x="745" y="102.2" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle">37 percent</text>
  <text x="818" y="102.2" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle">35 percent</text>
  <text x="340" y="146.2" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end">First in the family at college</text>
  <line x1="500.571" y1="142" x2="510.286" y2="142" stroke="#5b6672" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="500.571" cy="142" r="6" fill="#2f6f9f"/>
  <circle cx="510.286" cy="142" r="6" fill="#c2622d"/>
  <text x="745" y="146.2" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle">31 percent</text>
  <text x="818" y="146.2" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle">33 percent</text>
  <rect x="350" y="164" width="340" height="44" fill="#eef2f6" fill-opacity="0.55"/>
  <text x="340" y="190.2" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end">Lives on campus</text>
  <line x1="612.286" y1="186" x2="626.857" y2="186" stroke="#5b6672" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="612.286" cy="186" r="6" fill="#2f6f9f"/>
  <circle cx="626.857" cy="186" r="6" fill="#c2622d"/>
  <text x="745" y="190.2" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle">54 percent</text>
  <text x="818" y="190.2" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle">57 percent</text>
  <text x="340" y="234.2" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end">Sleeps under six hours a night</text>
  <line x1="563.714" y1="230" x2="573.429" y2="230" stroke="#5b6672" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="573.429" cy="230" r="6" fill="#2f6f9f"/>
  <circle cx="563.714" cy="230" r="6" fill="#c2622d"/>
  <text x="745" y="234.2" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle">46 percent</text>
  <text x="818" y="234.2" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle">44 percent</text>
  <circle cx="300" cy="312" r="6" fill="#2f6f9f"/>
  <text x="312" y="316" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Coaching group, 200 students</text>
  <circle cx="540" cy="312" r="6" fill="#c2622d"/>
  <text x="552" y="316" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Wait-list control, 200 students</text>
  <text x="430" y="350" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">No gap is bigger than three percentage points, and chance assignment treats unmeasured variables the same way.</text>
</svg>
