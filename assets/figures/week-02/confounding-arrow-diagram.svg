<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="title desc">
  <title id="title">A possible confounder behind the association between breakfast and body weight</title>
  <desc id="desc">Arrow diagram. A possible confounder, exercise and a steady daily routine, points to both eating breakfast every day (explanatory variable) and body weight (response variable); a dashed line marks the observed association.</desc>
  <rect x="0" y="0" width="640" height="340" fill="#ffffff" stroke="none" stroke-width="1.5"/>
  <rect x="220" y="24" width="200" height="78" fill="#e9cdbd" stroke="#8a4a2b" stroke-width="2" rx="8"/>
  <text x="320" y="48" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#8a4a2b" font-weight="600">POSSIBLE CONFOUNDER</text>
  <text x="320" y="68" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19">Exercise and a steady</text>
  <text x="320" y="85" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19">daily routine</text>
  <rect x="24" y="196" width="200" height="78" fill="#c9d8e1" stroke="#35566b" stroke-width="2" rx="8"/>
  <text x="124" y="220" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#35566b" font-weight="600">EXPLANATORY VARIABLE</text>
  <text x="124" y="240" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19">Eats breakfast</text>
  <text x="124" y="257" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19">every day</text>
  <rect x="416" y="196" width="200" height="78" fill="#c9d8e1" stroke="#35566b" stroke-width="2" rx="8"/>
  <text x="516" y="220" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#35566b" font-weight="600">RESPONSE VARIABLE</text>
  <text x="516" y="240" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19">Body weight</text>
  <line x1="262" y1="104" x2="177.23" y2="185.09" stroke="#8a4a2b" stroke-width="2.2"/>
  <polygon points="170,192 173.77,181.47 180.68,188.7" fill="#8a4a2b" stroke="none" stroke-width="1"/>
  <line x1="378" y1="104" x2="462.77" y2="185.09" stroke="#8a4a2b" stroke-width="2.2"/>
  <polygon points="470,192 459.32,188.7 466.23,181.47" fill="#8a4a2b" stroke="none" stroke-width="1"/>
  <text x="200" y="136" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#1c1b19">makes breakfast</text>
  <text x="200" y="152" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#1c1b19">more likely</text>
  <text x="440" y="136" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19">also affects</text>
  <text x="440" y="152" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19">body weight</text>
  <line x1="232" y1="235" x2="408" y2="235" stroke="#1c1b19" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="320" y="225" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">observed association</text>
  <text x="320" y="300" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">The dashed line is what the data show. The question is how much of it comes from</text>
  <text x="320" y="318" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">breakfast itself and how much from the confounder acting on both variables.</text>
</svg>
