<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Random assignment of 20 volunteers into a treatment group and a control group</title>
  <desc id="desc">Twenty hypothetical volunteers, 8 of whom exercise regularly, are split by chance into two groups of 10. The treatment group gets 5 regular exercisers and the control group gets 3; the response is then measured and compared.</desc>
  <rect x="0" y="0" width="640" height="400" fill="#ffffff" stroke="none" stroke-width="1.5"/>
  <text x="100" y="90" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#1c1b19" font-weight="600">20 volunteers</text>
  <circle cx="55" cy="120" r="9" fill="#ffffff" stroke="#1c1b19" stroke-width="1.6"/>
  <circle cx="85" cy="120" r="9" fill="#ffffff" stroke="#1c1b19" stroke-width="1.6"/>
  <circle cx="115" cy="120" r="9" fill="#1c1b19" stroke="none" stroke-width="1"/>
  <circle cx="145" cy="120" r="9" fill="#ffffff" stroke="#1c1b19" stroke-width="1.6"/>
  <circle cx="55" cy="150" r="9" fill="#ffffff" stroke="#1c1b19" stroke-width="1.6"/>
  <circle cx="85" cy="150" r="9" fill="#ffffff" stroke="#1c1b19" stroke-width="1.6"/>
  <circle cx="115" cy="150" r="9" fill="#1c1b19" stroke="none" stroke-width="1"/>
  <circle cx="145" cy="150" r="9" fill="#ffffff" stroke="#1c1b19" stroke-width="1.6"/>
  <circle cx="55" cy="180" r="9" fill="#1c1b19" stroke="none" stroke-width="1"/>
  <circle cx="85" cy="180" r="9" fill="#1c1b19" stroke="none" stroke-width="1"/>
  <circle cx="115" cy="180" r="9" fill="#1c1b19" stroke="none" stroke-width="1"/>
  <circle cx="145" cy="180" r="9" fill="#1c1b19" stroke="none" stroke-width="1"/>
  <circle cx="55" cy="210" r="9" fill="#1c1b19" stroke="none" stroke-width="1"/>
  <circle cx="85" cy="210" r="9" fill="#ffffff" stroke="#1c1b19" stroke-width="1.6"/>
  <circle cx="115" cy="210" r="9" fill="#ffffff" stroke="#1c1b19" stroke-width="1.6"/>
  <circle cx="145" cy="210" r="9" fill="#ffffff" stroke="#1c1b19" stroke-width="1.6"/>
  <circle cx="55" cy="240" r="9" fill="#ffffff" stroke="#1c1b19" stroke-width="1.6"/>
  <circle cx="85" cy="240" r="9" fill="#1c1b19" stroke="none" stroke-width="1"/>
  <circle cx="115" cy="240" r="9" fill="#ffffff" stroke="#1c1b19" stroke-width="1.6"/>
  <circle cx="145" cy="240" r="9" fill="#ffffff" stroke="#1c1b19" stroke-width="1.6"/>
  <line x1="172" y1="180" x2="277.68" y2="109.55" stroke="#1c1b19" stroke-width="2"/>
  <polygon points="286,104 280.45,113.71 274.91,105.39" fill="#1c1b19" stroke="none" stroke-width="1"/>
  <line x1="172" y1="200" x2="277.68" y2="270.45" stroke="#1c1b19" stroke-width="2"/>
  <polygon points="286,276 274.91,274.61 280.45,266.29" fill="#1c1b19" stroke="none" stroke-width="1"/>
  <text x="214" y="184" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19" font-weight="600">random</text>
  <text x="214" y="200" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19" font-weight="600">assignment</text>
  <rect x="292" y="36" width="196" height="144" fill="#e9cdbd" stroke="#8a4a2b" stroke-width="2" rx="8"/>
  <text x="390" y="58" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#8a4a2b" font-weight="600">Treatment group (n = 10)</text>
  <text x="390" y="76" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">gets the new program</text>
  <circle cx="330" cy="102" r="9" fill="#1c1b19" stroke="none" stroke-width="1"/>
  <circle cx="360" cy="102" r="9" fill="#1c1b19" stroke="none" stroke-width="1"/>
  <circle cx="390" cy="102" r="9" fill="#1c1b19" stroke="none" stroke-width="1"/>
  <circle cx="420" cy="102" r="9" fill="#1c1b19" stroke="none" stroke-width="1"/>
  <circle cx="450" cy="102" r="9" fill="#1c1b19" stroke="none" stroke-width="1"/>
  <circle cx="330" cy="132" r="9" fill="#ffffff" stroke="#1c1b19" stroke-width="1.6"/>
  <circle cx="360" cy="132" r="9" fill="#ffffff" stroke="#1c1b19" stroke-width="1.6"/>
  <circle cx="390" cy="132" r="9" fill="#ffffff" stroke="#1c1b19" stroke-width="1.6"/>
  <circle cx="420" cy="132" r="9" fill="#ffffff" stroke="#1c1b19" stroke-width="1.6"/>
  <circle cx="450" cy="132" r="9" fill="#ffffff" stroke="#1c1b19" stroke-width="1.6"/>
  <text x="390" y="168" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">5 of 10 exercise regularly</text>
  <rect x="292" y="212" width="196" height="144" fill="#c9d8e1" stroke="#35566b" stroke-width="2" rx="8"/>
  <text x="390" y="234" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#35566b" font-weight="600">Control group (n = 10)</text>
  <text x="390" y="252" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">keeps usual care</text>
  <circle cx="330" cy="278" r="9" fill="#1c1b19" stroke="none" stroke-width="1"/>
  <circle cx="360" cy="278" r="9" fill="#1c1b19" stroke="none" stroke-width="1"/>
  <circle cx="390" cy="278" r="9" fill="#1c1b19" stroke="none" stroke-width="1"/>
  <circle cx="420" cy="278" r="9" fill="#ffffff" stroke="#1c1b19" stroke-width="1.6"/>
  <circle cx="450" cy="278" r="9" fill="#ffffff" stroke="#1c1b19" stroke-width="1.6"/>
  <circle cx="330" cy="308" r="9" fill="#ffffff" stroke="#1c1b19" stroke-width="1.6"/>
  <circle cx="360" cy="308" r="9" fill="#ffffff" stroke="#1c1b19" stroke-width="1.6"/>
  <circle cx="390" cy="308" r="9" fill="#ffffff" stroke="#1c1b19" stroke-width="1.6"/>
  <circle cx="420" cy="308" r="9" fill="#ffffff" stroke="#1c1b19" stroke-width="1.6"/>
  <circle cx="450" cy="308" r="9" fill="#ffffff" stroke="#1c1b19" stroke-width="1.6"/>
  <text x="390" y="344" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">3 of 10 exercise regularly</text>
  <line x1="490" y1="108" x2="533.72" y2="162.22" stroke="#1c1b19" stroke-width="1.8"/>
  <polygon points="540,170 529.83,165.35 537.61,159.08" fill="#1c1b19" stroke="none" stroke-width="1"/>
  <line x1="490" y1="284" x2="533.72" y2="229.78" stroke="#1c1b19" stroke-width="1.8"/>
  <polygon points="540,222 537.61,232.92 529.83,226.65" fill="#1c1b19" stroke="none" stroke-width="1"/>
  <rect x="528" y="172" width="104" height="48" fill="#ffffff" stroke="#1c1b19" stroke-width="1.5" rx="6"/>
  <text x="580" y="192" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">Measure the</text>
  <text x="580" y="208" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">response</text>
  <text x="580" y="250" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">then compare</text>
  <text x="580" y="266" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">the two groups</text>
  <circle cx="44" cy="300" r="6" fill="#1c1b19" stroke="none" stroke-width="1"/>
  <text x="56" y="304" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19">exercises regularly (8)</text>
  <circle cx="44" cy="324" r="6" fill="#ffffff" stroke="#1c1b19" stroke-width="1.6"/>
  <text x="56" y="328" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19">does not (12)</text>
  <text x="320" y="386" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">Chance, not the researcher, decides who goes where, so traits like fitness tend to balance out.</text>
</svg>
