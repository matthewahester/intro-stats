<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Natural-frequency tree for 10,000 people screened for a condition with 1% prevalence</title>
  <desc id="desc">Tree diagram. 10,000 people split into 100 with the condition and 9,900 without. Of the 100, 90 test positive and 10 negative. Of the 9,900, 495 test positive and 9,405 negative. 90 of the 585 positives, about 15%, have it.</desc>
  <rect x="0" y="0" width="640" height="400" fill="#ffffff" stroke="none" stroke-width="1.5"/>
  <line x1="320" y1="58" x2="170" y2="112" stroke="#3a3935" stroke-width="1.5"/>
  <line x1="320" y1="58" x2="470" y2="112" stroke="#3a3935" stroke-width="1.5"/>
  <line x1="170" y1="156" x2="90" y2="218" stroke="#8a4a2b" stroke-width="1.5"/>
  <line x1="170" y1="156" x2="245" y2="218" stroke="#8a4a2b" stroke-width="1.5"/>
  <line x1="470" y1="156" x2="395" y2="218" stroke="#35566b" stroke-width="1.5"/>
  <line x1="470" y1="156" x2="550" y2="218" stroke="#35566b" stroke-width="1.5"/>
  <text x="205" y="80" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#1c1b19">1% have it</text>
  <text x="205" y="95" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">(prevalence)</text>
  <text x="408" y="80" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19">99% do not</text>
  <text x="112" y="176" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#8a4a2b">90% test positive</text>
  <text x="112" y="191" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">(sensitivity)</text>
  <text x="206" y="176" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#8a4a2b">10% test negative</text>
  <text x="434" y="176" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#35566b">5% test positive</text>
  <text x="528" y="176" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#35566b">95% test negative</text>
  <text x="528" y="191" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#3a3935">(specificity)</text>
  <rect x="258" y="14" width="124" height="44" fill="#ffffff" stroke="#1c1b19" stroke-width="1.5" rx="6"/>
  <text x="320" y="33" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#1c1b19" font-weight="bold">10,000</text>
  <text x="320" y="50" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">people screened</text>
  <rect x="108" y="112" width="124" height="44" fill="#ffffff" stroke="#8a4a2b" stroke-width="1.5" rx="6"/>
  <text x="170" y="131" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#1c1b19" font-weight="bold">100</text>
  <text x="170" y="148" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">have the condition</text>
  <rect x="408" y="112" width="124" height="44" fill="#ffffff" stroke="#35566b" stroke-width="1.5" rx="6"/>
  <text x="470" y="131" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#1c1b19" font-weight="bold">9,900</text>
  <text x="470" y="148" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">do not have it</text>
  <rect x="28" y="218" width="124" height="44" fill="#e9cdbd" stroke="#8a4a2b" stroke-width="2.5" rx="6"/>
  <text x="90" y="237" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#1c1b19" font-weight="bold">90</text>
  <text x="90" y="254" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">test positive</text>
  <rect x="183" y="218" width="124" height="44" fill="#ffffff" stroke="#8a4a2b" stroke-width="1.5" rx="6"/>
  <text x="245" y="237" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#1c1b19" font-weight="bold">10</text>
  <text x="245" y="254" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">test negative</text>
  <rect x="333" y="218" width="124" height="44" fill="#c9d8e1" stroke="#35566b" stroke-width="2.5" rx="6"/>
  <text x="395" y="237" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#1c1b19" font-weight="bold">495</text>
  <text x="395" y="254" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">test positive</text>
  <rect x="488" y="218" width="124" height="44" fill="#ffffff" stroke="#35566b" stroke-width="1.5" rx="6"/>
  <text x="550" y="237" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#1c1b19" font-weight="bold">9,405</text>
  <text x="550" y="254" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">test negative</text>
  <text x="90" y="280" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#8a4a2b" font-style="italic">true positives</text>
  <text x="245" y="280" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#8a4a2b" font-style="italic">false negatives</text>
  <text x="395" y="280" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#35566b" font-style="italic">false positives</text>
  <text x="550" y="280" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#35566b" font-style="italic">true negatives</text>
  <polyline points="90,290 90,312 395,312 395,290" fill="none" stroke="#1c1b19" stroke-width="1.5"/>
  <line x1="242" y1="312" x2="242" y2="324" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="320" y="344" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19" font-weight="bold">Everyone who tests positive: 90 + 495 = 585 people</text>
  <text x="320" y="366" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19">Share of positives who have the condition: 90 ÷ 585 ≈ 0.154, about 15%</text>
  <text x="320" y="388" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">Hypothetical test: sensitivity 90%, specificity 95%</text>
</svg>
