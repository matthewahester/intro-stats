<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" width="640" height="390" role="img" aria-labelledby="title desc">
  <title id="title">The same two-way table conditioned two ways: illness given flu-shot status, and flu-shot status given illness</title>
  <desc id="desc">Two bar panels from a hypothetical survey of 800 adults. Left: 10% of the flu-shot group (48 of 480) and 20% of the no-shot group (64 of 320) were ill. Right: of the 112 ill, 43% had a flu shot and 57% did not.</desc>
  <rect x="0" y="0" width="640" height="390" fill="#ffffff" stroke="none" stroke-width="1.5"/>
  <line x1="80" y1="310" x2="300" y2="310" stroke="#1c1b19" stroke-width="1.5"/>
  <line x1="80" y1="310" x2="80" y2="90" stroke="#1c1b19" stroke-width="1.5"/>
  <line x1="75" y1="310" x2="80" y2="310" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="72" y="314" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">0%</text>
  <line x1="80" y1="310" x2="300" y2="310" stroke="#d8d6d0" stroke-width="1"/>
  <line x1="75" y1="266" x2="80" y2="266" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="72" y="270" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">20%</text>
  <line x1="80" y1="266" x2="300" y2="266" stroke="#d8d6d0" stroke-width="1"/>
  <line x1="75" y1="222" x2="80" y2="222" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="72" y="226" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">40%</text>
  <line x1="80" y1="222" x2="300" y2="222" stroke="#d8d6d0" stroke-width="1"/>
  <line x1="75" y1="178" x2="80" y2="178" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="72" y="182" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">60%</text>
  <line x1="80" y1="178" x2="300" y2="178" stroke="#d8d6d0" stroke-width="1"/>
  <line x1="75" y1="134" x2="80" y2="134" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="72" y="138" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">80%</text>
  <line x1="80" y1="134" x2="300" y2="134" stroke="#d8d6d0" stroke-width="1"/>
  <line x1="75" y1="90" x2="80" y2="90" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="72" y="94" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">100%</text>
  <line x1="80" y1="90" x2="300" y2="90" stroke="#d8d6d0" stroke-width="1"/>
  <text x="34" y="200" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19" transform="rotate(-90 34 200)">Percent</text>
  <text x="190" y="30" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19" font-weight="bold">Within each flu-shot group:</text>
  <text x="190" y="48" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19" font-weight="bold">percent who were ill</text>
  <text x="190" y="66" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935" font-style="italic">P(ill | group)</text>
  <rect x="103" y="288" width="64" height="22" fill="#e9cdbd" stroke="#8a4a2b" stroke-width="1.5"/>
  <text x="135" y="266" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#8a4a2b" font-weight="bold">10%</text>
  <text x="135" y="281" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">48 of 480</text>
  <text x="135" y="330" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19">Flu shot</text>
  <rect x="213" y="266" width="64" height="44" fill="#c9d8e1" stroke="#35566b" stroke-width="1.5"/>
  <text x="245" y="244" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#35566b" font-weight="bold">20%</text>
  <text x="245" y="259" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">64 of 320</text>
  <text x="245" y="330" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19">No flu shot</text>
  <line x1="400" y1="310" x2="620" y2="310" stroke="#1c1b19" stroke-width="1.5"/>
  <line x1="400" y1="310" x2="400" y2="90" stroke="#1c1b19" stroke-width="1.5"/>
  <line x1="395" y1="310" x2="400" y2="310" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="392" y="314" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">0%</text>
  <line x1="400" y1="310" x2="620" y2="310" stroke="#d8d6d0" stroke-width="1"/>
  <line x1="395" y1="266" x2="400" y2="266" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="392" y="270" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">20%</text>
  <line x1="400" y1="266" x2="620" y2="266" stroke="#d8d6d0" stroke-width="1"/>
  <line x1="395" y1="222" x2="400" y2="222" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="392" y="226" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">40%</text>
  <line x1="400" y1="222" x2="620" y2="222" stroke="#d8d6d0" stroke-width="1"/>
  <line x1="395" y1="178" x2="400" y2="178" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="392" y="182" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">60%</text>
  <line x1="400" y1="178" x2="620" y2="178" stroke="#d8d6d0" stroke-width="1"/>
  <line x1="395" y1="134" x2="400" y2="134" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="392" y="138" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">80%</text>
  <line x1="400" y1="134" x2="620" y2="134" stroke="#d8d6d0" stroke-width="1"/>
  <line x1="395" y1="90" x2="400" y2="90" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="392" y="94" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">100%</text>
  <line x1="400" y1="90" x2="620" y2="90" stroke="#d8d6d0" stroke-width="1"/>
  <text x="510" y="30" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19" font-weight="bold">Within the 112 people who were ill:</text>
  <text x="510" y="48" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19" font-weight="bold">percent in each flu-shot group</text>
  <text x="510" y="66" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935" font-style="italic">P(group | ill)</text>
  <rect x="423" y="215.71" width="64" height="94.29" fill="#e9cdbd" stroke="#8a4a2b" stroke-width="1.5"/>
  <text x="455" y="193.71" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#8a4a2b" font-weight="bold">43%</text>
  <text x="455" y="208.71" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">48 of 112</text>
  <text x="455" y="330" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19">Flu shot</text>
  <rect x="533" y="184.29" width="64" height="125.71" fill="#c9d8e1" stroke="#35566b" stroke-width="1.5"/>
  <text x="565" y="162.29" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#35566b" font-weight="bold">57%</text>
  <text x="565" y="177.29" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">64 of 112</text>
  <text x="565" y="330" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19">No flu shot</text>
  <text x="320" y="372" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">Hypothetical survey of 800 adults: 480 with a flu shot, 320 without, 112 ill in total</text>
</svg>
