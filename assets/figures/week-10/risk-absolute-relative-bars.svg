<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Same relative risk, different absolute benefit: a hypothetical medication in moderate-risk and higher-risk adults</title>
  <desc id="desc">Bar chart of hypothetical 5-year heart attack risk. Moderate-risk adults: 4.0% on placebo, 3.0% on medication. Higher-risk adults: 20.0% and 15.0%. Relative risk is 0.75 in both; numbers needed to treat are 100 and 20.</desc>
  <rect x="0" y="0" width="640" height="420" fill="#ffffff" stroke="none" stroke-width="1.5"/>
  <line x1="80" y1="350" x2="620" y2="350" stroke="#1c1b19" stroke-width="1.5"/>
  <line x1="80" y1="350" x2="80" y2="90" stroke="#1c1b19" stroke-width="1.5"/>
  <line x1="75" y1="350" x2="80" y2="350" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="72" y="354" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">0%</text>
  <line x1="80" y1="350" x2="620" y2="350" stroke="#d8d6d0" stroke-width="1"/>
  <line x1="75" y1="306.67" x2="80" y2="306.67" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="72" y="310.67" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">5%</text>
  <line x1="80" y1="306.67" x2="620" y2="306.67" stroke="#d8d6d0" stroke-width="1"/>
  <line x1="75" y1="263.33" x2="80" y2="263.33" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="72" y="267.33" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">10%</text>
  <line x1="80" y1="263.33" x2="620" y2="263.33" stroke="#d8d6d0" stroke-width="1"/>
  <line x1="75" y1="220" x2="80" y2="220" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="72" y="224" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">15%</text>
  <line x1="80" y1="220" x2="620" y2="220" stroke="#d8d6d0" stroke-width="1"/>
  <line x1="75" y1="176.67" x2="80" y2="176.67" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="72" y="180.67" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">20%</text>
  <line x1="80" y1="176.67" x2="620" y2="176.67" stroke="#d8d6d0" stroke-width="1"/>
  <line x1="75" y1="133.33" x2="80" y2="133.33" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="72" y="137.33" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">25%</text>
  <line x1="80" y1="133.33" x2="620" y2="133.33" stroke="#d8d6d0" stroke-width="1"/>
  <line x1="75" y1="90" x2="80" y2="90" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="72" y="94" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">30%</text>
  <line x1="80" y1="90" x2="620" y2="90" stroke="#d8d6d0" stroke-width="1"/>
  <text x="34" y="220" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19" transform="rotate(-90 34 220)">5-year risk of a heart attack</text>
  <rect x="92" y="20" width="12" height="12" fill="#35566b" stroke="none" stroke-width="1.5"/>
  <text x="110" y="30" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19">Placebo</text>
  <rect x="92" y="40" width="12" height="12" fill="#8a4a2b" stroke="none" stroke-width="1.5"/>
  <text x="110" y="50" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19">Medication</text>
  <rect x="139" y="315.33" width="70" height="34.67" fill="#c9d8e1" stroke="#35566b" stroke-width="1.5"/>
  <text x="174" y="309.33" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#35566b" font-weight="bold">4.0%</text>
  <text x="174" y="368" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">Placebo</text>
  <rect x="221" y="324" width="70" height="26" fill="#e9cdbd" stroke="#8a4a2b" stroke-width="1.5"/>
  <text x="256" y="318" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#8a4a2b" font-weight="bold">3.0%</text>
  <text x="256" y="368" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">Medication</text>
  <text x="215" y="388" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19" font-weight="bold">Moderate-risk adults</text>
  <rect x="95" y="96" width="240" height="52" fill="#ffffff" stroke="none" stroke-width="1.5"/>
  <text x="215" y="110" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">Relative risk 0.75 (25% lower)</text>
  <text x="215" y="126" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">Risk difference 1 percentage point</text>
  <text x="215" y="142" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">Number needed to treat 100</text>
  <rect x="409" y="176.67" width="70" height="173.33" fill="#c9d8e1" stroke="#35566b" stroke-width="1.5"/>
  <text x="444" y="170.67" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#35566b" font-weight="bold">20.0%</text>
  <text x="444" y="368" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">Placebo</text>
  <rect x="491" y="220" width="70" height="130" fill="#e9cdbd" stroke="#8a4a2b" stroke-width="1.5"/>
  <text x="526" y="214" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#8a4a2b" font-weight="bold">15.0%</text>
  <text x="526" y="368" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">Medication</text>
  <text x="485" y="388" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19" font-weight="bold">Higher-risk adults</text>
  <rect x="365" y="96" width="240" height="52" fill="#ffffff" stroke="none" stroke-width="1.5"/>
  <text x="485" y="110" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">Relative risk 0.75 (25% lower)</text>
  <text x="485" y="126" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">Risk difference 5 percentage points</text>
  <text x="485" y="142" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">Number needed to treat 20</text>
  <text x="320" y="410" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">Higher-risk values assume the same relative risk, 0.75, at a 20% baseline risk</text>
</svg>
