<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img">
  <title>One two-by-two table read in two directions</title>
  <desc>The same table of counts twice, shaded down the columns for test properties and across the rows for what a result means.</desc>
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <text x="30" y="32" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">Which cells a number compares</text>
  <text x="30" y="52" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Sensitivity and specificity run down the columns. Predictive value runs across the rows. Same nine counts either way.</text>
  <text x="30" y="102" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold">Reading down the columns</text>
  <rect x="134" y="152" width="100" height="102" fill="#dbe6ef"/>
  <rect x="234" y="152" width="100" height="102" fill="#f3e3d6"/>
  <rect x="30" y="118" width="384" height="34" fill="#eef2f6"/>
  <text x="39" y="139.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold"></text>
  <text x="184" y="139.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">Has it</text>
  <text x="284" y="139.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">Does not</text>
  <text x="374" y="139.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">Total</text>
  <line x1="30" y1="118" x2="414" y2="118" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="39" y="173.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Test positive</text>
  <text x="184" y="173.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">9</text>
  <text x="284" y="173.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">99</text>
  <text x="374" y="173.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">108</text>
  <line x1="30" y1="152" x2="414" y2="152" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="39" y="207.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Test negative</text>
  <text x="184" y="207.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">1</text>
  <text x="284" y="207.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">891</text>
  <text x="374" y="207.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">892</text>
  <line x1="30" y1="186" x2="414" y2="186" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="39" y="241.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Total</text>
  <text x="184" y="241.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">10</text>
  <text x="284" y="241.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">990</text>
  <text x="374" y="241.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">1,000</text>
  <line x1="30" y1="220" x2="414" y2="220" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="30" y1="254" x2="414" y2="254" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="134" y1="118" x2="134" y2="254" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="234" y1="118" x2="234" y2="254" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="334" y1="118" x2="334" y2="254" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="30" y1="118" x2="30" y2="254" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="414" y1="118" x2="414" y2="254" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="30" y="288" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2f6f9f" text-anchor="start">Sensitivity: 9 of the 10 who have it</text>
  <text x="30" y="310" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2f6f9f" text-anchor="start">test positive, so 0.90.</text>
  <text x="30" y="340" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#c2622d" text-anchor="start">Specificity: 891 of the 990 who do not</text>
  <text x="30" y="362" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#c2622d" text-anchor="start">test negative, so 0.90.</text>
  <text x="30" y="396" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Both are facts about the test.</text>
  <text x="482" y="102" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold">Reading across the rows</text>
  <rect x="586" y="152" width="280" height="34" fill="#dbe6ef"/>
  <rect x="586" y="186" width="280" height="34" fill="#f3e3d6"/>
  <rect x="482" y="118" width="384" height="34" fill="#eef2f6"/>
  <text x="491" y="139.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold"></text>
  <text x="636" y="139.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">Has it</text>
  <text x="736" y="139.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">Does not</text>
  <text x="826" y="139.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">Total</text>
  <line x1="482" y1="118" x2="866" y2="118" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="491" y="173.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Test positive</text>
  <text x="636" y="173.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">9</text>
  <text x="736" y="173.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">99</text>
  <text x="826" y="173.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">108</text>
  <line x1="482" y1="152" x2="866" y2="152" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="491" y="207.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Test negative</text>
  <text x="636" y="207.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">1</text>
  <text x="736" y="207.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">891</text>
  <text x="826" y="207.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">892</text>
  <line x1="482" y1="186" x2="866" y2="186" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="491" y="241.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Total</text>
  <text x="636" y="241.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">10</text>
  <text x="736" y="241.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">990</text>
  <text x="826" y="241.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">1,000</text>
  <line x1="482" y1="220" x2="866" y2="220" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="482" y1="254" x2="866" y2="254" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="586" y1="118" x2="586" y2="254" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="686" y1="118" x2="686" y2="254" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="786" y1="118" x2="786" y2="254" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="482" y1="118" x2="482" y2="254" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="866" y1="118" x2="866" y2="254" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="482" y="288" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2f6f9f" text-anchor="start">A positive result: 9 of those 108</text>
  <text x="482" y="310" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2f6f9f" text-anchor="start">have it, so 0.083.</text>
  <text x="482" y="340" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#c2622d" text-anchor="start">A negative result: 891 of those 892</text>
  <text x="482" y="362" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#c2622d" text-anchor="start">do not have it, so 0.999.</text>
  <text x="482" y="396" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Both depend on how common it is.</text>
  <line x1="452" y1="96" x2="452" y2="430" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
</svg>
