<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img">
  <title>Probability tree for a screening test</title>
  <desc>One thousand people split by condition and then by test result, with counts on every branch.</desc>
  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
  <text x="30" y="30" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">One thousand people, sorted twice</text>
  <text x="30" y="50" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">First by whether the condition is there, then by what the test said.</text>
  <rect x="30" y="165" width="150" height="60" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="105" y="191" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">1,000 people</text>
  <text x="105" y="208" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">screened</text>
  <rect x="270" y="70" width="170" height="58" fill="#dbe6ef" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="355" y="95" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Condition present</text>
  <text x="355" y="112" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">10 people</text>
  <rect x="270" y="270" width="170" height="58" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="355" y="295" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Condition absent</text>
  <text x="355" y="312" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">990 people</text>
  <rect x="580" y="20" width="190" height="52" fill="#dbe6ef" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="675" y="42" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Test positive</text>
  <text x="675" y="59" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">9 people</text>
  <rect x="580" y="100" width="190" height="52" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="675" y="122" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Test negative</text>
  <text x="675" y="139" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">1 person</text>
  <rect x="580" y="230" width="190" height="52" fill="#f3e3d6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="675" y="252" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Test positive</text>
  <text x="675" y="269" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">99 people</text>
  <rect x="580" y="310" width="190" height="52" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="675" y="332" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Test negative</text>
  <text x="675" y="349" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">891 people</text>
  <line x1="182" y1="192" x2="261.224" y2="107.117" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="266,102 258.921,104.968 263.527,109.267" fill="#5b6672"/>
  <line x1="182" y1="200" x2="261.39" y2="290.732" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="266,296 263.761,288.658 259.02,292.806" fill="#5b6672"/>
  <text x="222" y="136" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">10 of 1,000</text>
  <text x="222" y="264" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">990 of 1,000</text>
  <line x1="442" y1="94" x2="569.379" y2="50.273" stroke="#2f6f9f" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="576,48 568.356,47.293 570.402,53.252" fill="#2f6f9f"/>
  <line x1="442" y1="104" x2="569.077" y2="122.967" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="576,124 569.542,119.851 568.612,126.082" fill="#5b6672"/>
  <text x="508" y="60" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2f6f9f" text-anchor="middle">0.90 sensitivity</text>
  <text x="508" y="136" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.10 missed</text>
  <line x1="442" y1="294" x2="569.24" y2="259.816" stroke="#c2622d" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="576,258 568.422,256.774 570.057,262.858" fill="#c2622d"/>
  <line x1="442" y1="304" x2="569.169" y2="332.471" stroke="#3f7a52" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="576,334 569.857,329.397 568.481,335.545" fill="#3f7a52"/>
  <text x="508" y="248" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#c2622d" text-anchor="middle">0.10 false alarm</text>
  <text x="508" y="348" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3f7a52" text-anchor="middle">0.90 specificity</text>
  <line x1="30" y1="372" x2="770" y2="372" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="30" y="390" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Positive results in all: 9 plus 99, which is 108 of the 1,000 people.</text>
</svg>
