<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img">
  <title>Predictive value of a positive against prevalence</title>
  <desc>A rising curve showing how the chance that a positive result is real depends on how common the condition is, for a fixed test.</desc>
  <rect x="0" y="0" width="720" height="470" fill="#ffffff"/>
  <text x="30" y="32" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">Chance that a positive result is real</text>
  <text x="30" y="52" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">The test never changes: sensitivity 0.90, specificity 0.90. Only the group tested changes.</text>
