  <line x1="86" y1="156" x2="90" y2="156" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="82" y="159.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">75%</text>
