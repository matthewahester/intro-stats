<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" role="img">
  <title>The null and the alternative for one question</title>
  <desc>Two panels. The left panel states the null claim in words and as p equals 0.80. The right panel states the alternative claim in words and as p below 0.80.</desc>
  <rect x="0" y="0" width="780" height="430" fill="#ffffff"/>
  <text x="390" y="34" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">One question, two claims</text>
  <text x="48" y="58" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">A transit agency advertises that 80 percent of its buses arrive on time. A student group records</text>
  <text x="48" y="75" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">200 arrivals and finds 148 on time, a rate of 0.74.</text>
  <rect x="48" y="108" width="330" height="214" fill="#eef2f6" rx="8" stroke="#2f6f9f" stroke-width="1.4"/>
  <rect x="402" y="108" width="330" height="214" fill="#f3e3d6" rx="8" stroke="#c2622d" stroke-width="1.4"/>
  <text x="213" y="134" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2f6f9f" text-anchor="middle" font-weight="bold">Null claim, written H0</text>
  <text x="567" y="134" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#c2622d" text-anchor="middle" font-weight="bold">Alternative claim, written HA</text>
  <text x="62" y="162" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start" font-weight="bold">In words</text>
  <text x="62" y="182" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">The on-time rate for every arrival the</text>
  <text x="62" y="199" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">agency runs really is 80 percent. The</text>
  <text x="62" y="216" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">shortfall in these 200 arrivals is</text>
  <text x="62" y="233" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">ordinary sampling variation.</text>
  <text x="416" y="162" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start" font-weight="bold">In words</text>
  <text x="416" y="182" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">The on-time rate for every arrival the</text>
  <text x="416" y="199" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">agency runs is lower than 80 percent.</text>
  <text x="416" y="216" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">Something other than chance is at work.</text>
  <line x1="62" y1="260" x2="364" y2="260" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="416" y1="260" x2="718" y2="260" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="62" y="282" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start" font-weight="bold">In notation</text>
  <text x="62" y="306" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2f6f9f" text-anchor="start" font-weight="bold">p = 0.80</text>
  <text x="416" y="282" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start" font-weight="bold">In notation</text>
  <text x="416" y="306" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#c2622d" text-anchor="start" font-weight="bold">p is below 0.80</text>
  <rect x="48" y="344" width="684" height="62" fill="#ffffff" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="64" y="366" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">p is the on-time rate for the whole fleet, which nobody has measured. The value 0.74 is</text>
  <text x="64" y="383" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">what these 200 arrivals showed. Both claims are about p. Only p-hat was observed.</text>
</svg>
