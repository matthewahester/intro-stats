<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" role="img">
  <title>Two-way table with its margins</title>
  <desc>The 500 clinic appointments arranged as a two-way table, with the row margin, the column margin, and the grand total labelled, and one conditional proportion traced across the reminder row.</desc>
  <rect x="0" y="0" width="820" height="470" fill="#ffffff"/>
  <text x="410" y="34" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Appointments at a campus health center</text>
  <text x="410" y="56" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">Rows are the two groups. Columns are the two outcomes.</text>
  <rect x="60" y="88" width="430" height="34" fill="#eef2f6"/>
  <text x="69" y="109.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold"></text>
  <text x="255" y="109.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Missed</text>
  <text x="345" y="109.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Kept</text>
  <text x="440" y="109.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Row total</text>
  <line x1="60" y1="88" x2="490" y2="88" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="69" y="143.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="start">Reminder sent</text>
  <text x="255" y="143.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">20</text>
  <text x="345" y="143.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">230</text>
  <text x="440" y="143.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">250</text>
  <line x1="60" y1="122" x2="490" y2="122" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="69" y="177.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="start">No reminder</text>
  <text x="255" y="177.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">40</text>
  <text x="345" y="177.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">210</text>
  <text x="440" y="177.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">250</text>
  <line x1="60" y1="156" x2="490" y2="156" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="69" y="211.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="start">Column total</text>
  <text x="255" y="211.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">60</text>
  <text x="345" y="211.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">440</text>
  <text x="440" y="211.3" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="middle">500</text>
  <line x1="60" y1="190" x2="490" y2="190" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="60" y1="224" x2="490" y2="224" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="210" y1="88" x2="210" y2="224" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="300" y1="88" x2="300" y2="224" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="390" y1="88" x2="390" y2="224" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="60" y1="88" x2="60" y2="224" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="490" y1="88" x2="490" y2="224" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <rect x="60" y="122" width="430" height="34" fill="none" rx="3" stroke="#2f6f9f" stroke-width="2.4"/>
  <line x1="516" y1="139" x2="501" y2="139" stroke="#1f2933" stroke-width="1.3" stroke-linecap="round"/>
  <polygon points="494,139 501,142.15 501,135.85" fill="#1f2933"/>
  <text x="524" y="128" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">Row margin: 250</text>
  <text x="524" y="143" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">appointments in this group</text>
  <line x1="516" y1="207" x2="501" y2="207" stroke="#1f2933" stroke-width="1.3" stroke-linecap="round"/>
  <polygon points="494,207 501,210.15 501,203.85" fill="#1f2933"/>
  <text x="524" y="196" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">Grand total: all 500</text>
  <text x="524" y="211" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">appointments in the study</text>
  <line x1="255" y1="288" x2="255" y2="235" stroke="#1f2933" stroke-width="1.3" stroke-linecap="round"/>
  <polygon points="255,228 251.85,235 258.15,235" fill="#1f2933"/>
  <text x="255" y="308" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle">Column margin: how many</text>
  <text x="255" y="324" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle">appointments had each outcome</text>
  <text x="255" y="340" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">60 missed, 440 kept</text>
  <rect x="60" y="358" width="700" height="92" fill="#eef2f6" rx="6" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="76" y="382" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="bold">Reading across one row holds the group fixed.</text>
  <text x="76" y="404" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Of the 250 appointments that got a reminder, 20 were missed.</text>
  <text x="76" y="426" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">20 divided by 250 is 0.08, the risk of a missed appointment in that group.</text>
</svg>
