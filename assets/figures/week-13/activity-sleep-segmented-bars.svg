<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="title desc">
  <title id="title">Sleep quality within each physical activity group, hypothetical survey of 500 adults</title>
  <desc id="desc">Segmented bars scaled to 100 percent. Good sleep is 45 percent for low activity, 58 percent for moderate and 65 percent for high; a dashed line marks the overall 55.8 percent.</desc>
  <rect x="0" y="0" width="640" height="380" fill="#ffffff" stroke="none" stroke-width="1.5"/>
  <line x1="80" y1="300" x2="430" y2="300" stroke="#1c1b19" stroke-width="1.5"/>
  <line x1="80" y1="300" x2="80" y2="50" stroke="#1c1b19" stroke-width="1.5"/>
  <line x1="75" y1="300" x2="80" y2="300" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="72" y="304" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">0%</text>
  <line x1="75" y1="250" x2="80" y2="250" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="72" y="254" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">20%</text>
  <line x1="75" y1="200" x2="80" y2="200" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="72" y="204" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">40%</text>
  <line x1="75" y1="150" x2="80" y2="150" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="72" y="154" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">60%</text>
  <line x1="75" y1="100" x2="80" y2="100" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="72" y="104" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">80%</text>
  <line x1="75" y1="50" x2="80" y2="50" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="72" y="54" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">100%</text>
  <text x="255" y="340" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19">Physical activity level</text>
  <text x="34" y="175" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19" transform="rotate(-90 34 175)">Percent of activity group</text>
  <rect x="98" y="187.5" width="84" height="112.5" fill="#8a4a2b" stroke="#8a4a2b" stroke-width="1"/>
  <rect x="98" y="50" width="84" height="137.5" fill="#c9d8e1" stroke="#35566b" stroke-width="1"/>
  <text x="140" y="248.75" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="600">45% good</text>
  <text x="140" y="123.75" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19">55% poor</text>
  <text x="140" y="319" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">Low (n = 160)</text>
  <rect x="213" y="155" width="84" height="145" fill="#8a4a2b" stroke="#8a4a2b" stroke-width="1"/>
  <rect x="213" y="50" width="84" height="105" fill="#c9d8e1" stroke="#35566b" stroke-width="1"/>
  <text x="255" y="232.5" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="600">58% good</text>
  <text x="255" y="107.5" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19">42% poor</text>
  <text x="255" y="319" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">Moderate (n = 200)</text>
  <rect x="328" y="137.5" width="84" height="162.5" fill="#8a4a2b" stroke="#8a4a2b" stroke-width="1"/>
  <rect x="328" y="50" width="84" height="87.5" fill="#c9d8e1" stroke="#35566b" stroke-width="1"/>
  <text x="370" y="223.75" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="600">65% good</text>
  <text x="370" y="98.75" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19">35% poor</text>
  <text x="370" y="319" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">High (n = 140)</text>
  <line x1="80" y1="160.5" x2="420" y2="160.5" stroke="#1c1b19" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="438" y="156.5" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19">Dashed line: 55.8% good</text>
  <text x="438" y="172.5" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19">sleep among all 500 adults,</text>
  <text x="438" y="188.5" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19">the split every bar would</text>
  <text x="438" y="204.5" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19">show under independence</text>
  <rect x="440" y="62" width="14" height="14" fill="#8a4a2b" stroke="#8a4a2b" stroke-width="1"/>
  <text x="460" y="74" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19">Reported good sleep</text>
  <rect x="440" y="86" width="14" height="14" fill="#c9d8e1" stroke="#35566b" stroke-width="1"/>
  <text x="460" y="98" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19">Reported poor sleep</text>
  <text x="255" y="370" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">Hypothetical survey of 500 adults</text>
</svg>
