  <rect x="376.67" y="149.72" width="32" height="150.28" fill="#8a4a2b" stroke="#8a4a2b" stroke-width="1"/>
  <rect x="414.67" y="179.23" width="32" height="120.77" fill="#c9d8e1" stroke="#35566b" stroke-width="1"/>
  <text x="392.67" y="144.72" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">88</text>
  <text x="430.67" y="174.23" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#35566b">70.72</text>
  <text x="411.67" y="318" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">Low</text>
  <rect x="460" y="156.55" width="32" height="143.45" fill="#8a4a2b" stroke="#8a4a2b" stroke-width="1"/>
  <rect x="498" y="149.04" width="32" height="150.96" fill="#c9d8e1" stroke="#35566b" stroke-width="1"/>
  <text x="476" y="151.55" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1c1b19">84</text>
  <text x="514" y="144.04" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#35566b">88.40</text>
  <text x="495" y="318" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">Moderate</text>
