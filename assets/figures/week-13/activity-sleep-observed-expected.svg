<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" width="640" height="390" role="img" aria-labelledby="title desc">
  <title id="title">Observed counts and counts expected under independence, activity and sleep survey</title>
  <desc id="desc">Paired bars for six cells. Good sleep observed vs expected: low 72 vs 89.28, moderate 116 vs 111.60, high 91 vs 78.12. Poor sleep: low 88 vs 70.72, moderate 84 vs 88.40, high 49 vs 61.88.</desc>
