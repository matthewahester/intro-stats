  <text x="490.31" y="149" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19">55</text>
  <text x="150" y="195" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="end" fill="#1c1b19" font-weight="600">Cedar</text>
  <text x="150" y="210" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">pop. 90,000</text>
  <rect x="160" y="181" width="30.78" height="30" fill="#c9d8e1" stroke="#35566b" stroke-width="1"/>
  <text x="195.78" y="201" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19">81</text>
  <rect x="420" y="181" width="106.88" height="30" fill="#8a4a2b" stroke="#8a4a2b" stroke-width="1"/>
  <text x="531.88" y="201" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19">90</text>
  <text x="150" y="247" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="end" fill="#1c1b19" font-weight="600">Dogwood</text>
  <text x="150" y="262" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#3a3935">pop. 30,000</text>
  <rect x="160" y="233" width="17.1" height="30" fill="#c9d8e1" stroke="#35566b" stroke-width="1"/>
  <text x="182.1" y="253" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19">45</text>
  <rect x="420" y="233" width="178.12" height="30" fill="#8a4a2b" stroke="#8a4a2b" stroke-width="1"/>
  <text x="603.12" y="253" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1c1b19">150</text>
  <text x="320" y="346" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">Hypothetical counties. Rate = cases ÷ population × 100,000.</text>
