<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Case counts and rates per 100,000 for four hypothetical counties</title>
  <desc id="desc">Two bar panels for four hypothetical counties. Counts: Alder 480, Birch 220, Cedar 81, Dogwood 45. Rates per 100,000: Alder 40, Birch 55, Cedar 90, Dogwood 150. The order reverses.</desc>
