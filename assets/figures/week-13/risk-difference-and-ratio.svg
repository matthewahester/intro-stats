<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img">
  <title>Risk difference and relative risk from the same bars</title>
  <desc>Two bars giving the share of appointments missed in each group, with the gap between the bar tops read as a risk difference and the height of one bar against the other read as a relative risk.</desc>
  <rect x="0" y="0" width="800" height="470" fill="#ffffff"/>
  <line x1="150" y1="360" x2="450" y2="360" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="150" y1="80" x2="150" y2="360" stroke="#5b6672" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="150" y1="360" x2="450" y2="360" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="150" y1="290" x2="450" y2="290" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="150" y1="220" x2="450" y2="220" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="150" y1="150" x2="450" y2="150" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="150" y1="80" x2="450" y2="80" stroke="#eef2f6" stroke-width="1" stroke-linecap="round"/>
  <line x1="240" y1="360" x2="240" y2="364" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="240" y="377" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">Reminder sent</text>
  <line x1="360" y1="360" x2="360" y2="364" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="360" y="377" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">No reminder</text>
  <line x1="146" y1="360" x2="150" y2="360" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="142" y="363.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0%</text>
  <line x1="146" y1="290" x2="150" y2="290" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="142" y="293.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">5%</text>
  <line x1="146" y1="220" x2="150" y2="220" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="142" y="223.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">10%</text>
  <line x1="146" y1="150" x2="150" y2="150" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="142" y="153.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">15%</text>
  <line x1="146" y1="80" x2="150" y2="80" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="142" y="83.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">20%</text>
  <text x="142" y="68" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end">Share missed</text>
  <text x="300" y="66" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Missed appointments, by whether a reminder was sent</text>
  <rect x="202.5" y="248" width="75" height="112" fill="#2f6f9f"/>
  <rect x="322.5" y="136" width="75" height="224" fill="#c2622d"/>
  <text x="240" y="238" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">8%</text>
  <text x="360" y="126" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">16%</text>
  <text x="240" y="300" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">20 of 250</text>
  <text x="360" y="300" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">40 of 250</text>
  <line x1="277.5" y1="248" x2="424" y2="248" stroke="#5b6672" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/>
  <line x1="397.5" y1="136" x2="424" y2="136" stroke="#5b6672" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/>
  <line x1="420" y1="192" x2="420" y2="146" stroke="#1f2933" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="420,138 416.4,146 423.6,146" fill="#1f2933"/>
  <line x1="420" y1="192" x2="420" y2="238" stroke="#1f2933" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="420,246 423.6,238 416.4,238" fill="#1f2933"/>
  <text x="444" y="150" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="bold">Risk difference</text>
  <text x="444" y="170" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">16 percent minus 8 percent is eight</text>
  <text x="444" y="185" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">percentage points. Out of every 100</text>
  <text x="444" y="200" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">appointments given a reminder, about</text>
  <text x="444" y="215" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">eight fewer are missed.</text>
  <text x="444" y="258" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="bold">Relative risk</text>
  <text x="444" y="278" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">8 percent divided by 16 percent is 0.5.</text>
  <text x="444" y="293" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">The blue bar is half the height of the</text>
  <text x="444" y="308" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">orange one, so half the rate.</text>
  <text x="150" y="440" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Two summaries, one pair of bars. Both are true, and they say different things.</text>
</svg>
