<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img">
  <title>Odds against probability</title>
  <desc>A curve mapping probability to odds, rising away from the equal-value line as the outcome becomes common, beside two comparisons that both double the risk but give very different odds ratios.</desc>
