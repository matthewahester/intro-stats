  <text x="150.588" y="387" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.2</text>
  <line x1="221.176" y1="370" x2="221.176" y2="374" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="221.176" y="387" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.4</text>
  <line x1="291.765" y1="370" x2="291.765" y2="374" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="291.765" y="387" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.6</text>
  <line x1="362.353" y1="370" x2="362.353" y2="374" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="362.353" y="387" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">0.8</text>
  <line x1="76" y1="370" x2="80" y2="370" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="72" y="373.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">0</text>
  <line x1="76" y1="314" x2="80" y2="314" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="72" y="317.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">1</text>
  <line x1="76" y1="258" x2="80" y2="258" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="72" y="261.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">2</text>
  <line x1="76" y1="202" x2="80" y2="202" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="72" y="205.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">3</text>
  <line x1="76" y1="146" x2="80" y2="146" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="72" y="149.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">4</text>
  <line x1="76" y1="90" x2="80" y2="90" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="72" y="93.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="end">5</text>
  <text x="230" y="408" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">Probability of the outcome</text>
