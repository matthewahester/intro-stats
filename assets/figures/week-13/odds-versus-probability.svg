365.056,134.849 367.319,124.811 369.581,114.057 371.844,102.506 374.106,90.067" fill="none" stroke="#2f6f9f" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="97.647" cy="367.053" r="4.6" fill="#1f2933"/>
  <circle cx="221.176" cy="332.667" r="4.6" fill="#1f2933"/>
  <circle cx="362.353" cy="146" r="4.6" fill="#1f2933"/>
  <line x1="150" y1="306" x2="104.991" y2="356.52" stroke="#5b6672" stroke-width="1.1" stroke-linecap="round"/>
  <polygon points="101,361 107.007,358.316 102.975,354.724" fill="#5b6672"/>
  <text x="112" y="300" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2933" text-anchor="start">0.05 gives odds 0.05</text>
  <text x="211.176" y="326.667" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2933" text-anchor="end">0.40 gives odds 0.67</text>
  <text x="352.353" y="150" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2933" text-anchor="end">0.80 gives odds 4.0</text>
  <text x="376" y="352" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6672" text-anchor="end">equal values</text>
  <text x="440" y="92" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold">The same doubling, twice</text>
  <text x="440" y="122" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold">Uncommon outcome</text>
