  <rect x="440" y="158" width="25" height="18" fill="#c2622d" rx="2"/>
  <text x="473" y="171" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="start">10 percent</text>
  <text x="440" y="200" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">relative risk 2.0, odds ratio 2.1</text>
  <text x="440" y="234" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold">Common outcome</text>
  <rect x="440" y="244" width="100" height="18" fill="#2f6f9f" rx="2"/>
  <text x="548" y="257" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="start">40 percent</text>
  <rect x="440" y="270" width="200" height="18" fill="#c2622d" rx="2"/>
  <text x="648" y="283" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="start">80 percent</text>
  <text x="440" y="312" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">relative risk 2.0, odds ratio 6.0</text>
  <text x="440" y="344" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Both comparisons double the risk. Only the</text>
  <text x="440" y="359" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">uncommon one has an odds ratio anywhere near</text>
  <text x="440" y="374" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">2.</text>
  <text x="80" y="442" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Odds and probability agree only while the outcome stays rare.</text>
</svg>
