  <text x="380" y="231.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">Off by</text>
  <text x="485" y="231.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">Expected</text>
  <text x="600" y="231.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">Mismatch term</text>
  <line x1="120" y1="212" x2="660" y2="212" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="129" y="261.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Reminder, missed</text>
  <text x="380" y="261.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">10</text>
  <text x="485" y="261.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">30</text>
  <text x="600" y="261.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">3.33</text>
  <line x1="120" y1="242" x2="660" y2="242" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <rect x="120" y="272" width="540" height="30" fill="#dbe6ef"/>
  <text x="129" y="291.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Reminder, kept</text>
  <text x="380" y="291.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">10</text>
  <text x="485" y="291.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">220</text>
  <text x="600" y="291.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">0.45</text>
  <line x1="120" y1="272" x2="660" y2="272" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="129" y="321.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">No reminder, missed</text>
  <text x="380" y="321.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">10</text>
  <text x="485" y="321.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">30</text>
  <text x="600" y="321.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">3.33</text>
  <line x1="120" y1="302" x2="660" y2="302" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <rect x="120" y="332" width="540" height="30" fill="#dbe6ef"/>
  <text x="129" y="351.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">No reminder, kept</text>
  <text x="380" y="351.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">10</text>
  <text x="485" y="351.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">220</text>
  <text x="600" y="351.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">0.45</text>
