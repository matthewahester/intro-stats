  <text x="610" y="100.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">Missed</text>
  <text x="690" y="100.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">Kept</text>
  <line x1="440" y1="80" x2="730" y2="80" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
