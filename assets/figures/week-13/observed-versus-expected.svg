  <text x="690" y="164.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">220</text>
  <line x1="440" y1="144" x2="730" y2="144" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="440" y1="176" x2="730" y2="176" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="570" y1="80" x2="570" y2="176" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="650" y1="80" x2="650" y2="176" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="440" y1="80" x2="440" y2="176" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="730" y1="80" x2="730" y2="176" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
