  <text x="195" y="66" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">What the clinic saw</text>
  <text x="585" y="66" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">If reminders changed nothing</text>
  <rect x="50" y="80" width="290" height="32" fill="#eef2f6"/>
