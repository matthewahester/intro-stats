  <text x="220" y="132.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">20</text>
  <text x="300" y="132.3" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">230</text>
  <line x1="50" y1="112" x2="340" y2="112" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
