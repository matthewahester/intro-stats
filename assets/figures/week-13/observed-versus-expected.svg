<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" role="img">
  <title>Observed counts against expected counts</title>
  <desc>The observed table of clinic counts beside the table of counts expected if reminders made no difference, with the missed column highlighted in both and the four mismatch terms listed underneath.</desc>
  <rect x="0" y="0" width="780" height="470" fill="#ffffff"/>
