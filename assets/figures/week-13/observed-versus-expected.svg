  <line x1="330" y1="212" x2="330" y2="362" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="430" y1="212" x2="430" y2="362" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="540" y1="212" x2="540" y2="362" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="120" y1="212" x2="120" y2="362" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="660" y1="212" x2="660" y2="362" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="390" y="392" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">The four mismatch terms add to 7.58</text>
  <text x="120" y="414" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">The same gap of ten counts for far more where only 30 were expected than</text>
  <text x="120" y="429" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">where 220 were. That weighting is the whole idea behind the chi-square</text>
  <text x="120" y="444" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">statistic.</text>
</svg>
