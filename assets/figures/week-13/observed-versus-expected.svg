  <rect x="570" y="112" width="80" height="64" fill="none" rx="3" stroke="#a33a3a" stroke-width="2.2"/>
  <text x="390" y="110" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">compare</text>
