<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 505" width="960" height="505" role="img">
  <title>The recurring misreadings, with the correction beside each</title>
  <desc>A two-column catalogue: eight sentences students commonly write on the left, and on the right the sentence the same data actually support.</desc>
  <rect x="0" y="0" width="960" height="505" fill="#ffffff"/>
  <text x="480" y="32" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Eight sentences this course keeps rewriting</text>
  <text x="480" y="54" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">Left, what gets written. Right, what the same numbers will carry.</text>
  <rect x="30" y="74" width="900" height="30" fill="#eef2f6"/>
  <text x="44" y="94" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="bold">A sentence that gets written</text>
  <text x="476" y="94" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="bold">What the same data support</text>
  <text x="44" y="130" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="start">The sample was huge, so it speaks for everyone.</text>
  <text x="476" y="130" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3f7a52" text-anchor="start">Size shrinks noise, not bias. Ask how people got in.</text>
  <line x1="30" y1="104" x2="930" y2="104" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <rect x="30" y="146" width="900" height="42" fill="#f7f9fb"/>
  <text x="44" y="172" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="start">The averages differ, so the groups are different.</text>
  <text x="476" y="172" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3f7a52" text-anchor="start">Compare spread and overlap too, not centers alone.</text>
  <line x1="30" y1="146" x2="930" y2="146" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="44" y="214" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="start">They move together, so one must cause the other.</text>
  <text x="476" y="214" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3f7a52" text-anchor="start">A third variable or the reverse order fits equally well.</text>
  <line x1="30" y1="188" x2="930" y2="188" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <rect x="30" y="230" width="900" height="42" fill="#f7f9fb"/>
  <text x="44" y="256" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="start">The study controlled for everything.</text>
  <text x="476" y="256" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3f7a52" text-anchor="start">It adjusted for what was measured, and for nothing else.</text>
  <line x1="30" y1="230" x2="930" y2="230" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="44" y="298" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="start">The p-value was tiny, so the effect is large.</text>
  <text x="476" y="298" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3f7a52" text-anchor="start">Chance explains it poorly. Size is a separate question.</text>
  <line x1="30" y1="272" x2="930" y2="272" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <rect x="30" y="314" width="900" height="42" fill="#f7f9fb"/>
  <text x="44" y="340" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="start">The p-value was large, so there is no effect.</text>
  <text x="476" y="340" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3f7a52" text-anchor="start">No difference detected is not the same as no difference.</text>
  <line x1="30" y1="314" x2="930" y2="314" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="44" y="382" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="start">The test is 99 percent accurate, so I have it.</text>
  <text x="476" y="382" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3f7a52" text-anchor="start">For a rare condition, most positive results are false alarms.</text>
  <line x1="30" y1="356" x2="930" y2="356" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <rect x="30" y="398" width="900" height="42" fill="#f7f9fb"/>
  <text x="44" y="424" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c2622d" text-anchor="start">The studies disagree, so nobody really knows.</text>
  <text x="476" y="424" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3f7a52" text-anchor="start">Wide intervals that overlap agree more than they look.</text>
  <line x1="30" y1="398" x2="930" y2="398" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <rect x="30" y="74" width="900" height="366" fill="none" stroke="#c9d1d9" stroke-width="1.2"/>
  <line x1="462" y1="74" x2="462" y2="440" stroke="#c9d1d9" stroke-width="1.2" stroke-linecap="round"/>
  <text x="30" y="464" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Each left-hand sentence skips one link of the chain. Naming the link is how you repair the sentence.</text>
</svg>
