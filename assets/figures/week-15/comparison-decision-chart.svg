<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" role="img">
  <title>Choosing the comparison from the variable types</title>
  <desc>A seven-row chart running from the kind of variables in front of you to a first display, the summary worth quoting, and the comparison or model that fits.</desc>
  <rect x="0" y="0" width="940" height="440" fill="#ffffff"/>
  <text x="470" y="32" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Start from the variables, not from the formula</text>
  <text x="470" y="54" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">Read each row left to right. The row you are in decides everything after it.</text>
  <rect x="32" y="76" width="872" height="34" fill="#eef2f6"/>
  <text x="41" y="97.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="bold">What you are looking at</text>
  <text x="291" y="97.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="bold">First display</text>
  <text x="466" y="97.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="bold">Summary worth quoting</text>
  <text x="661" y="97.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="bold">Comparison or model</text>
  <line x1="32" y1="76" x2="904" y2="76" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="41" y="131.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">One numerical variable</text>
  <text x="291" y="131.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">histogram or dot plot</text>
  <text x="466" y="131.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">center, spread, shape</text>
  <text x="661" y="131.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">describe before comparing</text>
  <line x1="32" y1="110" x2="904" y2="110" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <rect x="32" y="144" width="872" height="34" fill="#f7f9fb"/>
  <text x="41" y="165.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">One categorical variable</text>
  <text x="291" y="165.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">bar chart</text>
  <text x="466" y="165.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">proportion in each category</text>
  <text x="661" y="165.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">describe before comparing</text>
  <line x1="32" y1="144" x2="904" y2="144" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="41" y="199.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Two groups, numerical outcome</text>
  <text x="291" y="199.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">side-by-side boxplots</text>
  <text x="466" y="199.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">mean and spread by group</text>
  <text x="661" y="199.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">difference in means</text>
  <line x1="32" y1="178" x2="904" y2="178" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <rect x="32" y="212" width="872" height="34" fill="#f7f9fb"/>
  <text x="41" y="233.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Two categorical variables</text>
  <text x="291" y="233.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">two-way table</text>
  <text x="466" y="233.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">conditional proportions</text>
  <text x="661" y="233.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">risk difference, relative risk</text>
  <line x1="32" y1="212" x2="904" y2="212" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="41" y="267.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Two numerical variables</text>
  <text x="291" y="267.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">scatterplot</text>
  <text x="466" y="267.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">correlation</text>
  <text x="661" y="267.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">regression slope</text>
  <line x1="32" y1="246" x2="904" y2="246" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <rect x="32" y="280" width="872" height="34" fill="#f7f9fb"/>
  <text x="41" y="301.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Numerical outcome, several predictors</text>
  <text x="291" y="301.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">scatterplot by group</text>
  <text x="466" y="301.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">adjusted coefficients</text>
  <text x="661" y="301.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">multiple regression</text>
  <line x1="32" y1="280" x2="904" y2="280" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="41" y="335.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">Yes or no outcome, one predictor</text>
  <text x="291" y="335.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">grouped bar chart</text>
  <text x="466" y="335.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">odds in each group</text>
  <text x="661" y="335.3" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="start">logistic regression, odds ratio</text>
  <line x1="32" y1="314" x2="904" y2="314" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="32" y1="348" x2="904" y2="348" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="282" y1="76" x2="282" y2="348" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="457" y1="76" x2="457" y2="348" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="652" y1="76" x2="652" y2="348" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="32" y1="76" x2="32" y2="348" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="904" y1="76" x2="904" y2="348" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="32" y="376" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Two questions come before this chart: how were the data produced, and what comparison is being made?</text>
  <text x="32" y="396" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Every row ends the same way: attach an interval, then choose a verb the design supports.</text>
</svg>
