<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 582" width="900" height="582" role="img">
  <title>Seven parts of a responsible written conclusion</title>
  <desc>A seven-item checklist, from naming the cases to saying what would change your mind, with a worked example sentence underneath showing every part in place.</desc>
  <rect x="0" y="0" width="900" height="582" fill="#ffffff"/>
  <text x="450" y="32" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">A conclusion a non-technical reader can act on</text>
  <text x="450" y="54" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="middle">Seven parts. A sentence missing one of them is doing less than it seems.</text>
  <rect x="44" y="82" width="16" height="16" fill="#ffffff" rx="3" stroke="#2f6f9f" stroke-width="1.6"/>
  <line x1="48" y1="90" x2="51.5" y2="94.5" stroke="#3f7a52" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="51.5" y1="94.5" x2="57" y2="85.5" stroke="#3f7a52" stroke-width="2.2" stroke-linecap="round"/>
  <text x="74" y="95" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold">Say who was studied</text>
  <text x="74" y="111" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">the cases, how many of them, and how they entered the data</text>
  <rect x="44" y="126" width="16" height="16" fill="#ffffff" rx="3" stroke="#2f6f9f" stroke-width="1.6"/>
  <line x1="48" y1="134" x2="51.5" y2="138.5" stroke="#3f7a52" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="51.5" y1="138.5" x2="57" y2="129.5" stroke="#3f7a52" stroke-width="2.2" stroke-linecap="round"/>
  <text x="74" y="139" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold">Name the comparison in real units</text>
  <text x="74" y="155" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">which two groups, measured on what, on which scale</text>
  <rect x="44" y="170" width="16" height="16" fill="#ffffff" rx="3" stroke="#2f6f9f" stroke-width="1.6"/>
  <line x1="48" y1="178" x2="51.5" y2="182.5" stroke="#3f7a52" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="51.5" y1="182.5" x2="57" y2="173.5" stroke="#3f7a52" stroke-width="2.2" stroke-linecap="round"/>
  <text x="74" y="183" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold">Give the size, not only the direction</text>
  <text x="74" y="199" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">a number the reader can weigh against something familiar</text>
  <rect x="44" y="214" width="16" height="16" fill="#ffffff" rx="3" stroke="#2f6f9f" stroke-width="1.6"/>
  <line x1="48" y1="222" x2="51.5" y2="226.5" stroke="#3f7a52" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="51.5" y1="226.5" x2="57" y2="217.5" stroke="#3f7a52" stroke-width="2.2" stroke-linecap="round"/>
  <text x="74" y="227" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold">Attach the uncertainty</text>
  <text x="74" y="243" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">an interval of plausible values, not a lone p-value</text>
  <rect x="44" y="258" width="16" height="16" fill="#ffffff" rx="3" stroke="#2f6f9f" stroke-width="1.6"/>
  <line x1="48" y1="266" x2="51.5" y2="270.5" stroke="#3f7a52" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="51.5" y1="270.5" x2="57" y2="261.5" stroke="#3f7a52" stroke-width="2.2" stroke-linecap="round"/>
  <text x="74" y="271" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold">Pick the verb the design supports</text>
  <text x="74" y="287" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">associated with for observed groups, caused only after assignment</text>
  <rect x="44" y="302" width="16" height="16" fill="#ffffff" rx="3" stroke="#2f6f9f" stroke-width="1.6"/>
  <line x1="48" y1="310" x2="51.5" y2="314.5" stroke="#3f7a52" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="51.5" y1="314.5" x2="57" y2="305.5" stroke="#3f7a52" stroke-width="2.2" stroke-linecap="round"/>
  <text x="74" y="315" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold">Name what you could not rule out</text>
  <text x="74" y="331" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">confounding, self-report, one campus, one term</text>
  <rect x="44" y="346" width="16" height="16" fill="#ffffff" rx="3" stroke="#2f6f9f" stroke-width="1.6"/>
  <line x1="48" y1="354" x2="51.5" y2="358.5" stroke="#3f7a52" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="51.5" y1="358.5" x2="57" y2="349.5" stroke="#3f7a52" stroke-width="2.2" stroke-linecap="round"/>
  <text x="74" y="359" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold">Say what would change your mind</text>
  <text x="74" y="375" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="start">the measurement or the study that would move the estimate</text>
  <rect x="40" y="398" width="820" height="146" fill="#eef2f6" rx="8" stroke="#c9d1d9" stroke-width="1.2"/>
  <text x="58" y="422" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="bold">One conclusion carrying all seven parts</text>
  <text x="58" y="444" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">Among 120 students who answered a voluntary campus survey, those reporting seven or more hours of</text>
  <text x="58" y="461" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">sleep averaged about 5.8 higher on the course average out of 100. About half of that gap tracks paid</text>
  <text x="58" y="478" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">work hours; comparing students who work similar hours leaves about 3.0, with plausible values from</text>
  <text x="58" y="495" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">about zero to six. Nobody assigned sleep, so this is an association. Both numbers are self-reported,</text>
  <text x="58" y="512" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">from one campus in one term, so other differences could remain; a trial assigning sleep schedules</text>
  <text x="58" y="529" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start">would settle it.</text>
  <text x="40" y="568" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">In order: who, what comparison, how big, how uncertain, which verb, what remains open, what would change it.</text>
</svg>
