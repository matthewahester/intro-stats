<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img">
  <title>Two write-ups of the same numbers</title>
  <desc>Two columns. On the left, three defensible sentences with the reason each is safe. On the right, three overreaching sentences, each marked in red with the exact fault.</desc>
  <rect x="0" y="0" width="880" height="450" fill="#ffffff"/>
  <text x="440" y="30" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">The same numbers, two write-ups</text>
  <rect x="30" y="52" width="400" height="344" fill="#ffffff" rx="8" stroke="#c9d1d9" stroke-width="1.2"/>
  <rect x="30" y="52" width="400" height="34" fill="#eef2f6" rx="8"/>
  <rect x="30" y="78" width="400" height="8" fill="#eef2f6"/>
  <line x1="30" y1="52" x2="430" y2="52" stroke="#3f7a52" stroke-width="3" stroke-linecap="round"/>
  <text x="230" y="74" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3f7a52" text-anchor="middle" font-weight="bold">What these data support</text>
  <circle cx="50" cy="112" r="5" fill="#3f7a52"/>
  <text x="66" y="116" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">Alertness was higher, on average, among</text>
  <text x="66" y="133" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">students who slept 7 hours or more.</text>
  <text x="66" y="153" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3f7a52" text-anchor="start">a comparison, in the units that were</text>
  <text x="66" y="167" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3f7a52" text-anchor="start">measured</text>
  <circle cx="50" cy="203" r="5" fill="#3f7a52"/>
  <text x="66" y="207" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">Part of that gap travels with late-shift</text>
  <text x="66" y="224" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">work; within shift groups it is about 8.</text>
  <text x="66" y="244" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3f7a52" text-anchor="start">one third variable checked, and reported</text>
  <text x="66" y="258" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3f7a52" text-anchor="start">either way</text>
  <circle cx="50" cy="294" r="5" fill="#3f7a52"/>
  <text x="66" y="298" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">These data cannot separate sleep from</text>
  <text x="66" y="315" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">whatever else differs between these</text>
  <text x="66" y="332" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">students.</text>
  <text x="66" y="352" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3f7a52" text-anchor="start">the limit of the design, said out loud</text>
  <rect x="450" y="52" width="400" height="344" fill="#ffffff" rx="8" stroke="#c9d1d9" stroke-width="1.2"/>
  <rect x="450" y="52" width="400" height="34" fill="#eef2f6" rx="8"/>
  <rect x="450" y="78" width="400" height="8" fill="#eef2f6"/>
  <line x1="450" y1="52" x2="850" y2="52" stroke="#a33a3a" stroke-width="3" stroke-linecap="round"/>
  <text x="650" y="74" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#a33a3a" text-anchor="middle" font-weight="bold">What they do not support</text>
  <circle cx="470" cy="112" r="5" fill="#a33a3a"/>
  <text x="486" y="116" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">Sleeping under 7 hours lowers alertness.</text>
  <text x="486" y="136" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#a33a3a" text-anchor="start">a causal verb from a study that assigned</text>
  <text x="486" y="150" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#a33a3a" text-anchor="start">nothing</text>
  <circle cx="470" cy="186" r="5" fill="#a33a3a"/>
  <text x="486" y="190" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">Sleep one more hour and your alertness</text>
  <text x="486" y="207" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">will rise about 10.</text>
  <text x="486" y="227" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#a33a3a" text-anchor="start">a promise to one person built from two group</text>
  <text x="486" y="241" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#a33a3a" text-anchor="start">means</text>
  <circle cx="470" cy="277" r="5" fill="#a33a3a"/>
  <text x="486" y="281" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">This proves short sleep harms college</text>
  <text x="486" y="298" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start">students everywhere.</text>
  <text x="486" y="318" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#a33a3a" text-anchor="start">proof language, and a leap past the 80 who</text>
  <text x="486" y="332" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#a33a3a" text-anchor="start">came in</text>
  <text x="30" y="428" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Same clinic, same 80 students, same numbers. Only the verbs and the reach differ.</text>
</svg>
