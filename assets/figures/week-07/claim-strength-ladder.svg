<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" role="img">
  <title>A ladder of claims</title>
  <desc>Six study designs stacked from weakest at the bottom to strongest at the top, each paired with the strongest verb it supports; only the top two rungs license causal language.</desc>
  <rect x="0" y="0" width="880" height="480" fill="#ffffff"/>
  <text x="440" y="30" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">Each design buys one verb, and no stronger</text>
  <rect x="100" y="64" width="740" height="56" fill="#eef2f6" rx="5" stroke="#c9d1d9" stroke-width="1.1"/>
  <line x1="540" y1="64" x2="540" y2="120" stroke="#c9d1d9" stroke-width="1.1" stroke-linecap="round"/>
  <text x="114" y="96.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start">Several randomized experiments that agree</text>
  <text x="554" y="96.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3f7a52" text-anchor="start" font-weight="bold">causes</text>
  <rect x="100" y="122" width="740" height="56" fill="#ffffff" rx="5" stroke="#c9d1d9" stroke-width="1.1"/>
  <line x1="540" y1="122" x2="540" y2="178" stroke="#c9d1d9" stroke-width="1.1" stroke-linecap="round"/>
  <text x="114" y="154.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start">One randomized experiment</text>
  <text x="554" y="154.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3f7a52" text-anchor="start" font-weight="bold">caused, in this study</text>
  <rect x="100" y="180" width="740" height="56" fill="#eef2f6" rx="5" stroke="#c9d1d9" stroke-width="1.1"/>
  <line x1="540" y1="180" x2="540" y2="236" stroke="#c9d1d9" stroke-width="1.1" stroke-linecap="round"/>
  <text x="114" y="212.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start">Observational study, adjusted for what was measured</text>
  <text x="554" y="204" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2f6f9f" text-anchor="start" font-weight="bold">is still associated with,</text>
  <text x="554" y="222" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2f6f9f" text-anchor="start" font-weight="bold">after adjustment</text>
  <rect x="100" y="238" width="740" height="56" fill="#ffffff" rx="5" stroke="#c9d1d9" stroke-width="1.1"/>
  <line x1="540" y1="238" x2="540" y2="294" stroke="#c9d1d9" stroke-width="1.1" stroke-linecap="round"/>
  <text x="114" y="270.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start">Observational study, groups simply compared</text>
  <text x="554" y="270.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2f6f9f" text-anchor="start" font-weight="bold">was higher among</text>
  <rect x="100" y="296" width="740" height="56" fill="#eef2f6" rx="5" stroke="#c9d1d9" stroke-width="1.1"/>
  <line x1="540" y1="296" x2="540" y2="352" stroke="#c9d1d9" stroke-width="1.1" stroke-linecap="round"/>
  <text x="114" y="328.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start">Volunteer or convenience survey</text>
  <text x="554" y="328.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="start" font-weight="bold">was reported by</text>
  <rect x="100" y="354" width="740" height="56" fill="#ffffff" rx="5" stroke="#c9d1d9" stroke-width="1.1"/>
  <line x1="540" y1="354" x2="540" y2="410" stroke="#c9d1d9" stroke-width="1.1" stroke-linecap="round"/>
  <text x="114" y="386.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start">One person's story</text>
  <text x="554" y="386.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5b6672" text-anchor="start" font-weight="bold">happened to one person</text>
  <line x1="70" y1="406" x2="70" y2="77" stroke="#1f2933" stroke-width="1.6" stroke-linecap="round"/>
  <polygon points="70,68 65.95,77 74.05,77" fill="#1f2933"/>
  <text x="70" y="52" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">stronger</text>
  <text x="70" y="426" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">weaker</text>
  <text x="320" y="52" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">The design you were given</text>
  <text x="690" y="52" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">The strongest honest verb</text>
  <text x="100" y="454" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Below the top two rungs you may describe a pattern. You may not name a cause.</text>
</svg>
