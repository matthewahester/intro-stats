<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 590" width="880" height="590" role="img">
  <title>The campus clinic study on one page</title>
  <desc>A design summary table above a dot chart of mean alertness for short and longer sleepers. The pooled gap of 9.7 is wider than the within-shift gaps of 7.6 and 8.1.</desc>
  <rect x="0" y="0" width="880" height="590" fill="#ffffff"/>
  <text x="440" y="28" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">One study on one page</text>
  <rect x="70" y="50" width="710" height="27" fill="#eef2f6"/>
  <text x="79" y="67.8" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="bold">What to record</text>
  <text x="289" y="67.8" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="bold">The campus clinic study</text>
  <line x1="70" y1="50" x2="780" y2="50" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="79" y="94.8" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">Design</text>
  <text x="289" y="94.8" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">Observational; one clinic; one month; nothing assigned</text>
  <line x1="70" y1="77" x2="780" y2="77" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="79" y="121.8" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">Cases</text>
  <text x="289" y="121.8" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">80 students who came in for a routine visit</text>
  <line x1="70" y1="104" x2="780" y2="104" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="79" y="148.8" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">Explanatory</text>
  <text x="289" y="148.8" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">Nightly sleep: under 7 hours, or 7 hours and up</text>
  <line x1="70" y1="131" x2="780" y2="131" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="79" y="175.8" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">Response</text>
  <text x="289" y="175.8" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">Alertness score, 0 to 100, higher is more alert</text>
  <line x1="70" y1="158" x2="780" y2="158" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="79" y="202.8" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">Third variable</text>
  <text x="289" y="202.8" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6672" text-anchor="start">Works a late shift (24 students) or does not (56)</text>
  <line x1="70" y1="185" x2="780" y2="185" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="70" y1="212" x2="780" y2="212" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="280" y1="50" x2="280" y2="212" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="70" y1="50" x2="70" y2="212" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <line x1="780" y1="50" x2="780" y2="212" stroke="#c9d1d9" stroke-width="1" stroke-linecap="round"/>
  <text x="440" y="246" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">Mean alertness, by sleep group and by shift</text>
  <line x1="286.364" y1="414" x2="286.364" y2="418" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="286.364" y="431" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">55</text>
  <line x1="413.636" y1="414" x2="413.636" y2="418" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="413.636" y="431" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">60</text>
  <line x1="540.909" y1="414" x2="540.909" y2="418" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="540.909" y="431" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">65</text>
  <line x1="668.182" y1="414" x2="668.182" y2="418" stroke="#5b6672" stroke-width="1" stroke-linecap="round"/>
  <text x="668.182" y="431" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">70</text>
  <text x="490" y="452" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle">Mean alertness score</text>
  <text x="200" y="310.2" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end">All 80 students</text>
  <line x1="400.909" y1="306" x2="647.818" y2="306" stroke="#5b6672" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="400.909" cy="306" r="6.2" fill="#c2622d"/>
  <circle cx="647.818" cy="306" r="6.2" fill="#2f6f9f"/>
  <text x="524.364" y="293" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">gap 9.7</text>
  <text x="200" y="354.2" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end">Late shift (24)</text>
  <line x1="324.545" y1="350" x2="518" y2="350" stroke="#5b6672" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="324.545" cy="350" r="6.2" fill="#c2622d"/>
  <circle cx="518" cy="350" r="6.2" fill="#2f6f9f"/>
  <text x="421.273" y="337" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">gap 7.6</text>
  <text x="200" y="398.2" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end">No late shift (56)</text>
  <line x1="464.545" y1="394" x2="670.727" y2="394" stroke="#5b6672" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="464.545" cy="394" r="6.2" fill="#c2622d"/>
  <circle cx="670.727" cy="394" r="6.2" fill="#2f6f9f"/>
  <text x="567.636" y="381" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6672" text-anchor="middle">gap 8.1</text>
  <circle cx="300" cy="496" r="6.2" fill="#c2622d"/>
  <text x="314" y="500" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">slept under 7 hours</text>
  <circle cx="500" cy="496" r="6.2" fill="#2f6f9f"/>
  <text x="514" y="500" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start">slept 7 hours and up</text>
  <text x="440" y="528" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b5b95" text-anchor="middle" font-weight="bold">The pooled gap is wider than either within-shift gap.</text>
  <text x="70" y="560" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">Shift work travels with short sleep, so part of the pooled gap belongs to shift work.</text>
</svg>
