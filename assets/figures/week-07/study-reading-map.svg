<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img">
  <title>Six passes through one study</title>
  <desc>A flow diagram of six numbered questions to ask of any study, each labelled with the week of the course that supplies the tool, leading to a written conclusion.</desc>
  <rect x="0" y="0" width="880" height="450" fill="#ffffff"/>
  <text x="440" y="30" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">Six passes through one study</text>
  <rect x="32" y="62" width="252" height="104" fill="#eef2f6" rx="8" stroke="#c9d1d9" stroke-width="1.2"/>
  <circle cx="56" cy="86" r="12" fill="#2f6f9f"/>
  <text x="56" y="90.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <text x="158" y="120" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2933" text-anchor="middle">How were these data</text>
  <text x="158" y="138" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2933" text-anchor="middle">produced?</text>
  <text x="158" y="157" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">Week 2 — design and bias</text>
  <rect x="314" y="62" width="252" height="104" fill="#eef2f6" rx="8" stroke="#c9d1d9" stroke-width="1.2"/>
  <circle cx="338" cy="86" r="12" fill="#2f6f9f"/>
  <text x="338" y="90.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <text x="440" y="120" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2933" text-anchor="middle">What are the cases and</text>
  <text x="440" y="138" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2933" text-anchor="middle">variables?</text>
  <text x="440" y="157" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">Week 1 — data structure</text>
  <rect x="596" y="62" width="252" height="104" fill="#eef2f6" rx="8" stroke="#c9d1d9" stroke-width="1.2"/>
  <circle cx="620" cy="86" r="12" fill="#2f6f9f"/>
  <text x="620" y="90.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <text x="722" y="120" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2933" text-anchor="middle">What does one variable</text>
  <text x="722" y="138" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2933" text-anchor="middle">look like?</text>
  <text x="722" y="157" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">Week 3 — shape, center, spread</text>
  <rect x="32" y="200" width="252" height="104" fill="#eef2f6" rx="8" stroke="#c9d1d9" stroke-width="1.2"/>
  <circle cx="56" cy="224" r="12" fill="#2f6f9f"/>
  <text x="56" y="228.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
  <text x="158" y="258" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2933" text-anchor="middle">How do the groups</text>
  <text x="158" y="276" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2933" text-anchor="middle">compare?</text>
  <text x="158" y="295" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">Week 4 — difference and overlap</text>
  <rect x="314" y="200" width="252" height="104" fill="#eef2f6" rx="8" stroke="#c9d1d9" stroke-width="1.2"/>
  <circle cx="338" cy="224" r="12" fill="#2f6f9f"/>
  <text x="338" y="228.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
  <text x="440" y="258" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2933" text-anchor="middle">How do two variables</text>
  <text x="440" y="276" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2933" text-anchor="middle">move together?</text>
  <text x="440" y="295" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">Week 5 — association</text>
  <rect x="596" y="200" width="252" height="104" fill="#eef2f6" rx="8" stroke="#c9d1d9" stroke-width="1.2"/>
  <circle cx="620" cy="224" r="12" fill="#2f6f9f"/>
  <text x="620" y="228.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text>
  <text x="722" y="258" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2933" text-anchor="middle">What else could explain</text>
  <text x="722" y="276" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2933" text-anchor="middle">the pattern?</text>
  <text x="722" y="295" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle">Week 6 — confounding</text>
  <line x1="288" y1="114" x2="303" y2="114" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="310,114 303,110.85 303,117.15" fill="#5b6672"/>
  <line x1="570" y1="114" x2="585" y2="114" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="592,114 585,110.85 585,117.15" fill="#5b6672"/>
  <line x1="288" y1="252" x2="303" y2="252" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="310,252 303,248.85 303,255.15" fill="#5b6672"/>
  <line x1="570" y1="252" x2="585" y2="252" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="592,252 585,248.85 585,255.15" fill="#5b6672"/>
  <line x1="722" y1="166" x2="722" y2="184" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="722" y1="184" x2="158" y2="184" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="158" y1="184" x2="158" y2="191" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="158,198 161.15,191 154.85,191" fill="#5b6672"/>
  <line x1="722" y1="304" x2="722" y2="333" stroke="#5b6672" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="722,340 725.15,333 718.85,333" fill="#5b6672"/>
  <rect x="32" y="344" width="816" height="66" fill="#ffffff" rx="8" stroke="#2f6f9f" stroke-width="1.6"/>
  <text x="440" y="372" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2933" text-anchor="middle" font-weight="bold">Write the conclusion this design supports</text>
  <text x="440" y="393" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="middle">and say, in the same breath, what it cannot show</text>
  <text x="32" y="436" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5b6672" text-anchor="start">The passes run in order: nothing later is trustworthy if pass one went badly.</text>
</svg>
