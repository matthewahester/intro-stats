<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="640" height="350" role="img" aria-labelledby="title desc">
  <title id="title">Change in systolic blood pressure for 24 volunteers, by diet group (hypothetical)</title>
  <desc id="desc">Dot plot of blood pressure change. Reduced sodium: −12 to 2 mm Hg, mean −5.0, 10 of 12 had a drop. Usual diet: −6 to 6, mean 0.0, 5 of 12 had a drop. The groups overlap, but the reduced-sodium dots sit farther left.</desc>
  <rect x="0" y="0" width="640" height="350" fill="#ffffff" stroke="none" stroke-width="1.5"/>
  <line x1="60" y1="290" x2="610" y2="290" stroke="#1c1b19" stroke-width="1.5"/>
  <line x1="60" y1="290" x2="60" y2="295" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="60" y="309" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">−14</text>
  <line x1="110" y1="290" x2="110" y2="295" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="110" y="309" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">−12</text>
  <line x1="160" y1="290" x2="160" y2="295" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="160" y="309" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">−10</text>
