  <text x="260" y="309" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">−6</text>
  <line x1="310" y1="290" x2="310" y2="295" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="310" y="309" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">−4</text>
  <line x1="360" y1="290" x2="360" y2="295" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="360" y="309" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">−2</text>
  <line x1="410" y1="290" x2="410" y2="295" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="410" y="309" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">0</text>
  <line x1="460" y1="290" x2="460" y2="295" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="460" y="309" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">2</text>
  <line x1="510" y1="290" x2="510" y2="295" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="510" y="309" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">4</text>
  <line x1="560" y1="290" x2="560" y2="295" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="560" y="309" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">6</text>
  <line x1="610" y1="290" x2="610" y2="295" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="610" y="309" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#3a3935">8</text>
  <text x="335" y="332" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1c1b19">Change in systolic blood pressure over six weeks (mm Hg)</text>
  <line x1="410" y1="40" x2="410" y2="290" stroke="#8a8780" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="416" y="50" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#3a3935">no change</text>
  <text x="60" y="24" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#3a3935">Left of 0: blood pressure went down.   Right of 0: it went up.</text>
  <text x="60" y="70" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="start" fill="#8a4a2b" font-weight="bold">Reduced sodium (n = 12)</text>
