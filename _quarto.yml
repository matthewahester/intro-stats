project:
  type: website
  output-dir: _site
  # RENDER ALLOW-LIST. Fails safe — only the public sections below reach _site/.
  # A bare "*.qmd" matches RECURSIVELY in Quarto 1.8.26, so any .qmd dropped anywhere in
  # the tree would render and publish without anyone editing this file. The three public
  # root pages are listed explicitly instead, and the private surfaces .gitignore already
  # declares off-limits ("if they ever reappear in this public repo, treat that as a
  # mistake") are negated as belt-and-suspenders.
  render:
    - index.qmd
    - syllabus.qmd
    - schedule.qmd
    - notes/*.qmd
    - resources/*.qmd
    - "!bank/"
    - "!builder/"
    - "!_source_material/"
    - "!_site_planning/"
    - "!private/"
    - "!private_assessments/"
    - "!keys/"
    - "!answer_keys/"
    - "!exams/"
    - "!quizzes/"

  resources:
    - assets/figures/intro-stats-hero-web.webp
    - assets/figures/intro-stats-hero-web-800.webp

# Declare the document language explicitly for every page in the project rather than
# relying on the renderer's implicit default (WCAG 3.1.1 Language of Page).
lang: en

website:
  title: "Intro to Statistics"
  site-url: https://matthewhester.com/intro-stats/
  description: |
    Public-facing course notes for Intro to Statistics — concepts and
    interpretation-focused examples curated by Matt Hester.
  open-graph: true

  navbar:
    pinned: true
    background: dark
    logo: assets/figures/intro-stats-icon.png
    logo-alt: "Intro to Statistics crystal mark"
    left:
      - href: index.qmd
        text: Home
      - href: syllabus.qmd
        text: Syllabus
      - href: schedule.qmd
        text: Schedule

  sidebar:
    style: floating
    collapse-level: 2
    # Explicit href/text pairs: the sidebar label is a short navigation handle, while each
    # page keeps its own full title and its "Week N" subtitle on the page itself. There is
    # no Labs section because this course has no lab family.
    contents:
      - section: "Notes"
        href: notes/index.qmd
        contents:
          - href: notes/index.qmd
            text: "Overview"
          - href: notes/week01-data-evidence.qmd
            text: "1 — Data and evidence"
          - href: notes/week02-study-design.qmd
            text: "2 — Study design, bias, causality"
          - href: notes/week03-one-variable-summaries.qmd
            text: "3 — One-variable summaries"
          - href: notes/week04-comparing-groups.qmd
            text: "4 — Comparing groups"
          - href: notes/week05-association.qmd
            text: "5 — Association"
          - href: notes/week06-confounding.qmd
            text: "6 — Confounding & multivariable thinking"
          - href: notes/week07-synthesis-midterm.qmd
            text: "7 — First-half synthesis"
          - href: notes/week08-simple-regression.qmd
            text: "8 — Simple regression"
          - href: notes/week09-multiple-logistic-regression.qmd
            text: "9 — Multiple & logistic regression"
          - href: notes/week10-probability-risk-diagnosis.qmd
            text: "10 — Probability, risk, diagnosis"
          - href: notes/week11-simulation-based-inference.qmd
            text: "11 — Simulation-based inference"
          - href: notes/week12-classical-hypothesis-testing.qmd
            text: "12 — Classical hypothesis testing"
          - href: notes/week13-categorical-outcomes.qmd
            text: "13 — Categorical outcomes"
          - href: notes/week14-meta-analysis-forest-plots.qmd
            text: "14 — Meta-analysis & forest plots"
          - href: notes/week15-final-review.qmd
            text: "15 — Final review"
      - section: "Resources"
        href: resources/index.qmd
        contents:
          - href: resources/index.qmd
            text: "Overview"

  page-footer:
    left: "© 2026 Matt Hester · Intro to Statistics"
    center: "[Matt Hester · matthewhester.com](https://matthewhester.com/)"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-location: right
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    # Render mathematics as browser-native MathML instead of loading the MathJax runtime.
    # The equations become live text — selectable, searchable, and available to assistive
    # technology — and the page stops pulling a script to typeset them. The overflow rules
    # in styles.css target MathML elements to match.
    html-math-method: mathml
    fontsize: 1.05em
    mainfont: "Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
    monofont: "JetBrains Mono, Consolas, Menlo, monospace"
